ns' cameras would also record people and homes without their consent, raising privacy concerns.\n\nLegally, it is unclear who is responsible if a driverless van causes a crash: the manufacturer, the software developer or the delivery company. Insurance and road laws are still catching up. The vans could also be hacked; although this is illegal under the Computer Misuse Act, the company would need strong cyber security and would have to protect the data the vans collect.\n\nEnvironmentally, computer-controlled driving and route planning can reduce fuel use, and if the vans are electric they cut local air pollution. However, batteries need mined materials such as lithium and cobalt, and replacing the existing fleet early would create waste.\n\nIn conclusion, I think the company should introduce autonomous vans gradually. The safety and efficiency benefits are strong, but the legal questions about liability are not yet settled, and the company has an ethical duty to retrain or redeploy drivers rather than simply making them redundant."}, {"id": "lq-eth-03", "topic": "ethics", "paper": 2, "marks": 8, "q": "A health insurance company offers customers cheaper premiums if they wear a smartwatch that shares their heart rate, sleep and exercise data with the insurer. Discuss the ethical, legal and environmental impacts of this scheme.", "points": ["Benefit: encourages healthier lifestyles; customers can spot health problems early", "Benefit: active customers pay less; insurer can price risk more accurately", "Ethical: people with illnesses or disabilities may pay more, which may be unfair", "Ethical: people on low incomes may feel pressured to give up privacy to afford insurance", "Ethical/privacy: very detailed data about daily life and location is collected", "Legal: health data is sensitive personal data; clear, informed consent is needed", "Legal: data must be kept secure, used only for the stated purpose and not kept too long", "Legal: customers have the right to see and correct their data", "Risk: data breach or hacking could expose sensitive information", "Environmental: manufacturing more smartwatches uses raw materials and energy", "Environmental: short device lifespans create e-waste; data storage uses energy in data centres", "Conclusion: judgement on whether savings and health benefits outweigh privacy and fairness concerns"], "levels": "Level 3 (6-8 marks): ethical, legal and environmental impacts are all discussed and explained, both positives and negatives are considered in the context of the insurer's smartwatch scheme, and a reasoned conclusion is reached. Level 2 (3-5 marks): a range of relevant points with some explanation, but coverage is uneven, one-sided or only loosely linked to the insurer's smartwatch scheme. Level 1 (1-2 marks): one or two simple, mostly generic points with little or no explanation.", "model": "The scheme could have health benefits. A smartwatch encourages people to exercise and sleep well, and it may alert them to problems such as an irregular heartbeat. Customers who stay active pay less, and the insurer can set prices more accurately.\n\nHowever, there are serious ethical concerns. People with long-term illnesses or disabilities may not be able to reach exercise targets and could end up paying more through no fault of their own. People on lower incomes might feel they have to give up their privacy just to afford insurance, so the choice is not truly free. The watch also records a very detailed picture of someone's daily life, including when they sleep and where they go.\n\nLegally, health data is especially sensitive under data protection law. The insurer must get clear consent, explain exactly how the data will be used, keep it secure and not use it for other purposes or keep it longer than necessary. Customers have the right to see and correct their data. A data breach could expose very private information and lead to fines.\n\nEnvironmentally, giving out large numbers of smartwatches uses raw materials and energy to make them, and they are often replaced after a few years, adding to e-waste. Storing and analysing the data constantly also uses energy in data centres.\n\nOverall, I think the scheme has some benefits, but it should stay optional, with strong data protection and no penalty for customers who choose not to take part."}, {"id": "lq-eth-04", "topic": "ethics", "paper": 2, "marks": 8, "q": "A technology company offers its employees a microchip implanted in the hand that can open office doors, log in to computers and pay in the staff canteen. Discuss the ethical, legal and environmental issues raised by this use of computer-based implants.", "points": ["Benefit: convenient; no need to carry ID cards or remember passwords", "Benefit: harder to lose or lend than a card, which may improve security", "Ethical: employees may feel pressured to accept an implant to fit in or keep their job", "Ethical: implant is inside the body; removal is not simple; long-term health effects uncertain", "Ethical/privacy: employer could track movements, breaks and spending", "Legal: consent must be freely given; data collected counts as personal data", "Legal: data must be limited to what is needed and kept secure; who owns the data if the employee leaves", "Security: chip could be cloned or hacked; unauthorised access is illegal under the Computer Misuse Act", "Environmental: chips are tiny, have no battery and could replace plastic ID cards", "Environmental: readers, servers and replacement of outdated chips still use resources and create waste", "Conclusion: judgement, e.g. acceptable only if fully voluntary with an alternative card offered"], "levels": "Level 3 (6-8 marks): ethical, legal and environmental impacts are all discussed and explained, both positives and negatives are considered in the context of the employee microchip implants, and a reasoned conclusion is reached. Level 2 (3-5 marks): a range of relevant points with some explanation, but coverage is uneven, one-sided or only loosely linked to the employee microchip implants. Level 1 (1-2 marks): one or two simple, mostly generic points with little or no explanation.", "model": "The implants would be very convenient. Staff would not need to carry ID cards, remember passwords or bring a wallet, and a chip is harder to lose or lend to someone else than a card, which could improve security.\n\nThe main ethical issue is consent. Even if the scheme is described as optional, employees may feel pressured to accept an implant so that they do not look uncooperative. An implant is inside the body and cannot be removed as easily as a card, and some people may have health or religious objections. The company could also use the chip to track when staff arrive, how long their breaks are and what they buy, which is a significant loss of privacy.\n\nLegally, the data the chip produces is personal data, so the company must use it only for the stated purposes, keep it secure and not keep it longer than needed. Consent must be freely given, which is difficult in an employer-employee relationship. It is also unclear what happens to the chip and the data if the employee leaves. If someone cloned or hacked a chip, that would be illegal, but the risk remains.\n\nEnvironmentally, the chips are tiny and use very little energy, and could replace plastic ID cards. However, the readers and servers still use energy, and chips may become outdated and need replacing.\n\nOverall, I think the scheme is only acceptable if it is genuinely voluntary, with a normal ID card offered to anyone who prefers it, and strict limits on how the data is used."}, {"id": "lq-eth-05", "topic": "ethics", "paper": 2, "marks": 6, "q": "Many parents now use mobile phone apps that share their child's location with them at all times. Discuss the ethical, legal and environmental impacts of using mobile technology in this way.", "points": ["Benefit: parents feel reassured and can find a child quickly in an emergency", "Benefit: can give children more independence because parents feel safer", "Ethical: child's privacy and trust; constant monitoring may affect independence and relationships", "Ethical: data could reveal a child's routine to others if the account is accessed", "Legal: location data is personal data; app company must keep it secure and use it only for the stated purpose", "Legal: risk if data is shared with or sold to third parties; children's data needs extra protection", "Environmental: constant GPS use drains batteries, using more energy and shortening battery life", "Environmental: encourages children to have phones at a younger age, adding to manufacturing and e-waste", "Conclusion: balanced judgement, e.g. reasonable for younger children with agreement, less so for older teenagers"], "levels": "Level 3 (5-6 marks): a clear, balanced discussion covering ethical, legal and environmental points, explained and applied to parental location-sharing apps, with a brief justified conclusion. Level 2 (3-4 marks): relevant points with some explanation, but limited balance or only two of the three areas covered. Level 1 (1-2 marks): isolated, generic points with little explanation.", "model": "Location-sharing apps can make parents feel reassured, because they can see where their child is and find them quickly in an emergency. Some parents may even allow their children more independence, such as walking to school alone, because they can check they arrived safely.\n\nHowever, constant tracking raises ethical questions about a child's privacy and trust. Older teenagers may feel they are not trusted, which could damage the relationship, and they may not learn to manage risks for themselves. If someone else gained access to the account, they could learn the child's daily routine, which could put them in danger.\n\nLegally, location data is personal data. The app company must keep it secure, use it only for the stated purpose and should not share or sell it without proper consent. Children's data needs particular care.\n\nEnvironmentally, keeping GPS switched on uses more battery power, so phones are charged more often and batteries wear out faster. The apps also encourage younger children to have smartphones, increasing manufacturing and eventually e-waste.\n\nOverall, I think these apps are reasonable for younger children if used openly, but for older teenagers the loss of privacy and trust may outweigh the benefits."}, {"id": "lq-eth-06", "topic": "ethics", "paper": 2, "marks": 6, "q": "A town council plans to provide free, open Wi-Fi throughout the town centre. Discuss the ethical, legal and environmental impacts of this plan.", "points": ["Benefit: free internet access helps people who cannot afford data, reducing the digital divide", "Benefit: supports local businesses, tourists and access to public services", "Risk: open, unencrypted networks allow attackers to intercept data; fake hotspots", "Ethical/privacy: council could collect data about users and track movement around town", "Legal: council must handle any personal data collected (e.g. sign-up details) under data protection law", "Legal: illegal activity (e.g. hacking, illegal downloading) could be carried out anonymously on the network", "Environmental: access points and supporting equipment use electricity constantly", "Environmental: hardware will eventually need replacing, creating e-waste", "Conclusion: justified judgement, e.g. worthwhile with security measures and clear privacy policy"], "levels": "Level 3 (5-6 marks): a clear, balanced discussion covering ethical, legal and environmental points, explained and applied to the town centre Wi-Fi, with a brief justified conclusion. Level 2 (3-4 marks): relevant points with some explanation, but limited balance or only two of the three areas covered. Level 1 (1-2 marks): isolated, generic points with little explanation.", "model": "Free Wi-Fi would help people who cannot afford mobile data, such as some low-income families or older people, to get online, which helps reduce the digital divide. It would also support local shops, tourists and access to council services.\n\nHowever, open Wi-Fi is often unencrypted, so attackers could intercept data or set up fake hotspots with similar names to steal passwords. Users may not realise these risks. There are also privacy concerns, because the council could log which devices connect and track people's movements around the town.\n\nLegally, the council must follow data protection law for any personal details it collects, such as email addresses used to sign up, keeping them secure and not using them for other purposes. Because the network is open, people could use it for illegal activities such as hacking or downloading pirated content, which may be harder to trace.\n\nEnvironmentally, the access points run constantly and use electricity, and the equipment will need replacing in future, creating e-waste. The impact is fairly small, though, compared with the benefits.\n\nOverall, I think the plan is worthwhile, as long as the council publishes a clear privacy policy, collects as little data as possible and warns users to use secure websites."}, {"id": "lq-eth-07", "topic": "ethics", "paper": 2, "marks": 8, "q": "Hacking can be carried out by criminals but also by 'ethical hackers' employed to test systems. Discuss the ethical, legal and environmental impacts of hacking on individuals, organisations and society.", "points": ["Criminal hacking: theft of personal and financial data leads to fraud and distress for individuals", "Criminal hacking: organisations suffer financial loss, downtime, reputational damage", "Attacks on hospitals, transport or energy can put lives at risk", "Ethical: hacktivists may claim a good cause, but still harm innocent people", "Ethical hacking: with permission, finds weaknesses before criminals do, improving security for everyone", "Legal: unauthorised access and spreading malware are illegal under the Computer Misuse Act 1990", "Legal: hackers abroad are hard to prosecute because laws and jurisdictions differ", "Legal: organisations that fail to protect personal data can be fined under data protection law", "Environmental: attacks such as DDoS waste energy across many computers and servers", "Environmental: botnets use victims' devices and electricity without their knowledge", "Environmental: organisations may replace hardware after attacks, adding to e-waste", "Conclusion: criminal hacking is harmful; ethical hacking is beneficial and legal because of permission"], "levels": "Level 3 (6-8 marks): ethical, legal and environmental impacts are all discussed and explained, both positives and negatives are considered in the context of hacking, and a reasoned conclusion is reached. Level 2 (3-5 marks): a range of relevant points with some explanation, but coverage is uneven, one-sided or only loosely linked to hacking. Level 1 (1-2 marks): one or two simple, mostly generic points with little or no explanation.", "model": "Criminal hacking causes serious harm. Individuals can have their personal or bank details stolen, leading to fraud, stress and time spent recovering accounts. Organisations can lose money, have their services shut down and lose customers' trust. When hackers target hospitals, transport or energy systems, people's safety can be put at risk.\n\nEthically, some hackers, known as hacktivists, claim to act for a good cause, such as exposing wrongdoing. However, their actions often affect innocent people and bypass proper ways of holding organisations to account. Ethical hackers, by contrast, test systems with the owner's permission and report weaknesses so they can be fixed, which makes systems safer for everyone.\n\nLegally, gaining unauthorised access to a computer or spreading malware is an offence under the Computer Misuse Act 1990. The key difference with ethical hacking is permission. Many criminal hackers operate from other countries, so it can be hard to prosecute them. Organisations also have a legal duty under data protection law to protect personal data, and can be fined if poor security leads to a breach.\n\nEnvironmentally, attacks such as denial of service flood servers with traffic, wasting energy. Botnets secretly use thousands of victims' devices and electricity. After a serious attack, organisations may replace equipment, adding to e-waste.\n\nOverall, criminal hacking has a strongly negative impact on society, while ethical hacking is valuable and legal. Organisations should invest in ethical hacking and good security to reduce the harm caused by criminals."}, {"id": "lq-eth-08", "topic": "ethics", "paper": 2, "marks": 9, "q": "A government proposes that messaging apps must give the security services a way to read encrypted messages when investigating serious crime. Discuss the ethical, legal and environmental impacts of this proposal. You should give a justified conclusion.", "points": ["For: could help detect and prevent terrorism, child abuse and organised crime", "For: governments argue they have a duty to protect citizens and need evidence", "For: access could be limited to named suspects, approved by a warrant and checked by independent oversight, so most people's messages would never be read", "Against: privacy is widely seen as a right; innocent people's messages could be accessed", "Against: powers could be misused or extended beyond serious crime", "Against: a 'backdoor' weakens encryption and could be found and exploited by criminals or hostile states", "Against: criminals may switch to other apps, so ordinary users bear most of the risk", "Legal: access would need clear laws, warrants and independent oversight", "Legal: messaging companies operate in many countries with different laws; may withdraw services", "Legal: data protection duties for stored data; risk of breaches", "Environmental: storing and processing extra data uses energy in data centres", "Environmental: relatively small direct impact compared with ethical and legal issues", "Conclusion: justified judgement weighing public safety against the privacy and security of everyone; either side can gain full credit if the judgement is supported by the points made"], "levels": "Level 3 (7-9 marks): a detailed, well-balanced discussion of ethical, legal and environmental impacts, with benefits and drawbacks clearly applied to the proposal to access encrypted messages, and a justified conclusion. Level 2 (4-6 marks): several relevant points with some explanation, but one area (often environmental) or one side of the argument is thin, or the conclusion is missing or unsupported. Level 1 (1-3 marks): a few basic points, mostly listed rather than explained, little application to the proposal to access encrypted messages and no real conclusion.", "model": "Supporters of the proposal argue that it would help the security services detect and prevent serious crimes such as terrorism and child abuse. Criminals increasingly use encrypted apps, so without access, investigators may miss vital evidence. Governments argue they have a duty to protect the public. Supporters also say access could be limited to named suspects, approved by a warrant and checked by independent oversight, so most people's messages would never be read.\n\nHowever, there are strong ethical arguments against it. Many people see privacy as a basic right, and the messages of innocent people could be accessed. There is also a risk that powers introduced for serious crime are later misused or widened. People might become less willing to speak freely if they think they could be monitored.\n\nThere is also a security problem. Creating a way in for the government means deliberately weakening encryption, and that weakness could be discovered by criminals or hostile states, making everyone less safe. Determined criminals might simply move to other apps, so ordinary users would bear most of the risk.\n\nLegally, any access would need clear laws, warrants and independent oversight to prevent abuse. Messaging companies operate across many countries with different laws, and some might withdraw their services rather than comply. Any extra data that is stored must be protected under data protection law.\n\nEnvironmentally, the impact is smaller, but storing and processing extra data would use more energy in data centres.\n\nIn conclusion, both public safety and privacy matter, and reasonable people reach different views. On balance, I think the proposal should only go ahead if access is limited to named suspects with a warrant and independent oversight, and does not involve weakening encryption for every user, because a weakness that criminals could also exploit would make everyone less secure."}, {"id": "lq-eth-09", "topic": "ethics", "paper": 2, "marks": 6, "q": "A supermarket chain replaces most of its checkout staff with self-service tills and AI cameras that detect shoplifting. Discuss the ethical, legal and environmental impacts of this change.", "points": ["Benefit: shorter queues and lower costs for the business, possibly lower prices", "Ethical: job losses for checkout staff, especially affecting local communities", "Ethical: older or disabled customers may find self-service harder; less human contact", "Ethical: AI cameras may wrongly accuse customers; risk of bias", "Legal: camera images are personal data; must be kept secure and not kept too long; customers must be told", "Legal: accountability if a customer is wrongly accused by the system", "Environmental: new tills and cameras use resources; old tills become e-waste", "Environmental: cameras and AI processing use electricity constantly", "Conclusion: justified judgement, e.g. acceptable if staffed tills remain and AI decisions are checked by people"], "levels": "Level 3 (5-6 marks): a clear, balanced discussion covering ethical, legal and environmental points, explained and applied to the supermarket's self-service tills and AI cameras, with a brief justified conclusion. Level 2 (3-4 marks): relevant points with some explanation, but limited balance or only two of the three areas covered. Level 1 (1-2 marks): isolated, generic points with little explanation.", "model": "Self-service tills and AI cameras could reduce queues and cut the supermarket's costs, which might lead to lower prices. The cameras could also reduce theft.\n\nHowever, many checkout staff could lose their jobs, which could hit local communities hard, especially where there are few other jobs. Some older or disabled customers find self-service tills difficult and may value talking to a person. The AI cameras might wrongly flag innocent customers, and if the system was trained on biased data, some groups could be accused more often than others.\n\nLegally, camera footage that identifies people is personal data. The supermarket must tell customers that cameras are in use, keep the footage secure and delete it when it is no longer needed. It must also be clear who is accountable if someone is wrongly accused by an automated system.\n\nEnvironmentally, installing new tills and cameras uses raw materials and energy, and the old tills become e-waste unless they are recycled. The cameras and AI processing also use electricity all the time.\n\nOverall, I think the change is acceptable only if the supermarket keeps some staffed tills for customers who need them and has a person check any AI alert before a customer is approached."}, {"id": "lq-eth-10", "topic": "ethics", "paper": 2, "marks": 9, "q": "A smartphone manufacturer releases a new model every year and stops providing security updates for phones after three years. Discuss the ethical, legal and environmental impacts of this approach. You should give a justified conclusion.", "points": ["Benefit: new features and improved performance; drives innovation and jobs", "Benefit: newer phones may be more energy-efficient and have better security", "Ethical: customers pressured to upgrade; people who cannot afford new phones are left with insecure devices (digital divide)", "Ethical: working conditions in mining and factories for materials and assembly", "Security: phones without updates are vulnerable to hacking and malware", "Legal: users of unsupported phones risk data breaches; organisations must protect personal data on staff phones", "Legal: consumer protection and right-to-repair rules in some places require longer support or spare parts", "Environmental: yearly releases encourage frequent replacement, creating large amounts of e-waste", "Environmental: toxic materials in old phones can pollute land and water if not recycled", "Environmental: mining for lithium, cobalt and rare earth elements damages habitats and uses energy", "Environmental: manufacturing a phone uses far more energy than using it; longer use reduces impact", "Mitigation: trade-in and recycling schemes, refurbished phones, longer update support", "Conclusion: justified judgement, e.g. three years of updates is too short given environmental and security costs"], "levels": "Level 3 (7-9 marks): a detailed, well-balanced discussion of ethical, legal and environmental impacts, with benefits and drawbacks clearly applied to the manufacturer's yearly releases and three-year update policy, and a justified conclusion. Level 2 (4-6 marks): several relevant points with some explanation, but one area (often environmental) or one side of the argument is thin, or the conclusion is missing or unsupported. Level 1 (1-3 marks): a few basic points, mostly listed rather than explained, little application to the manufacturer's yearly releases and three-year update policy and no real conclusion.", "model": "Releasing a new phone every year allows the manufacturer to introduce new features, better cameras and faster processors, and it supports jobs and innovation. Newer phones can also be more energy-efficient and include better security features.\n\nHowever, stopping updates after three years creates ethical problems. Customers may feel pressured to upgrade even when their phone still works. People who cannot afford a new phone are left using a device that no longer receives security fixes, so they are more at risk, which widens the digital divide. There are also concerns about working conditions in the mines and factories that supply the materials.\n\nUnsupported phones are easier to attack with malware, so users' personal data is at greater risk. Organisations that let staff use their own phones must still protect personal data under data protection law. In some places, consumer and right-to-repair laws are starting to require manufacturers to provide spare parts or longer support.\n\nThe environmental impact is the most serious. Encouraging frequent upgrades creates large amounts of e-waste, and old phones contain toxic materials that can pollute land and water if not recycled. Making each new phone requires mining lithium, cobalt and rare earth elements, which damages habitats and uses a lot of energy. Most of a phone's carbon footprint comes from manufacturing, so keeping phones for longer greatly reduces the impact.\n\nIn conclusion, I think three years of updates is too short. Although new models bring benefits, the manufacturer should support phones for longer and offer repair and recycling schemes to reduce both security risks and e-waste."}]}};
</script>
<script>
(function(){
"use strict";
const B = window.BANK;
const TOPICS = B.topics;            // [{topic,name,lessons:[...]}]
const COLOR = t => `var(--t-${t})`;
const $app = document.getElementById('app'), $top = document.getElementById('topbar');
const esc = s => String(s ?? '').replace(/[&<>"]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
// inline `code` support
const fmt = s => esc(s).replace(/`([^`]+)`/g, '<code>$1</code>');
const DAY = 864e5, now = () => Date.now();
const INTERVAL = [0, 1*DAY, 3*DAY, 7*DAY, 16*DAY, 35*DAY]; // by box 1..5
const NEW_PER_SESSION = 12, SESSION_MAX = 20;

// ---------- state ----------
const KEY = 'cs-revision-v1';
let S = {cards:{}, mcq:{}, days:{}, drills:{}, practice:{}, mocks:[], examDate:'', showOff:false, updated:0};
try { const raw = localStorage.getItem(KEY); if (raw) S = Object.assign(S, JSON.parse(raw)); } catch(e) {}
let syncRef = null, syncTimer = null;
function save(){
  S.updated = now();
  try { localStorage.setItem(KEY, JSON.stringify(S)); } catch(e) {}
  if (syncRef){ clearTimeout(syncTimer); syncTimer = setTimeout(() => { syncRef.set({state: JSON.stringify(S), updated: S.updated}).catch(()=>{ syncRef = null; renderSyncNote(); }); }, 1500); }
}
// ---------- index ----------
const PAPER = {algorithms:1, programming:1};
const paperOf = t => PAPER[t] || 2;
const P = B.practice || {parsons:[], traces:[], programs:[], longq:[]};
let cards = [], mcqs = [];
const lessonById = {};
TOPICS.forEach(T => T.lessons.forEach((L, li) => { L.topic = T.topic; L.n = li + 1; lessonById[L.id] = L; }));
const offOK = x => S.showOff || !x;
function buildIndex(){
  cards = []; mcqs = [];
  TOPICS.forEach(T => T.lessons.forEach(L => {
    (L.flashcards||[]).forEach((c, i) => { if (offOK(L.offSpec) && offOK(c.offSpec)) cards.push({id: `${L.id}:f${i}`, lesson: L.id, topic: T.topic, q: c.q, a: c.a, code: c.code}); });
    (L.mcq||[]).forEach((m, i) => { if (offOK(L.offSpec) && offOK(m.offSpec)) mcqs.push({id: `${L.id}:m${i}`, lesson: L.id, topic: T.topic, ...m}); });
  }));
}
buildIndex();
const liveLessons = T => T.lessons.filter(L => offOK(L.offSpec));
const offChip = v => v ? `<span class="chip ${v==='removed'?'bad':''}" title="${v==='removed'?'Removed from the AQA specification for exams from 2027':'Not in the AQA specification'}">${v==='removed'?'Not examined from 2027':'Beyond the spec'}</span>` : '';
function markDay(kind, n=1){ const d = new Date().toISOString().slice(0,10); S.days[d] = S.days[d] || {cards:0, quiz:0, drills:0}; S.days[d][kind] = (S.days[d][kind]||0) + n; }
function streak(){ let s = 0; const d = new Date(); for(;;){ const k = d.toISOString().slice(0,10); const v = S.days[k]; if (v && Object.values(v).reduce((a,b)=>a+b,0)>0){ s++; d.setDate(d.getDate()-1); } else { if (s===0 && k===new Date().toISOString().slice(0,10)){ d.setDate(d.getDate()-1); continue; } break; } } return s; }

// mastery
function cardScore(id){ const c = S.cards[id]; return c ? Math.min(c.box, 4)/4 : 0; }
function mcqScore(id){ const m = S.mcq[id]; return m ? (m.last ? 1 : 0) : 0; }
function lessonMastery(L){
  const cs = cards.filter(c => c.lesson === L.id), ms = mcqs.filter(m => m.lesson === L.id);
  const a = cs.length ? cs.reduce((s,c)=>s+cardScore(c.id),0)/cs.length : 0;
  const b = ms.length ? ms.reduce((s,m)=>s+mcqScore(m.id),0)/ms.length : 0;
  return cs.length && ms.length ? 0.6*a + 0.4*b : (cs.length ? a : b);
}
function topicMastery(T){ const ls = liveLessons(T); return ls.length ? ls.reduce((s,L)=>s+lessonMastery(L),0)/ls.length : 0; }
function dueCards(topicSet){ const t = now(); return cards.filter(c => (!topicSet || topicSet.has(c.topic)) && S.cards[c.id] && S.cards[c.id].due <= t); }
function newCards(topicSet){ return cards.filter(c => (!topicSet || topicSet.has(c.topic)) && !S.cards[c.id]); }
const seenCount = () => Object.keys(S.cards).length;
const secure = () => cards.filter(c => S.cards[c.id] && S.cards[c.id].box >= 3).length;

function byte(p, t){ const on = Math.round(p*8); let h = '<div class="byte" aria-hidden="true">'; for (let i=0;i<8;i++) h += `<i class="${i<on?'on':''}" style="${i<on?`background:${COLOR(t)}`:''}"></i>`; return h + '</div>'; }
const pct = p => Math.round(p*100) + '%';
const srcLabel = L => (L.fromSpec || !L.pdfPage) ? 'From the AQA specification' : `Notes: page ${L.pdfPage}`;

// ---------- FLASHCARDS ----------
let F = null;
function shuffle(a){ a = a.slice(); for (let i=a.length-1;i>0;i--){ const j = Math.floor(Math.random()*(i+1)); [a[i],a[j]] = [a[j],a[i]]; } return a; }
function startFlash(topicSet, explicit){
  let q;
  if (explicit) q = shuffle(explicit);
  else {
    const due = shuffle(dueCards(topicSet)).sort((a,b)=>S.cards[a.id].due - S.cards[b.id].due).slice(0, SESSION_MAX);
    const room = Math.max(0, Math.min(NEW_PER_SESSION, SESSION_MAX - due.length));
    q = due.concat(newCards(topicSet).slice(0, room));
    if (!q.length){ // nothing due and nothing new: practise the weakest
      q = shuffle(cards.filter(c=>!topicSet||topicSet.has(c.topic))).sort((a,b)=>(S.cards[a.id]?.box||0)-(S.cards[b.id]?.box||0)).slice(0, 15);
    }
  }
  F = {queue: q, i: 0, shown: false, done: 0, total: q.length, res: {again:0, hard:0, good:0}, back: view};
  go({name:'flash'});
}
function flash(){
  topbar('Flashcards', `${F.done} of ${F.total} done`, () => go(F.back.name==='flash'?{name:'home'}:F.back));
  if (F.i >= F.queue.length) return flashDone();
  const c = F.queue[F.i], L = lessonById[c.lesson], st = S.cards[c.id];
  $app.innerHTML = `<div class="progress" aria-hidden="true"><i style="width:${F.total?Math.round(F.done/F.total*100):0}%"></i></div>
  <article class="card"><div class="row"><span class="chip" style="border-color:${COLOR(c.topic)}">${esc(L.title)}</span>${st?'':'<span class="chip warn">New</span>'}</div>
    <div class="q">${fmt(c.q)}</div>${c.code?`<pre class="code">${esc(c.code)}</pre>`:''}
    ${F.shown?`<div class="a">${fmt(c.a)}</div>`:''}
    <div class="src tiny">${srcLabel(L)}</div></article>
  ${F.shown ? `<div class="grades">
      <button class="btn g-again" id="gA">Again<small>see it soon</small></button>
      <button class="btn g-hard" id="gH">Shaky<small>tomorrow</small></button>
      <button class="btn g-good" id="gG">Knew it<small>${nextLabel(c)}</small></button></div>`
    : `<button class="btn primary block flip" id="flipBtn">Show answer</button><p class="tiny center">Say or write your answer first, then check.</p>`}`;
  if (F.shown){ document.getElementById('gA').onclick=()=>grade(0); document.getElementById('gH').onclick=()=>grade(1); document.getElementById('gG').onclick=()=>grade(2); }
  else document.getElementById('flipBtn').onclick = () => { F.shown = true; flash(); };
}
function nextLabel(c){ const b = Math.min(5, (S.cards[c.id]?.box||0)+1); const d = Math.round(INTERVAL[b]/DAY); return d<=1?'tomorrow':`in ${d} days`; }
function grade(g){
  const c = F.queue[F.i]; const st = S.cards[c.id] || {box:0, due:0, right:0, wrong:0};
  if (g===0){ st.box = 1; st.due = now() + 10*60e3; st.wrong++; F.res.again++; F.queue.push(c); F.total++; }
  else if (g===1){ st.box = Math.max(1, st.box); st.due = now() + DAY; st.right++; F.res.hard++; }
  else { st.box = Math.min(5, st.box+1); st.due = now() + INTERVAL[st.box]; st.right++; F.res.good++; }
  st.last = now(); S.cards[c.id] = st; markDay('cards'); save();
  F.i++; F.done++; F.shown = false; flash();
}
function flashDone(){
  const r = F.res;
  $app.innerHTML = `<section class="panel center" style="display:flex;flex-direction:column;gap:12px;align-items:center;padding:28px 16px">
    <div class="label">Session complete</div><div class="score">${r.good}</div><div class="muted">cards you knew</div>
    <div class="row" style="justify-content:center"><span class="chip good">Knew ${r.good}</span><span class="chip warn">Shaky ${r.hard}</span><span class="chip bad">Again ${r.again}</span></div>
    <p class="muted small" style="max-width:420px">Cards you knew come back after a longer gap each time. Shaky ones return tomorrow.</p>
    <div class="row" style="justify-content:center"><button class="btn primary" id="again">Another session</button><button class="btn" id="home">Home</button></div></section>`;
  document.getElementById('again').onclick = () => startFlash(F.back.name==='topic'?new Set([F.back.t]):null);
  document.getElementById('home').onclick = () => go({name:'home'});
}

// ---------- QUIZ ----------
let Q = null, quizPick = new Set(TOPICS.map(t=>t.topic));
function quizSetup(){
  topbar('Quick quiz', 'Choose topics', () => go({name:'home'}));
  let h = `<h1>Quiz</h1><p class="muted" style="margin:0">Questions you got wrong before, or have not tried yet, come up more often.</p>
  <div class="label">Topics</div><div class="picker">${TOPICS.map(T=>`<button class="pick" data-t="${T.topic}" aria-pressed="${quizPick.has(T.topic)}"><span class="dot" style="background:${COLOR(T.topic)}"></span>${esc(T.name)}</button>`).join('')}</div>
  <div class="label">Length</div><div class="picker">${[10,20,30].map(n=>`<button class="pick len" data-n="${n}" aria-pressed="${n===10}">${n} questions</button>`).join('')}</div>
  <button class="btn primary block" id="qGo">Start quiz</button>`;
  $app.innerHTML = h; let len = 10;
  $app.querySelectorAll('.pick[data-t]').forEach(b => b.onclick = () => { const t=b.dataset.t; quizPick.has(t)?quizPick.delete(t):quizPick.add(t); if(!quizPick.size) quizPick.add(t); b.setAttribute('aria-pressed', quizPick.has(t)); });
  $app.querySelectorAll('.len').forEach(b => b.onclick = () => { len=+b.dataset.n; $app.querySelectorAll('.len').forEach(x=>x.setAttribute('aria-pressed', x===b)); });
  document.getElementById('qGo').onclick = () => startQuiz(new Set(quizPick), len);
}
function startQuiz(topicSet, n, explicit){
  let pool = explicit ? explicit.slice() : mcqs.filter(m=>topicSet.has(m.topic));
  // weight: wrong last time 3, unseen 2, right 1
  const w = m => { const s = S.mcq[m.id]; return !s ? 2 : (s.last ? 1 : 3.5); };
  const picked = []; pool = pool.slice();
  while (picked.length < n && pool.length){ const tot = pool.reduce((s,m)=>s+w(m),0); let r = Math.random()*tot, k = 0; for (; k<pool.length; k++){ r -= w(pool[k]); if (r<=0) break; } picked.push(pool.splice(Math.min(k,pool.length-1),1)[0]); }
  Q = {items: picked.map(m => ({m, order: shuffle([0,1,2,3])})), i: 0, chosen: null, score: 0, wrong: [], back: view};
  go({name:'quiz'});
}
function quiz(){
  topbar('Quiz', `Question ${Math.min(Q.i+1,Q.items.length)} of ${Q.items.length}`, () => go(Q.back.name==='quiz'?{name:'home'}:Q.back));
  if (Q.i >= Q.items.length) return quizDone();
  const {m, order} = Q.items[Q.i], L = lessonById[m.lesson], answered = Q.chosen !== null;
  let h = `<div class="progress" aria-hidden="true"><i style="width:${Math.round(Q.i/Q.items.length*100)}%"></i></div>
  <div class="row"><span class="chip">${esc(L.title)}</span></div>
  <h2 style="font-size:20px;line-height:1.35">${fmt(m.q)}</h2>${m.code?`<pre class="code">${esc(m.code)}</pre>`:''}
  <div class="opts">${order.map((oi,pos)=>{ let cls=''; if(answered){ if(oi===m.answer) cls='correct'; else if(oi===Q.chosen) cls='wrong'; }
    return `<button class="opt ${cls}" data-o="${oi}" ${answered?'disabled':''}><span class="k">${'ABCD'[pos]}</span><span>${fmt(m.options[oi])}</span></button>`;}).join('')}</div>`;
  if (answered){ const ok = Q.chosen===m.answer;
    h += `<div class="explain ${ok?'good':'bad'}"><b>${ok?'Correct.':'Not quite.'}</b>${fmt(m.explain||'')}<div class="tiny" style="margin-top:6px">${srcLabel(L)}</div></div>
    <button class="btn primary block" id="qNext">${Q.i+1<Q.items.length?'Next question':'See score'}</button>`; }
  $app.innerHTML = h;
  if (!answered) $app.querySelectorAll('.opt').forEach(b => b.onclick = () => answer(+b.dataset.o));
  else document.getElementById('qNext').onclick = () => { Q.i++; Q.chosen=null; quiz(); window.scrollTo(0,0); };
}
function answer(o){
  const {m} = Q.items[Q.i]; Q.chosen = o; const ok = o===m.answer; if (ok) Q.score++; else Q.wrong.push(m);
  const s = S.mcq[m.id] || {tries:0, right:0}; s.tries++; if (ok) s.right++; s.last = ok; s.at = now(); S.mcq[m.id] = s; markDay('quiz'); save(); quiz();
}
function quizDone(){
  const n = Q.items.length, p = n ? Q.score/n : 0;
  let h = `<section class="panel center" style="display:flex;flex-direction:column;gap:10px;align-items:center;padding:28px 16px">
    <div class="label">Quiz complete</div><div class="score">${Q.score}<span class="muted" style="font-size:28px"> / ${n}</span></div>
    <span class="chip ${p>=.8?'good':p>=.5?'warn':'bad'}">${pct(p)}</span>
    <div class="row" style="justify-content:center"><button class="btn primary" id="qAgain">New quiz</button><button class="btn" id="home">Home</button></div></section>`;
  if (Q.wrong.length){ h += `<section class="panel"><h2 style="margin-bottom:8px">To look at again</h2><table class="tbl"><tbody>${Q.wrong.map(m=>`<tr><td><b>${fmt(m.q)}</b><br><span class="muted">Answer: ${fmt(m.options[m.answer])}</span><br><span class="tiny">${esc(lessonById[m.lesson].title)}${(lessonById[m.lesson].fromSpec||!lessonById[m.lesson].pdfPage)?'':` &middot; notes page ${lessonById[m.lesson].pdfPage}`}</span></td></tr>`).join('')}</tbody></table></section>`; }
  $app.innerHTML = h;
  document.getElementById('qAgain').onclick = () => go({name:'quizSetup'});
  document.getElementById('home').onclick = () => go({name:'home'});
}

// ---------- DRILLS ----------
const R = (a,b) => a + Math.floor(Math.random()*(b-a+1));
const bin8 = n => n.toString(2).padStart(8,'0');
const hex = n => n.toString(16).toUpperCase();
const fmtN = n => n.toLocaleString('en-GB');
const DRILLS = [
  {id:'d2b', name:'Denary to binary', make(){ const n=R(1,255); return {q:`Convert ${n} to 8-bit binary.`, ans:[bin8(n)], norm:'bits', how:`Place values 128 64 32 16 8 4 2 1. ${n} = ${placeSum(n)} = ${bin8(n)}.`}; }},
  {id:'b2d', name:'Binary to denary', make(){ const n=R(1,255); return {q:`Convert ${bin8(n)} to denary.`, ans:[String(n)], how:`Add the place values where there is a 1: ${placeSum(n)} = ${n}.`}; }},
  {id:'d2h', name:'Denary to hex', make(){ const n=R(10,255); return {q:`Convert ${n} to hexadecimal.`, ans:[hex(n)], norm:'hex', how:`${n} DIV 16 = ${Math.floor(n/16)} (${hex(Math.floor(n/16))}), ${n} MOD 16 = ${n%16} (${hex(n%16)}). So ${hex(n)}.`}; }},
  {id:'h2d', name:'Hex to denary', make(){ const n=R(16,255); return {q:`Convert ${hex(n)} (hex) to denary.`, ans:[String(n)], how:`${hex(Math.floor(n/16))} x 16 + ${hex(n%16)} = ${Math.floor(n/16)*16} + ${n%16} = ${n}.`}; }},
  {id:'b2h', name:'Binary to hex', make(){ const n=R(1,255); const b=bin8(n); return {q:`Convert ${b} to hexadecimal.`, ans:[hex(n)], norm:'hex', how:`Split into nibbles: ${b.slice(0,4)} = ${hex(n>>4)}, ${b.slice(4)} = ${hex(n&15)}. So ${hex(n)}.`}; }},
  {id:'h2b', name:'Hex to binary', make(){ const n=R(16,255); return {q:`Convert ${hex(n)} (hex) to 8-bit binary.`, ans:[bin8(n)], norm:'bits', how:`Each hex digit is one nibble: ${hex(n>>4)} = ${bin8(n).slice(0,4)}, ${hex(n&15)} = ${bin8(n).slice(4)}. So ${bin8(n)}.`}; }},
  {id:'add', name:'Binary addition', make(){ const a=R(1,200), b=R(1,255-a); return {q:`Add these 8-bit binary numbers:\n  ${bin8(a)}\n+ ${bin8(b)}`, ans:[bin8(a+b)], norm:'bits', how:`${a} + ${b} = ${a+b}, which is ${bin8(a+b)}. Remember: 1+1 = 0 carry 1, and 1+1+1 = 1 carry 1.`}; }},
  {id:'shift', name:'Binary shifts', make(){ const left=Math.random()<.5; const k=R(1,2); let n=left?R(1,63>>(k-1)):R(4,255); const r=left?(n<<k)&255:n>>k; return {q:`Apply a ${k}-place ${left?'left':'right'} shift to ${bin8(n)}. Give the 8-bit result.`, ans:[bin8(r)], norm:'bits', how:`A left shift of 1 multiplies by 2; a right shift of 1 divides by 2 (losing any remainder). ${n} ${left?'x':'DIV'} ${2**k} = ${r} = ${bin8(r)}.`}; }},
  {id:'img', name:'Image file size', make(){ const w=R(1,20)*20, h=R(1,20)*20, d=[1,2,4,8,16,24][R(0,5)]; const bits=w*h*d, bytes=bits/8; return {q:`An image is ${w} x ${h} pixels with a colour depth of ${d} bits. What is its size in bytes?`, ans:[String(bytes)], num:true, how:`Size (bits) = width x height x colour depth = ${w} x ${h} x ${d} = ${fmtN(bits)} bits. Divide by 8: ${fmtN(bytes)} bytes${bytes>=1000?` (${fmtN(bytes/1000)} KB)`:''}.`}; }},
  {id:'snd', name:'Sound file size', make(){ const rate=[8000,11025,16000,22050,44100][R(0,4)], res=[8,16,24][R(0,2)], secs=R(2,30)*5; const bytes=rate*res*secs/8; return {q:`A sound is sampled at ${fmtN(rate)} Hz with a sample resolution of ${res} bits for ${secs} seconds. What is the file size in kilobytes (1 KB = 1000 bytes)?`, ans:[String(bytes/1000)], num:true, how:`Size (bits) = sample rate x resolution x seconds = ${fmtN(rate)} x ${res} x ${secs} = ${fmtN(rate*res*secs)} bits. Divide by 8 = ${fmtN(bytes)} bytes. Divide by 1000 = ${fmtN(bytes/1000)} KB.`}; }},
  {id:'units', name:'Units of storage', make(){ const kinds=[['MB','bytes',1e6],['KB','bits',8000],['GB','MB',1000],['TB','GB',1000],['bytes','bits',8],['MB','KB',1000]]; const [f,t,m]=kinds[R(0,kinds.length-1)]; const n=R(2,40)/(Math.random()<.3?2:1); return {q:`How many ${t} are in ${n} ${f}?`, ans:[String(n*m)], num:true, how:`1 ${f} = ${fmtN(m)} ${t}. ${n} x ${fmtN(m)} = ${fmtN(n*m)} ${t}. (AQA uses 1 KB = 1000 bytes.)`}; }},
  {id:'logic', name:'Logic gates', make(){
      const T = [
        ['A AND B', (a,b)=>a&b, 2], ['A OR B', (a,b)=>a|b, 2], ['A XOR B', (a,b)=>a^b, 2], ['NOT (A AND B)', (a,b)=>1-(a&b), 2],
        ['NOT (A OR B)', (a,b)=>1-(a|b), 2], ['(NOT A) AND B', (a,b)=>(1-a)&b, 2], ['A OR (NOT B)', (a,b)=>a|(1-b), 2],
        ['(A AND B) OR C', (a,b,c)=>(a&b)|c, 3], ['(A OR B) AND C', (a,b,c)=>(a|b)&c, 3], ['NOT (A OR B) AND C', (a,b,c)=>(1-(a|b))&c, 3],
        ['(A XOR B) OR C', (a,b,c)=>(a^b)|c, 3], ['(A AND (NOT B)) OR C', (a,b,c)=>(a&(1-b))|c, 3], ['(A OR B) AND (NOT C)', (a,b,c)=>(a|b)&(1-c), 3]];
      const [e,f,n] = T[R(0,T.length-1)]; const a=R(0,1), b=R(0,1), c=R(0,1); const q=f(a,b,c);
      return {q:`Q = ${e}\nWhat is Q when A = ${a}, B = ${b}${n===3?`, C = ${c}`:''}?`, ans:[String(q)], norm:'bit', how:`Work inside the brackets first. With A = ${a}, B = ${b}${n===3?`, C = ${c}`:''}: Q = ${q}. AND needs both inputs 1; OR needs at least one; XOR needs exactly one; NOT flips the value.`}; }},
  {id:'colours', name:'Colours and bits', make(){
      if (Math.random()<.5){ const n=[3,5,7,9,12,16,20,30,64,100,128,200,256][R(0,12)]; const d=Math.ceil(Math.log2(n)); return {q:`An image uses ${n} different colours. What is the minimum colour depth in bits?`, ans:[String(d)], num:true, how:`${d} bits give 2^${d} = ${2**d} colours, which is enough for ${n}; ${d-1} bits only give ${2**(d-1)}.`}; }
      const d=R(1,8); return {q:`How many different colours can be represented with a colour depth of ${d} bits?`, ans:[String(2**d)], num:true, how:`n bits give 2^n combinations: 2^${d} = ${2**d}.`}; }},
  {id:'ascii', name:'ASCII codes', make(){
      const sets=[['A',65,'ABCDEFGHIJKLMNOPQRSTUVWXYZ'],['a',97,'abcdefghijklmnopqrstuvwxyz'],['0',48,'0123456789']]; const [base,code,chars]=sets[R(0,2)];
      const ch=chars[R(1,chars.length-1)]; const v=code+chars.indexOf(ch);
      if (Math.random()<.5) return {q:`The ASCII code for '${base}' is ${code}. What is the ASCII code for '${ch}'?`, ans:[String(v)], num:true, how:`Codes run in order, so '${ch}' is ${chars.indexOf(ch)} after '${base}': ${code} + ${chars.indexOf(ch)} = ${v}.`};
      return {q:`The ASCII code for '${base}' is ${code}. Which character has the code ${v}?`, ans:[ch], norm:'char', how:`${v} - ${code} = ${chars.indexOf(ch)}, so it is ${chars.indexOf(ch)} characters after '${base}': '${ch}'.`}; }},
  {id:'rle', name:'Run-length encoding', make(){
      let row=''; let cur=R(0,1); while(row.length<R(8,12)){ row += String(cur).repeat(R(1,4)); cur=1-cur; } row=row.slice(0,12);
      const runs=[]; for(const ch of row){ if(runs.length && runs[runs.length-1][1]===ch) runs[runs.length-1][0]++; else runs.push([1,ch]); }
      const enc=runs.map(([n,c])=>`${n}${c}`).join(' ');
      return {q:`Use run-length encoding on this row of pixels. Write each run as the count then the colour, e.g. 30 for three 0s.\n${row}`, ans:[enc], norm:'rle', rle:runs, how:`Count each run of the same bit: ${runs.map(([n,c])=>`${n} x ${c}`).join(', ')}. So the encoding is ${enc}.`}; }},
];
function placeSum(n){ const parts=[]; [128,64,32,16,8,4,2,1].forEach(p=>{ if(n&p) parts.push(p); }); return parts.join(' + '); }
let D = null;
function drills(){
  topbar('Calculation drills', 'Unlimited practice', () => go({name:'home'}));
  if (!D){ D = {kind: DRILLS[0], item: null, given: null, streak: 0}; D.item = D.kind.make(); }
  const st = S.drills[D.kind.id] || {right:0, tries:0};
  const given = D.given;
  let ok = null; if (given !== null) ok = checkDrill(D.item, given);
  $app.innerHTML = `<div class="picker">${DRILLS.map(d=>`<button class="pick" data-d="${d.id}" aria-pressed="${d===D.kind}">${esc(d.name)}</button>`).join('')}</div>
  <article class="card" style="min-height:0">
    <div class="row"><span class="chip">${esc(D.kind.name)}</span><span class="tiny grow" style="text-align:right">${st.right} right of ${st.tries}${D.streak>1?` &middot; ${D.streak} in a row`:''}</span></div>
    <div style="font-size:19px;font-weight:bold;white-space:pre-wrap;font-family:${D.item.q.includes('\n')?'var(--mono)':'inherit'}">${esc(D.item.q)}</div>
    <form class="drill-in" id="dForm" autocomplete="off"><label class="label" for="dIn" style="position:absolute;left:-9999px">Your answer</label>
      <input id="dIn" inputmode="${/bits|hex|rle|char/.test(D.item.norm||'')?'text':'decimal'}" autocapitalize="characters" spellcheck="false" placeholder="Your answer" value="${given!==null?esc(given):''}" ${given!==null?'readonly':''}>
      ${given===null?'<button class="btn primary" type="submit">Check</button>':''}</form>
    ${given!==null?`<div class="explain ${ok?'good':'bad'}"><b>${ok?'Correct.':`Not quite. The answer is ${esc(D.item.ans[0])}.`}</b>${esc(D.item.how)}</div>
      <button class="btn primary block" id="dNext">Next</button>`:''}
  </article>
  <p class="tiny">Type binary with or without spaces. Numbers can include commas.</p>`;
  $app.querySelectorAll('.pick[data-d]').forEach(b => b.onclick = () => { D.kind = DRILLS.find(d=>d.id===b.dataset.d); D.item = D.kind.make(); D.given = null; D.streak = 0; drills(); });
  const f = document.getElementById('dForm');
  f.onsubmit = e => { e.preventDefault(); const v = document.getElementById('dIn').value.trim(); if (!v) return; D.given = v; const good = checkDrill(D.item, v);
    const s = S.drills[D.kind.id] || {right:0, tries:0}; s.tries++; if (good) { s.right++; D.streak++; } else D.streak = 0; S.drills[D.kind.id] = s; markDay('drills'); save(); drills(); };
  if (given===null) setTimeout(()=>{ try{ document.getElementById('dIn').focus({preventScroll:true}); }catch(e){} }, 50);
  else document.getElementById('dNext').onclick = () => { D.item = D.kind.make(); D.given = null; drills(); };
}
function checkDrill(item, v){
  let x = v.replace(/\s+/g,'');
  if (item.norm==='bits'){ x = x.replace(/[^01]/g,''); return item.ans.some(a => x === a || (x.length < 8 && x.padStart(8,'0') === a)); }
  if (item.norm==='bit'){ return x === item.ans[0]; }
  if (item.norm==='char'){ return v.trim().replace(/^['"]|['"]$/g,'') === item.ans[0]; }
  if (item.norm==='rle'){ const toks = v.trim().split(/[\s,]+/).filter(Boolean); if (toks.length !== item.rle.length) return false; return toks.every((t,i)=> t === `${item.rle[i][0]}${item.rle[i][1]}` || t.replace(/[x*×]/gi,'') === `${item.rle[i][0]}${item.rle[i][1]}`); }
  if (item.norm==='hex'){ x = x.toUpperCase().replace(/^0X/,'').replace(/^&/,'').replace(/H$/,'').replace(/^0+(?=.)/,''); return item.ans.includes(x); }
  x = x.replace(/,/g,'').replace(/(bytes|bits|kb|mb|gb|tb)$/i,'');
  const n = parseFloat(x); return item.ans.some(a => Math.abs(n - parseFloat(a)) < 1e-6);
}

function parsons(){
  const it = findItem('parsons', view.id);
  if (!PZ || PZ.id !== it.id){ const lines = it.lines.map((t,i)=>({t, i})); PZ = {id: it.id, pool: shuffle(lines), ans: [], checked: null}; if (PZ.pool.every((l,k)=>l.i===k) && lines.length>1) PZ.pool.reverse(); }
  topbar('Code puzzle', it.lang==='python'?'Python':'AQA pseudocode', () => { PZ = null; go(view.back||{name:'plist',kind:'parsons'}); });
  const ok = PZ.checked;
  let h = `<div class="row"><span class="chip">${esc(topicName(it.topic))}</span></div><h2 style="font-size:20px">${esc(it.title)}</h2><p style="margin:0;white-space:pre-wrap">${fmt(it.prompt)}</p>
  <div class="label">Your program</div>
  <div class="pz pz-ans" aria-label="Your program">${PZ.ans.length?PZ.ans.map((l,k)=>{ let cls=''; if(ok!==null){ cls = l.i===k ? 'right' : 'wrong'; } return `<button class="pzl ${cls}" data-a="${k}" ${ok?'disabled':''}>${esc(l.t)}</button>`;}).join(''):'<p class="tiny" style="margin:6px 4px">Tap lines below to add them here. Tap a line here to send it back.</p>'}</div>
  ${PZ.pool.length?`<div class="label">Lines to use</div><div class="pz">${PZ.pool.map((l,k)=>`<button class="pzl" data-p="${k}">${esc(l.t)}</button>`).join('')}</div>`:''}`;
  if (ok===true) h += `<div class="explain good"><b>Correct.</b>${fmt(it.explain||'')}</div>`;
  else if (ok===false) h += `<div class="explain bad"><b>Not quite.</b>Lines in red are in the wrong place. Tap one to take it out and try again.</div>`;
  h += `<div class="row">${PZ.pool.length===0 && ok!==true ? '<button class="btn primary" id="pzCheck">Check</button>' : ''}${ok!==true?'<button class="btn ghost" id="pzShow">Show answer</button>':''}${ok===true?nextBtnHtml('parsons', it.id):''}</div>`;
  if (PZ.reveal) h += `<pre class="code">${esc(it.lines.join('\n'))}</pre><p class="small muted" style="margin:0">${fmt(it.explain||'')}</p>`;
  $app.innerHTML = h;
  $app.querySelectorAll('[data-p]').forEach(b => b.onclick = () => { const l = PZ.pool.splice(+b.dataset.p,1)[0]; PZ.ans.push(l); PZ.checked = null; parsons(); });
  $app.querySelectorAll('[data-a]').forEach(b => b.onclick = () => { const l = PZ.ans.splice(+b.dataset.a,1)[0]; PZ.pool.push(l); PZ.checked = null; parsons(); });
  const c = document.getElementById('pzCheck'); if (c) c.onclick = () => { PZ.checked = PZ.ans.every((l,k)=>l.i===k); if (PZ.checked || !pScore('parsons', it.id)?.ok) setPScore('parsons', it.id, {ok: PZ.checked}); parsons(); };
  const sh = document.getElementById('pzShow'); if (sh) sh.onclick = () => { PZ.reveal = true; parsons(); };
  wireNext('parsons', it.id);
}

// ---------- TRACE TABLES ----------
let TR = null;
function trace(){
  const it = findItem('traces', view.id);
  if (!TR || TR.id !== it.id) TR = {id: it.id, vals: {}, checked: false, reveal: false};
  topbar('Trace table', it.lang==='python'?'Python':'AQA pseudocode', () => { TR = null; go(view.back||{name:'plist',kind:'traces'}); });
  const pre = it.prefill||0, norm = v => String(v??'').trim().replace(/^"(.*)"$/,'$1').replace(/^'(.*)'$/,'$1').toLowerCase();
  let right = 0, total = 0;
  let h = `<div class="row"><span class="chip">${esc(topicName(it.topic))}</span></div><h2 style="font-size:20px">${esc(it.title)}</h2>
  <pre class="code">${esc(it.code)}</pre>${it.inputs?`<p class="small" style="margin:0"><b>Input:</b> ${fmt(it.inputs)}</p>`:''}
  <div style="overflow-x:auto"><table class="tbl trace"><thead><tr>${it.columns.map(c=>`<th>${esc(c)}</th>`).join('')}</tr></thead><tbody>`;
  it.rows.forEach((r,ri) => { h += '<tr>' + r.map((v,ci) => { if (ri < pre) return `<td class="given">${esc(v)}</td>`;
      const key = ri+'_'+ci, val = TR.reveal ? v : (TR.vals[key]??''); let cls = '';
      if (TR.checked && !TR.reveal){ total++; if (norm(val)===norm(v)){ right++; cls='ok'; } else cls='no'; }
      return `<td class="${cls}"><input aria-label="${esc(it.columns[ci])}, row ${ri+1}" data-k="${key}" value="${esc(val)}" autocomplete="off" autocapitalize="off" spellcheck="false" ${TR.reveal?'readonly':''}></td>`; }).join('') + '</tr>'; });
  h += `</tbody></table></div>`;
  if (TR.checked && !TR.reveal) h += `<div class="explain ${right===total?'good':'bad'}"><b>${right} of ${total} cells right.</b>${right===total?fmt(it.explain||''):'Green cells are right. Fix the red ones and check again, or show the answer.'}</div>`;
  if (TR.reveal) h += `<p class="small muted" style="margin:0">${fmt(it.explain||'')}</p>`;
  h += `<div class="row"><button class="btn primary" id="trCheck">Check</button><button class="btn ghost" id="trShow">${TR.reveal?'Hide answer':'Show answer'}</button>${nextBtnHtml('traces', it.id)}</div>`;
  $app.innerHTML = h;
  $app.querySelectorAll('input[data-k]').forEach(inp => inp.oninput = () => { TR.vals[inp.dataset.k] = inp.value; });
  document.getElementById('trCheck').onclick = () => { TR.reveal = false; TR.checked = true; trace(); const cells = it.rows.slice(pre).reduce((a,r)=>a+r.length,0); let ok=0; it.rows.forEach((r,ri)=>{ if(ri<pre) return; r.forEach((v,ci)=>{ if(norm(TR.vals[ri+'_'+ci])===norm(v)) ok++; }); }); setPScore('traces', it.id, {got: ok, marks: cells}); };
  document.getElementById('trShow').onclick = () => { TR.reveal = !TR.reveal; trace(); };
  wireNext('traces', it.id);
}

// ---------- SELF-MARKED (programs + long answers) ----------
let SM = null;
function selfMarked(kind){
  const it = findItem(kind, view.id), isProg = kind==='programs';
  if (!SM || SM.id !== it.id) SM = {id: it.id, text: (S.practice.drafts||{})[it.id] || '', reveal: false, ticks: {}, hint: false};
  topbar(isProg?'Write a program':'Longer answer', `${it.marks} marks &middot; Paper ${paperOf(it.topic)}`.replace('&middot;','·'), () => { SM = null; go(view.back||{name:'plist',kind}); });
  const pts = isProg ? it.markPoints : it.points;
  const got = Math.min(it.marks, Object.values(SM.ticks).filter(Boolean).length);
  let h = `<div class="row"><span class="chip">${esc(topicName(it.topic))}</span><span class="chip">${it.marks} marks</span></div>
  ${isProg?`<h2 style="font-size:20px">${esc(it.title)}</h2>`:''}<div style="font-size:18px;line-height:1.45;white-space:pre-wrap">${fmt(isProg?it.task:it.q)}</div>${it.code?`<pre class="code">${esc(it.code)}</pre>`:''}
  ${isProg && it.hint ? (SM.hint?`<p class="note" style="margin:0">${fmt(it.hint)}</p>`:'<button class="btn ghost" id="smHint" style="align-self:flex-start">Show a hint</button>') : ''}
  <label class="label" for="smText">Your answer</label>
  <textarea id="smText" class="ta ${isProg?'mono':''}" rows="${isProg?10:7}" spellcheck="${isProg?'false':'true'}" autocapitalize="${isProg?'off':'sentences'}" placeholder="${isProg?'Write your Python here (or on paper)':'Write your answer here (or on paper)'}">${esc(SM.text)}</textarea>`;
  if (!SM.reveal) h += `<button class="btn primary block" id="smReveal">Show the mark scheme</button>`;
  else {
    h += `<section class="panel"><h3 style="margin-bottom:4px">Mark scheme</h3><p class="tiny" style="margin:0 0 8px">Tick each point your answer clearly made. ${pts.length>it.marks?`Up to ${it.marks} marks; there are ${pts.length} creditable points.`:''}</p>
      <div class="ticks">${pts.map((p,i)=>`<label class="tick"><input type="checkbox" data-t="${i}" ${SM.ticks[i]?'checked':''}><span>${fmt(p)}</span></label>`).join('')}</div>
      ${it.levels?`<p class="note" style="margin:10px 0 0"><b>Levels:</b> ${fmt(it.levels)}</p>`:''}</section>
      <section class="panel"><h3 style="margin-bottom:8px">${isProg?'Model solution':'Model answer'}</h3>${isProg?`<pre class="code">${esc(it.solution)}</pre>${it.tests?`<p class="small muted" style="margin:8px 0 0;white-space:pre-wrap">${fmt(it.tests)}</p>`:''}`:`<p style="margin:0;white-space:pre-wrap">${fmt(it.model)}</p>`}</section>
      <div class="row"><div class="grow"><span class="score" style="font-size:34px" id="smGot">${got}</span><span class="muted"> / ${it.marks}</span></div><button class="btn primary" id="smSave">Save mark</button>${nextBtnHtml(kind, it.id)}</div>`;
  }
  const prev = pScore(kind, it.id); if (prev) h += `<p class="tiny" style="margin:0">Last time: ${prev.got}/${prev.marks}</p>`;
  $app.innerHTML = h;
  const ta = document.getElementById('smText'); ta.oninput = () => { SM.text = ta.value; S.practice.drafts = S.practice.drafts || {}; S.practice.drafts[it.id] = ta.value; clearTimeout(SM.t); SM.t = setTimeout(()=>{ try{ localStorage.setItem(KEY, JSON.stringify(S)); }catch(e){} }, 600); };
  const hb = document.getElementById('smHint'); if (hb) hb.onclick = () => { SM.hint = true; selfMarked(kind); };
  const rv = document.getElementById('smReveal'); if (rv) rv.onclick = () => { SM.reveal = true; selfMarked(kind); };
  $app.querySelectorAll('[data-t]').forEach(cb => cb.onchange = () => { SM.ticks[cb.dataset.t] = cb.checked; document.getElementById('smGot').textContent = Math.min(it.marks, Object.values(SM.ticks).filter(Boolean).length); });
  const sv = document.getElementById('smSave'); if (sv) sv.onclick = () => { setPScore(kind, it.id, {got: Math.min(it.marks, Object.values(SM.ticks).filter(Boolean).length), marks: it.marks}); sv.textContent = 'Saved'; sv.disabled = true; };
  wireNext(kind, it.id);
}
const program = () => selfMarked('programs');
const longq = () => selfMarked('longq');

// ---------- MINI MOCK ----------
let MK = null;
function mockSetup(){
  topbar('Mini mock exam', 'Timed practice', () => go({name:'home'}));
  const last = (S.mocks||[]).slice(-5).reverse();
  $app.innerHTML = `<h1>Mini mock exam</h1><p class="muted" style="margin:0">Exam conditions: no feedback until the end. 12 multiple-choice questions, then 2 longer questions you mark yourself against the mark scheme.</p>
  <div class="today">
    <button class="mode" data-pp="1"><b>Paper 1 style</b><span>Algorithms and programming &middot; 25 minutes</span></button>
    <button class="mode" data-pp="2"><b>Paper 2 style</b><span>Data, systems, networks, cyber, SQL, impacts &middot; 25 minutes</span></button>
  </div>
  ${last.length?`<section class="panel"><h2 style="margin-bottom:6px">Recent mocks</h2><table class="tbl"><tbody>${last.map(m=>`<tr><td>Paper ${m.paper}<br><span class="tiny">${new Date(m.at).toLocaleDateString('en-GB',{day:'numeric',month:'short'})}</span></td><td class="n">${m.got}/${m.marks} &middot; ${pct(m.got/m.marks)}</td></tr>`).join('')}</tbody></table></section>`:''}`;
  $app.querySelectorAll('[data-pp]').forEach(b => b.onclick = () => startMock(+b.dataset.pp));
}
function startMock(paper){
  const pool = shuffle(mcqs.filter(m => paperOf(m.topic)===paper));
  // spread across topics
  const byT = {}; pool.forEach(m => (byT[m.topic] = byT[m.topic] || []).push(m));
  const picks = []; const ts = Object.keys(byT); let k = 0;
  while (picks.length < 12 && ts.some(t=>byT[t].length)){ const t = ts[k++ % ts.length]; if (byT[t].length) picks.push(byT[t].pop()); }
  const lq = shuffle((P.longq||[]).filter(q => paperOf(q.topic)===paper && q.marks <= 6)).slice(0, 2);
  MK = {paper, items: picks.map(m=>({m, order: shuffle([0,1,2,3]), chosen: null})), long: lq.map(q=>({q, text:'', ticks:{}})), i: 0, stage: 'mcq', end: now() + 25*60e3};
  go({name:'mock'});
}
let mockTimer = null;
function mockClock(){ const el = document.getElementById('mkClock'); if (!el || !MK) { clearInterval(mockTimer); return; } const s = Math.max(0, Math.round((MK.end - now())/1000)); el.textContent = `${Math.floor(s/60)}:${String(s%60).padStart(2,'0')}`; el.classList.toggle('late', s < 120); }
function mock(){
  if (!MK) return go({name:'mockSetup'});
  topbar(`Mock: Paper ${MK.paper}`, MK.stage==='mark'?'Marking':'Exam conditions', () => { MK = null; clearInterval(mockTimer); go({name:'mockSetup'}); });
  const nM = MK.items.length, nL = MK.long.length;
  let h = '';
  if (MK.stage !== 'mark') h += `<div class="row"><div class="progress grow" aria-hidden="true"><i style="width:${Math.round(MK.i/(nM+nL)*100)}%"></i></div><span class="clock" id="mkClock"></span></div>`;
  if (MK.stage === 'mcq'){
    const it = MK.items[MK.i], m = it.m;
    h += `<div class="label">Question ${MK.i+1} of ${nM+nL} &middot; 1 mark</div><h2 style="font-size:20px;line-height:1.35">${fmt(m.q)}</h2>${m.code?`<pre class="code">${esc(m.code)}</pre>`:''}
    <div class="opts">${it.order.map((oi,pos)=>`<button class="opt ${it.chosen===oi?'picked':''}" data-o="${oi}"><span class="k">${'ABCD'[pos]}</span><span>${fmt(m.options[oi])}</span></button>`).join('')}</div>
    <div class="row"><button class="btn" id="mkPrev" ${MK.i?'':'disabled'}>Previous</button><span class="grow"></span><button class="btn primary" id="mkNext">${MK.i+1<nM?'Next':'Longer questions'}</button></div>`;
  } else if (MK.stage === 'long'){
    const j = MK.i - nM, L = MK.long[j];
    h += `<div class="label">Question ${MK.i+1} of ${nM+nL} &middot; ${L.q.marks} marks</div><div style="font-size:18px;line-height:1.45;white-space:pre-wrap">${fmt(L.q.q)}</div>${L.q.code?`<pre class="code">${esc(L.q.code)}</pre>`:''}
    <textarea id="mkText" class="ta" rows="8" placeholder="Write your answer">${esc(L.text)}</textarea>
    <div class="row"><button class="btn" id="mkPrev">Previous</button><span class="grow"></span><button class="btn primary" id="mkNext">${j+1<nL?'Next':'Finish and mark'}</button></div>`;
  } else {
    const mcqGot = MK.items.filter(x=>x.chosen===x.m.answer).length;
    h += `<h1>Mark your answers</h1><section class="panel"><div class="row"><h3 class="grow">Multiple choice</h3><b>${mcqGot} / ${nM}</b></div><table class="tbl" style="margin-top:6px"><tbody>${MK.items.map((x,i)=>{const ok=x.chosen===x.m.answer; return `<tr><td><span class="tiny">Q${i+1}</span> ${fmt(x.m.q)}<br><span class="${ok?'':'muted'}">${ok?'Correct':'Answer: '+fmt(x.m.options[x.m.answer])}</span></td><td class="n"><span class="chip ${ok?'good':'bad'}">${ok?1:0}</span></td></tr>`;}).join('')}</tbody></table></section>`;
    MK.long.forEach((L,j) => { h += `<section class="panel"><div class="label">Question ${nM+j+1} &middot; ${L.q.marks} marks</div><p style="margin:4px 0 8px;white-space:pre-wrap">${fmt(L.q.q)}</p><p class="note" style="margin:0 0 8px;white-space:pre-wrap">${L.text?esc(L.text):'(no answer written)'}</p>
      <div class="ticks">${L.q.points.map((p,i)=>`<label class="tick"><input type="checkbox" data-l="${j}" data-t="${i}" ${L.ticks[i]?'checked':''}><span>${fmt(p)}</span></label>`).join('')}</div>
      <details style="margin-top:8px"><summary class="small">Model answer</summary><p class="small" style="white-space:pre-wrap">${fmt(L.q.model)}</p></details></section>`; });
    const longGot = MK.long.reduce((a,L)=>a+Math.min(L.q.marks, Object.values(L.ticks).filter(Boolean).length),0), marks = nM + MK.long.reduce((a,L)=>a+L.q.marks,0);
    h += `<section class="panel row"><div class="grow"><div class="label">Total</div><span class="score" style="font-size:40px" id="mkTot">${mcqGot+longGot}</span><span class="muted"> / ${marks}</span></div><button class="btn primary" id="mkSave">Save result</button></section>`;
  }
  $app.innerHTML = h;
  if (MK.stage !== 'mark'){ clearInterval(mockTimer); mockTimer = setInterval(mockClock, 1000); mockClock(); }
  if (MK.stage === 'mcq'){
    $app.querySelectorAll('.opt').forEach(b => b.onclick = () => { MK.items[MK.i].chosen = +b.dataset.o; mock(); });
    document.getElementById('mkPrev').onclick = () => { MK.i--; mock(); };
    document.getElementById('mkNext').onclick = () => { MK.i++; if (MK.i >= nM) MK.stage = 'long'; if (MK.stage==='long' && !nL) MK.stage='mark'; mock(); window.scrollTo(0,0); };
  } else if (MK.stage === 'long'){
    const j = MK.i - nM, ta = document.getElementById('mkText'); ta.oninput = () => { MK.long[j].text = ta.value; };
    document.getElementById('mkPrev').onclick = () => { MK.i--; if (MK.i < nM) MK.stage = 'mcq'; mock(); };
    document.getElementById('mkNext').onclick = () => { MK.i++; if (MK.i >= nM+nL){ MK.stage = 'mark'; clearInterval(mockTimer); } mock(); window.scrollTo(0,0); };
  } else {
    const nMk = nM, mcqGot = MK.items.filter(x=>x.chosen===x.m.answer).length, marks = nMk + MK.long.reduce((a,L)=>a+L.q.marks,0);
    const tot = () => mcqGot + MK.long.reduce((a,L)=>a+Math.min(L.q.marks, Object.values(L.ticks).filter(Boolean).length),0);
    $app.querySelectorAll('input[data-l]').forEach(cb => cb.onchange = () => { MK.long[+cb.dataset.l].ticks[cb.dataset.t] = cb.checked; document.getElementById('mkTot').textContent = tot(); });
    document.getElementById('mkSave').onclick = () => {
      MK.items.forEach(x => { const s = S.mcq[x.m.id] || {tries:0, right:0}; const ok = x.chosen===x.m.answer; s.tries++; if (ok) s.right++; s.last = ok; s.at = now(); S.mcq[x.m.id] = s; });
      MK.long.forEach(L => setPScore('longq', L.q.id, {got: Math.min(L.q.marks, Object.values(L.ticks).filter(Boolean).length), marks: L.q.marks}));
      S.mocks = S.mocks || []; S.mocks.push({paper: MK.paper, got: tot(), marks, at: now()}); markDay('quiz', nMk); save();
      MK = null; go({name:'mockSetup'}); };
  }
}

render();

// ---------- optional sync to the viewer's own Claude account ----------
(async () => {
  try {
    if (!window.claude || !window.claude.use) return;
    const [db, user] = await Promise.all([window.claude.use('db'), window.claude.use('user')]);
    if (!db || !user) return;
    const id = await user.id(); if (!id) return;
    const ref = db.doc('data/users/' + id + '/progress');
    const snap = await ref.get();
    if (snap.exists){ const d = snap.data(); if (d && d.updated > (S.updated||0)){ try { S = Object.assign({cards:{}, mcq:{}, days:{}, drills:{}, practice:{}, mocks:[]}, JSON.parse(d.state)); localStorage.setItem(KEY, JSON.stringify(S)); buildIndex(); } catch(e){} } }
    syncRef = ref;
    if (!snap.exists || (S.updated||0) > (snap.data()?.updated||0)) { if (S.updated) await ref.set({state: JSON.stringify(S), updated: S.updated}); }
    if (['home','topic','progress'].includes(view.name)) render(); else renderSyncNote();
  } catch(e) { syncRef = null; }
})();
})();
