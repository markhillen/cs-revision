est   | Adventure  | 25.00 | 8\n2      | Kart Rush    | Racing     | 15.50 | 7\n3      | Pixel Farm   | Simulation | 10.00 | 9\n4      | Turbo Track  | Racing     | 30.00 | 6\n5      | Dungeon Deep | Adventure  | 20.00 | 9", "options": ["Kart Rush 15.50, Pixel Farm 10.00", "Pixel Farm 10.00, Kart Rush 15.50", "Pixel Farm 10.00, Kart Rush 15.50, Dungeon Deep 20.00", "Dungeon Deep 20.00, Star Quest 25.00, Turbo Track 30.00"], "answer": 1, "explain": "Only prices less than 20 are kept (20.00 is not less than 20), and `ASC` puts the cheapest first: Pixel Farm 10.00, then Kart Rush 15.50."}, {"q": "Which query returns every field for all Adventure games?", "code": "Game\nGameID | Title        | Genre      | Price | Rating\n1      | Star Quest   | Adventure  | 25.00 | 8\n2      | Kart Rush    | Racing     | 15.50 | 7\n3      | Pixel Farm   | Simulation | 10.00 | 9\n4      | Turbo Track  | Racing     | 30.00 | 6\n5      | Dungeon Deep | Adventure  | 20.00 | 9", "options": ["SELECT * FROM Game WHERE Genre = 'Adventure'", "SELECT Genre FROM Game WHERE Genre = 'Adventure'", "SELECT * FROM Adventure WHERE Genre = Game", "SELECT all FROM Game ORDER BY Genre"], "answer": 0, "explain": "`*` means every field. The `WHERE` clause keeps only records whose `Genre` is `'Adventure'`. Selecting `Genre` would only show that one field."}, {"q": "How many records does this query return?\n\n`SELECT Title FROM Game WHERE Genre = 'Adventure' AND Rating > 8`", "code": "Game\nGameID | Title        | Genre      | Price | Rating\n1      | Star Quest   | Adventure  | 25.00 | 8\n2      | Kart Rush    | Racing     | 15.50 | 7\n3      | Pixel Farm   | Simulation | 10.00 | 9\n4      | Turbo Track  | Racing     | 30.00 | 6\n5      | Dungeon Deep | Adventure  | 20.00 | 9", "options": ["0", "1", "2", "3"], "answer": 1, "explain": "Both conditions must be true. Star Quest is Adventure but has a rating of 8, which is not greater than 8. Only Dungeon Deep (Adventure, rating 9) matches."}]}, {"id": "db-03", "title": "SQL: retrieving data from two tables", "pdfPage": null, "fromSpec": true, "keyPoints": ["A query can use data from up to two tables. Both tables are listed after `FROM`, separated by a comma, e.g. `FROM Book, Author`.", "The tables are joined in the `WHERE` clause by matching the foreign key to the primary key, e.g. `WHERE Book.AuthorID = Author.AuthorID`.", "Use `TableName.FieldName` (dot notation) when a field name appears in both tables, e.g. `Book.AuthorID` and `Author.AuthorID`. Without it the field name is ambiguous.", "Extra conditions are added to the join condition with `AND`, e.g. `WHERE Book.AuthorID = Author.AuthorID AND Author.Surname = 'Reed'`.", "The fields after `SELECT` can come from either table, e.g. `SELECT Book.Title, Author.Surname`.", "If the join condition is missing, every record in one table is paired with every record in the other, giving many meaningless rows (5 books x 3 authors = 15 rows).", "`ORDER BY` still works on a two-table query and can sort by a field from either table."], "flashcards": [{"q": "How many tables can a GCSE SQL query take data from?", "a": "At most two tables."}, {"q": "How are two tables listed in the `FROM` clause?", "a": "Separated by a comma, e.g. `FROM Book, Author`."}, {"q": "Write the condition that joins `Book` and `Author` on their shared key.", "a": "`WHERE Book.AuthorID = Author.AuthorID`"}, {"q": "Why write `Book.AuthorID` rather than just `AuthorID` in a two-table query?", "a": "`AuthorID` is a field in both tables, so the table name is needed to say which one is meant."}, {"q": "What does the join condition match up?", "a": "The foreign key in one table with the primary key in the other, so each record is paired with its related record."}, {"q": "What happens if the join condition is left out of a two-table query?", "a": "Every record in one table is paired with every record in the other, producing many rows that make no sense."}, {"q": "How do you add another condition to a join condition?", "a": "Use `AND`, e.g. `WHERE Book.AuthorID = Author.AuthorID AND Book.Year > 2020`."}, {"q": "Can the fields in `SELECT` come from different tables?", "a": "Yes, e.g. `SELECT Book.Title, Author.Surname` shows a field from each table."}], "mcq": [{"q": "What does this query return?\n\n`SELECT Book.Title, Author.Surname FROM Book, Author WHERE Book.AuthorID = Author.AuthorID AND Author.Surname = 'Reed'`", "code": "Author\nAuthorID | FirstName | Surname\n1        | Mia       | Patel\n2        | Tom       | Reed\n3        | Zara      | Khan\n\nBook\nBookID | Title        | AuthorID | Year\n101    | Night Garden | 2        | 2019\n102    | Lost River   | 1        | 2021\n103    | Iron Sky     | 2        | 2023\n104    | Paper Moon   | 3        | 2020\n105    | Silent Tide  | 1        | 2018", "options": ["Night Garden Reed, Iron Sky Reed", "Lost River Patel, Silent Tide Patel", "Night Garden Reed only", "Every book title with the surname Reed"], "answer": 0, "explain": "The join links each book to its author. Only author 2 (Tom Reed) has the surname Reed, and books 101 and 103 have `AuthorID` 2: Night Garden and Iron Sky."}, {"q": "Which query returns the titles of all books written by Mia, oldest first?", "code": "Author\nAuthorID | FirstName | Surname\n1        | Mia       | Patel\n2        | Tom       | Reed\n3        | Zara      | Khan\n\nBook\nBookID | Title        | AuthorID | Year\n101    | Night Garden | 2        | 2019\n102    | Lost River   | 1        | 2021\n103    | Iron Sky     | 2        | 2023\n104    | Paper Moon   | 3        | 2020\n105    | Silent Tide  | 1        | 2018", "options": ["SELECT Book.Title FROM Book, Author WHERE Author.FirstName = 'Mia' ORDER BY Book.Year ASC", "SELECT Book.Title FROM Book WHERE Author.FirstName = 'Mia' ORDER BY Book.Year DESC", "SELECT Book.Title FROM Book, Author WHERE Book.AuthorID = Author.AuthorID AND Author.FirstName = 'Mia' ORDER BY Book.Year DESC", "SELECT Book.Title FROM Book, Author WHERE Book.AuthorID = Author.AuthorID AND Author.FirstName = 'Mia' ORDER BY Book.Year ASC"], "answer": 3, "explain": "Both tables must be listed, the join condition must be present, and oldest first means `ASC` on `Year`. The result is Silent Tide (2018) then Lost River (2021)."}, {"q": "What does this query return?\n\n`SELECT Author.FirstName, Book.Title FROM Author, Book WHERE Author.AuthorID = Book.AuthorID AND Book.Year > 2020 ORDER BY Book.Year ASC`", "code": "Author\nAuthorID | FirstName | Surname\n1        | Mia       | Patel\n2        | Tom       | Reed\n3        | Zara      | Khan\n\nBook\nBookID | Title        | AuthorID | Year\n101    | Night Garden | 2        | 2019\n102    | Lost River   | 1        | 2021\n103    | Iron Sky     | 2        | 2023\n104    | Paper Moon   | 3        | 2020\n105    | Silent Tide  | 1        | 2018", "options": ["Tom Iron Sky", "Mia Lost River, Tom Iron Sky", "Mia Lost River, Zara Paper Moon, Tom Iron Sky", "Tom Iron Sky, Mia Lost River"], "answer": 1, "explain": "Only books published after 2020 are kept: Lost River (2021, author 1, Mia) and Iron Sky (2023, author 2, Tom). `ASC` on `Year` puts 2021 first."}, {"q": "A student forgets the join condition and runs this query. How many rows are returned?\n\n`SELECT Book.Title, Author.Surname FROM Book, Author`", "code": "Author\nAuthorID | FirstName | Surname\n1        | Mia       | Patel\n2        | Tom       | Reed\n3        | Zara      | Khan\n\nBook\nBookID | Title        | AuthorID | Year\n101    | Night Garden | 2        | 2019\n102    | Lost River   | 1        | 2021\n103    | Iron Sky     | 2        | 2023\n104    | Paper Moon   | 3        | 2020\n105    | Silent Tide  | 1        | 2018", "options": ["3", "5", "8", "15"], "answer": 3, "explain": "With no join condition, each of the 5 books is paired with each of the 3 authors, giving 5 x 3 = 15 rows, most of which pair a book with the wrong author."}, {"q": "What does this query return?\n\n`SELECT Author.Surname FROM Book, Author WHERE Book.AuthorID = Author.AuthorID AND Book.Title = 'Paper Moon'`", "code": "Author\nAuthorID | FirstName | Surname\n1        | Mia       | Patel\n2        | Tom       | Reed\n3        | Zara      | Khan\n\nBook\nBookID | Title        | AuthorID | Year\n101    | Night Garden | 2        | 2019\n102    | Lost River   | 1        | 2021\n103    | Iron Sky     | 2        | 2023\n104    | Paper Moon   | 3        | 2020\n105    | Silent Tide  | 1        | 2018", "options": ["Zara", "Khan", "3", "Paper Moon"], "answer": 1, "explain": "Paper Moon has `AuthorID` 3, which links to Zara Khan. Only the `Surname` field is selected, so the result is Khan."}, {"q": "Why must the field be written as `Book.AuthorID` rather than `AuthorID` in the join condition?", "code": "Author\nAuthorID | FirstName | Surname\n1        | Mia       | Patel\n2        | Tom       | Reed\n3        | Zara      | Khan\n\nBook\nBookID | Title        | AuthorID | Year\n101    | Night Garden | 2        | 2019\n102    | Lost River   | 1        | 2021\n103    | Iron Sky     | 2        | 2023\n104    | Paper Moon   | 3        | 2020\n105    | Silent Tide  | 1        | 2018", "options": ["`AuthorID` is a field in both tables, so the table name shows which one is meant", "Field names must always be written in capital letters", "`Book.AuthorID` sorts the results into order", "A foreign key can only be used once in a query"], "answer": 0, "explain": "When two tables share a field name, writing it on its own is ambiguous. Dot notation (`TableName.FieldName`) says exactly which table's field is used."}]}, {"id": "db-04", "title": "SQL: INSERT, UPDATE, DELETE", "pdfPage": null, "fromSpec": true, "keyPoints": ["`INSERT INTO table (field1, field2, ...) VALUES (value1, value2, ...)` adds a new record. The field list can be left out if a value is given for every field, in table order.", "`UPDATE table SET field = value WHERE condition` changes data in existing records. Several fields can be changed at once: `SET Level = 'Gold', Points = 0`.", "`DELETE FROM table WHERE condition` removes whole records that meet the condition.", "Without a `WHERE` clause, `UPDATE` changes every record and `DELETE FROM` removes every record, so the condition matters.", "A `WHERE` clause using the primary key, e.g. `WHERE MemberID = 3`, targets exactly one record.", "A new value can be calculated from the current value, e.g. `SET Points = Points + 10`.", "Inserting a record with a primary key value that already exists is rejected, because primary keys must be unique.", "Text values go in quotation marks, numbers do not, just as in `SELECT` queries."], "flashcards": [{"q": "Which SQL command adds a new record to a table?", "a": "`INSERT INTO`, e.g. `INSERT INTO Member VALUES (5, 'Eve', 'Bronze', 0)`."}, {"q": "Which SQL command changes data in existing records?", "a": "`UPDATE ... SET ... WHERE ...`, e.g. `UPDATE Member SET Level = 'Gold' WHERE MemberID = 4`."}, {"q": "Which SQL command removes records?", "a": "`DELETE FROM ... WHERE ...`, e.g. `DELETE FROM Member WHERE MemberID = 2`."}, {"q": "What happens if `UPDATE Member SET Points = 0` is run with no `WHERE` clause?", "a": "Every record in the `Member` table has its `Points` set to 0."}, {"q": "What happens if `DELETE FROM Member` is run with no `WHERE` clause?", "a": "Every record is deleted. The table itself still exists, but it is empty."}, {"q": "Why is it safest to use the primary key in the `WHERE` clause of an `UPDATE`?", "a": "The primary key is unique, so only the one intended record is changed."}, {"q": "Write SQL to add 10 to the points of member 3.", "a": "`UPDATE Member SET Points = Points + 10 WHERE MemberID = 3`"}, {"q": "Why would `INSERT INTO Member VALUES (2, 'Finn', 'Bronze', 0)` fail?", "a": "`MemberID` 2 already exists, and a primary key value must be unique."}, {"q": "When can the field list be left out of an `INSERT INTO` statement?", "a": "When a value is supplied for every field, in the same order as the fields in the table."}], "mcq": [{"q": "Which statement correctly adds a new member called Eve, with ID 5, level Bronze and 0 points?", "code": "Member\nMemberID | Name  | Level  | Points\n1        | Asha  | Gold   | 120\n2        | Ben   | Silver | 80\n3        | Chloe | Bronze | 40\n4        | Dan   | Silver | 95", "options": ["INSERT Member (5, 'Eve', 'Bronze', 0)", "UPDATE Member VALUES (5, 'Eve', 'Bronze', 0)", "INSERT INTO Member (MemberID, Name, Level, Points) VALUES (5, 'Eve', 'Bronze', 0)", "ADD INTO Member SET (5, 'Eve', 'Bronze', 0)"], "answer": 2, "explain": "A new record is added with `INSERT INTO table (fields) VALUES (values)`. `UPDATE` only changes existing records, `INSERT Member (...)` is missing both `INTO` and `VALUES`, and `ADD INTO ... SET` is not an SQL command."}, {"q": "This statement is run on the `Member` table. Which members have the level Gold afterwards?\n\n`UPDATE Member SET Level = 'Gold' WHERE Points > 90`", "code": "Member\nMemberID | Name  | Level  | Points\n1        | Asha  | Gold   | 120\n2        | Ben   | Silver | 80\n3        | Chloe | Bronze | 40\n4        | Dan   | Silver | 95", "options": ["Dan only", "Asha and Dan", "Asha, Ben and Dan", "Asha only"], "answer": 1, "explain": "Asha (120) and Dan (95) both have more than 90 points, so both are set to Gold. Asha was already Gold. Ben has 80 points and is not changed."}, {"q": "This statement is run on the `Member` table. How many records are left?\n\n`DELETE FROM Member WHERE Level = 'Silver'`", "code": "Member\nMemberID | Name  | Level  | Points\n1        | Asha  | Gold   | 120\n2        | Ben   | Silver | 80\n3        | Chloe | Bronze | 40\n4        | Dan   | Silver | 95", "options": ["2", "1", "3", "0"], "answer": 0, "explain": "Ben and Dan are Silver, so both records are deleted. Asha and Chloe remain: 2 records."}, {"q": "A developer runs this statement, meaning to move only Asha to Bronze. What actually happens?\n\n`UPDATE Member SET Level = 'Bronze'`", "code": "Member\nMemberID | Name  | Level  | Points\n1        | Asha  | Gold   | 120\n2        | Ben   | Silver | 80\n3        | Chloe | Bronze | 40\n4        | Dan   | Silver | 95", "options": ["Only Asha's record is changed", "An error occurs because there is no `WHERE` clause", "The `Level` field is deleted from the table", "Every member's level is set to Bronze"], "answer": 3, "explain": "Without a `WHERE` clause, `UPDATE` applies to every record. The correct statement is `UPDATE Member SET Level = 'Bronze' WHERE MemberID = 1`."}, {"q": "What is Chloe's points total after this statement is run?\n\n`UPDATE Member SET Points = Points + 10 WHERE MemberID = 3`", "code": "Member\nMemberID | Name  | Level  | Points\n1        | Asha  | Gold   | 120\n2        | Ben   | Silver | 80\n3        | Chloe | Bronze | 40\n4        | Dan   | Silver | 95", "options": ["10", "40", "50", "4010"], "answer": 2, "explain": "`MemberID` 3 is Chloe, who has 40 points. `Points + 10` uses the current value, so her total becomes 50."}, {"q": "Why is this statement rejected?\n\n`INSERT INTO Member VALUES (2, 'Finn', 'Bronze', 0)`", "code": "Member\nMemberID | Name  | Level  | Points\n1        | Asha  | Gold   | 120\n2        | Ben   | Silver | 80\n3        | Chloe | Bronze | 40\n4        | Dan   | Silver | 95", "options": ["`MemberID` 2 already exists and primary key values must be unique", "Text values cannot be inserted into a table", "`INSERT INTO` must always include a `WHERE` clause", "The `Points` field cannot store 0"], "answer": 0, "explain": "Ben already has `MemberID` 2. A primary key must uniquely identify each record, so a second record with the same value is not allowed."}]}]}, {"topic": "ethics", "name": "Impacts of technology", "lessons": [{"id": "eth-01", "title": "Ethical issues", "pdfPage": null, "fromSpec": true, "keyPoints": ["Ethics is about whether an action is morally right or wrong. Something can be legal but still unethical, so ethical and legal issues are not the same thing.", "Privacy: apps, websites and devices collect large amounts of personal data (location, contacts, browsing, purchases). Users often accept terms they have not read and may not know how their data is used or sold.", "Surveillance: CCTV, facial recognition and monitoring of online activity can help prevent and solve crime, but they reduce privacy and may discourage people from speaking or acting freely.", "Digital divide: the gap between people who have good access to technology, fast internet and digital skills and those who do not (because of cost, age, location or disability). It can widen inequality in education, jobs and access to services.", "Employment: automation and AI replace some jobs (for example checkout operators, warehouse workers, drivers) but create others (programmers, technicians, data analysts). Workers may need retraining.", "AI and algorithms can be biased if trained on biased data, and their decisions can be hard to explain or challenge.", "Accountability: when an automated system makes a harmful decision it can be unclear who is responsible: the programmer, the company, the owner or the user.", "Technology also has strong positive ethical impacts: better healthcare, accessibility tools for disabled people, easier communication and free access to information. Good answers weigh benefits against harms."], "flashcards": [{"q": "What is the difference between an ethical issue and a legal issue?", "a": "A legal issue is about whether something breaks the law. An ethical issue is about whether it is morally right. Something can be legal but still unethical."}, {"q": "Why is privacy an ethical concern with modern apps?", "a": "Apps collect large amounts of personal data, often more than they need. Users may not understand what they agreed to or who the data is shared with or sold to."}, {"q": "Give one benefit and one drawback of facial recognition CCTV.", "a": "Benefit: helps identify suspects and missing people quickly. Drawback: tracks innocent people without consent, reducing privacy, and can misidentify people."}, {"q": "What is the digital divide?", "a": "The gap between people who have access to technology, fast internet and digital skills and those who do not, for example because of cost, age, location or disability."}, {"q": "Why does the digital divide matter?", "a": "People without access miss out on online learning, job applications, cheaper online deals and public services, so existing inequalities can get worse."}, {"q": "How can automation affect employment?", "a": "It can replace routine jobs such as checkout or warehouse work, but it also creates new skilled jobs. Displaced workers may need retraining."}, {"q": "How can an AI system become biased?", "a": "If it is trained on data that reflects past unfair decisions or under-represents some groups, it can repeat or amplify that unfairness."}, {"q": "What is meant by accountability in automated systems?", "a": "Knowing who is responsible when an automated system causes harm, such as the programmer, manufacturer, owner or user. This is often unclear."}, {"q": "Name two positive ethical impacts of digital technology.", "a": "For example: accessibility tools (screen readers, voice control) for disabled people, remote healthcare, easier communication with family, and free access to information and education."}], "mcq": [{"q": "Which statement best describes an ethical issue?", "options": ["An action that is always against the law", "A question of whether an action is morally right or wrong", "A problem caused only by faulty hardware", "A rule set by a network administrator"], "answer": 1, "explain": "Ethics is about right and wrong. An action can be legal yet unethical, so ethical issues are not the same as legal ones."}, {"q": "A family in a rural area cannot get fast broadband and cannot afford a laptop, so the children struggle with online homework. Which issue does this illustrate?", "options": ["Digital divide", "Planned obsolescence", "Copyright infringement", "Phishing"], "answer": 0, "explain": "The digital divide is unequal access to technology and the internet, which can disadvantage people in education and work."}, {"q": "A company uses an AI tool to shortlist job applicants. It was trained on past hiring decisions that favoured one group. What is the main ethical risk?", "options": ["The tool will use too much electricity", "The tool will break copyright law", "The tool may make biased decisions that are hard to challenge", "The tool will stop working without the internet"], "answer": 2, "explain": "AI trained on biased historical data can repeat that bias, and automated decisions can be difficult to explain or appeal."}, {"q": "Which of these is a positive ethical impact of digital technology?", "options": ["Personal data being sold without users knowing", "Jobs being lost to automation with no retraining", "Increased tracking of people's location", "Screen readers allowing blind users to access websites"], "answer": 3, "explain": "Accessibility tools such as screen readers help disabled people use technology, which is a benefit to society."}, {"q": "A self-checkout system wrongly accuses a shopper of theft. Why is accountability an ethical issue here?", "options": ["It is unclear whether the store, the software maker or the system itself is responsible", "Self-checkouts use more energy than staffed tills", "The shopper has broken the Computer Misuse Act", "The system is protected by copyright"], "answer": 0, "explain": "When automated systems make mistakes it can be hard to decide who is responsible and who the person can complain to."}]}, {"id": "eth-02", "title": "Legal issues", "pdfPage": null, "fromSpec": true, "keyPoints": ["Laws often lag behind new technology, and they differ between countries. Because the internet crosses borders, it can be hard to enforce a country's law against someone abroad.", "Data protection law (in the UK, the Data Protection Act 2018 and UK GDPR) says personal data must be used fairly, lawfully and transparently; only for stated purposes; limited to what is needed; kept accurate; not kept longer than necessary; and kept secure.", "People (data subjects) have rights over their data, including the right to see the data held about them, to have mistakes corrected and, in some cases, to have it deleted. Organisations can be fined for breaches.", "Hacking (unauthorised access to a computer system or data) is illegal in the UK under the Computer Misuse Act 1990, as is spreading malware or deliberately disrupting a system. Ethical hacking with the owner's permission is legal.", "Copyright law (Copyright, Designs and Patents Act 1988) protects software, music, films, images and text. Copying or sharing them without permission (piracy) is illegal. Software licences say how a program may be used.", "Responsibility is a legal question for new technology: if an autonomous vehicle crashes, the law must decide whether the manufacturer, software developer, owner or passenger is liable.", "Cloud storage can mean data is held in another country, under that country's laws, which raises questions about who can access it and which rules apply.", "In the exam you do not need to quote Acts in detail, but naming the relevant law (data protection, computer misuse, copyright) can strengthen a legal point."], "flashcards": [{"q": "Why is it hard to enforce laws about digital technology?", "a": "Laws differ between countries and the internet crosses borders, so an offender or server may be abroad. Laws also take time to catch up with new technology."}, {"q": "Name four principles of data protection law.", "a": "Any four: used fairly, lawfully and transparently; only for stated purposes; limited to what is needed; accurate; not kept too long; kept secure."}, {"q": "Give two rights people have over their personal data.", "a": "The right to see the data held about them, the right to have it corrected, and in some cases the right to have it deleted."}, {"q": "What does the Computer Misuse Act 1990 make illegal?", "a": "Unauthorised access to computer material, unauthorised access with intent to commit further crimes, and unauthorised acts that impair a computer, such as spreading malware."}, {"q": "Is ethical hacking legal? Why?", "a": "Yes, because it is done with the system owner's permission to find weaknesses so they can be fixed. Without permission the same actions are illegal."}, {"q": "What is software piracy?", "a": "Copying, distributing or using software without the copyright holder's permission or a valid licence. It is illegal under copyright law."}, {"q": "Which UK law protects software, music and films from being copied?", "a": "The Copyright, Designs and Patents Act 1988."}, {"q": "Why is an autonomous vehicle crash a legal problem?", "a": "There may be no human driver, so the law must decide who is liable: the manufacturer, the software developer, the owner or the passenger."}, {"q": "Why can storing data in the cloud raise legal issues?", "a": "The data may be held on servers in another country with different laws, so it may be unclear which rules apply and who can lawfully access it."}], "mcq": [{"q": "A student guesses a teacher's password and looks at exam marks without permission. Which law is most likely broken?", "options": ["Copyright, Designs and Patents Act 1988", "Data Protection Act 2018 only", "Computer Misuse Act 1990", "No law, because nothing was changed"], "answer": 2, "explain": "Accessing a computer system or data without authorisation is an offence under the Computer Misuse Act, even if nothing is changed."}, {"q": "Which of these is a principle of data protection law?", "options": ["Personal data should be kept for as long as possible in case it is useful", "Personal data should be limited to what is needed for the stated purpose", "Personal data can be shared with anyone once collected", "Personal data only needs to be secure if it is about adults"], "answer": 1, "explain": "Organisations should collect only the data they need, use it for the stated purpose and not keep it longer than necessary."}, {"q": "Downloading a film from a website that does not have permission to share it is an example of:", "options": ["Copyright infringement", "Ethical hacking", "A denial of service attack", "Data minimisation"], "answer": 0, "explain": "Copying or sharing protected work without permission breaks copyright law; this is often called piracy."}, {"q": "Why is it difficult to prosecute a hacker who attacks a UK company from abroad?", "options": ["Hacking is legal in all other countries", "UK law does not cover businesses", "Encryption makes hacking legal", "The hacker may be outside UK jurisdiction and other countries' laws differ"], "answer": 3, "explain": "The internet crosses borders. Different countries have different laws and may not cooperate, making enforcement hard."}, {"q": "A driverless car hits a cyclist. Which question is mainly a legal one?", "options": ["Should cars be programmed to value all lives equally?", "Who is liable: the manufacturer, the software developer or the owner?", "How much energy does the car's computer use?", "Will taxi drivers lose their jobs?"], "answer": 1, "explain": "Deciding who is liable for harm is a legal question. The others are mainly ethical or environmental issues."}]}, {"id": "eth-03", "title": "Environmental issues", "pdfPage": null, "fromSpec": true, "keyPoints": ["E-waste: discarded devices contain toxic materials such as lead, mercury and cadmium, which can leak into soil and water if sent to landfill. Much e-waste is shipped abroad and broken up unsafely.", "Short replacement cycles (upgrading phones every year or two, devices that are hard to repair or no longer get updates) increase the amount of e-waste.", "Making devices needs raw materials such as rare earth elements, lithium, cobalt and gold. Mining them uses a lot of energy, damages habitats and can pollute water.", "Energy use: data centres run servers and cooling systems all day, every day, using huge amounts of electricity. Manufacturing and charging devices also use energy. If the electricity comes from fossil fuels, this adds to carbon emissions.", "Ways to reduce harm: recycling and refurbishing devices, repairable designs, longer software support, energy-efficient hardware, and powering data centres with renewable energy.", "Positive impacts: video calls and remote working reduce travel; smart meters and thermostats cut energy waste; sensors and satellites monitor pollution, weather and deforestation; digital documents reduce paper use.", "A balanced answer recognises both the environmental costs of technology and the ways technology can help the environment."], "flashcards": [{"q": "What is e-waste?", "a": "Discarded electrical and electronic devices, such as old phones, laptops and chargers."}, {"q": "Why is e-waste harmful to the environment?", "a": "Devices contain toxic substances such as lead, mercury and cadmium, which can leak into soil and water from landfill or unsafe recycling."}, {"q": "How does upgrading phones frequently affect the environment?", "a": "It creates more e-waste and needs more raw materials and energy to manufacture new devices."}, {"q": "Why does mining for device materials harm the environment?", "a": "Extracting rare earth elements, lithium and cobalt uses lots of energy, destroys habitats and can pollute land and water."}, {"q": "Why do data centres have a large environmental impact?", "a": "They run servers and cooling 24 hours a day, using large amounts of electricity. If generated from fossil fuels, this increases carbon emissions."}, {"q": "Give two ways the environmental impact of technology can be reduced.", "a": "Any two: recycle or refurbish old devices; design repairable devices; use renewable energy for data centres; use energy-efficient hardware; support devices with updates for longer."}, {"q": "Give two ways technology can benefit the environment.", "a": "Any two: remote working and video calls reduce travel; smart meters reduce energy waste; sensors monitor pollution and wildlife; digital documents save paper."}, {"q": "How can technology help monitor the environment?", "a": "Sensors and satellites can collect data on air quality, weather, sea levels and deforestation, helping scientists and governments respond."}], "mcq": [{"q": "Which is the main environmental concern with sending old phones to landfill?", "options": ["They take up too much storage space", "Toxic metals can leak into soil and water", "They can still be hacked", "They break copyright law"], "answer": 1, "explain": "Electronic devices contain hazardous materials such as lead and mercury that can pollute the environment."}, {"q": "Why do data centres use so much electricity?", "options": ["Servers run constantly and need cooling to stop them overheating", "They only work during the day", "They store data on paper", "They are always switched off at night"], "answer": 0, "explain": "Servers run all the time and produce heat, so large amounts of energy are needed for both computing and cooling."}, {"q": "Which of these is a positive environmental impact of digital technology?", "options": ["Mining more cobalt for batteries", "Replacing phones every year", "Running more servers to store duplicate data", "Video conferencing replacing business flights"], "answer": 3, "explain": "Video calls can replace some travel, reducing fuel use and carbon emissions."}, {"q": "Which action would do most to reduce the e-waste produced by a school?", "options": ["Buying new laptops every year", "Leaving computers on overnight", "Refurbishing and reusing older devices where possible", "Printing all homework"], "answer": 2, "explain": "Extending the life of devices through repair and reuse means fewer devices are thrown away and fewer new ones are made."}, {"q": "Which raw materials are commonly mined to make phones and batteries?", "options": ["Lithium, cobalt and rare earth elements", "Wood, cotton and wool", "Salt, sand and clay only", "Oil and coal only"], "answer": 0, "explain": "Batteries and electronics need metals such as lithium, cobalt and rare earth elements, and mining them has environmental costs."}]}, {"id": "eth-04", "title": "Exam contexts and privacy versus security", "pdfPage": null, "fromSpec": true, "keyPoints": ["Cyber security and hacking: attacks can lead to stolen personal data, fraud and disrupted services such as hospitals. Organisations have a legal duty to protect personal data. Unauthorised hacking is illegal; ethical hacking with permission helps improve security.", "Mobile technologies: smartphones give access to services, maps and emergency help anywhere, but apps can track location and collect data. Constant connection can affect wellbeing, sleep and concentration.", "Wireless networking: convenient and cheap to set up, but signals can be intercepted, especially on open public Wi-Fi. Encrypting the wireless network and using strong passwords reduce the risk. Using someone's network without permission may be illegal.", "Cloud storage: files can be accessed from anywhere and are backed up by the provider, but the user depends on an internet connection and on the provider's security, and data may be stored in another country.", "Wearable technology and computer-based implants: fitness trackers, smartwatches, pacemakers and microchips can improve health and convenience, but collect very sensitive data, could be hacked, and raise questions of consent and who owns the data.", "Autonomous vehicles: could reduce accidents caused by human error and help people who cannot drive, but raise questions about liability, programmed decisions in unavoidable crashes, hacking, data collection and job losses for drivers.", "Privacy versus security: governments and security services argue they need access to communications and data to stop crime and terrorism. Citizens and privacy groups argue that privacy is a right, that powers can be misused, and that weakening encryption makes everyone less secure.", "Extended-response answers should cover ethical, legal and environmental points, give both sides, apply them to the scenario and finish with a justified conclusion."], "flashcards": [{"q": "Give one benefit and one risk of cloud storage.", "a": "Benefit: access files from any device and automatic backup. Risk: depends on the internet and the provider's security; data may be stored abroad under different laws."}, {"q": "Why is public Wi-Fi a security risk?", "a": "Open networks may be unencrypted or fake, so attackers can intercept data such as passwords. Using a VPN or only secure (HTTPS) sites reduces the risk."}, {"q": "Why is health data from wearables especially sensitive?", "a": "It reveals private information about someone's body, habits and location. If shared with insurers or employers it could be used to treat people unfairly."}, {"q": "Give one benefit and one risk of computer-based implants.", "a": "Benefit: pacemakers or cochlear implants improve health and quality of life. Risk: they could be hacked or fail, and they collect very personal data."}, {"q": "Give two arguments for autonomous vehicles.", "a": "Fewer accidents caused by human error such as tiredness or distraction, and independence for people who cannot drive, such as some elderly or disabled people."}, {"q": "Give two arguments against autonomous vehicles.", "a": "Unclear legal liability in a crash, risk of hacking, programmed choices in unavoidable accidents, data collection and job losses for professional drivers."}, {"q": "Why do governments want access to private communications?", "a": "To detect and prevent serious crime and terrorism, and to gather evidence to protect the public."}, {"q": "Why do many citizens oppose government access to private data?", "a": "Privacy is seen as a right; powers could be misused or extended; innocent people are monitored; and weakening encryption could help criminals too."}, {"q": "What makes a top-band extended answer on technology impacts?", "a": "It covers ethical, legal and environmental points, gives both sides, links each point to the scenario and ends with a justified conclusion."}], "mcq": [{"q": "Which is the strongest argument a government might give for accessing encrypted messages?", "options": ["It would make phones cheaper", "It could help detect and prevent serious crime and terrorism", "It would reduce e-waste", "It would make Wi-Fi faster"], "answer": 1, "explain": "Security services argue that access to communications helps them protect the public from serious threats."}, {"q": "Which is a valid argument against building a 'backdoor' into encryption for the government?", "options": ["Criminals could find and exploit the backdoor, making everyone less secure", "Encryption is illegal in the UK", "Backdoors use too much electricity", "It would make messages arrive faster"], "answer": 0, "explain": "A deliberate weakness cannot be limited to trusted users, so it may be discovered and exploited by attackers."}, {"q": "A fitness tracker company sells users' heart-rate data to an insurance company. Which issue is most directly raised?", "options": ["E-waste", "Software piracy", "Privacy of personal data", "Wireless interference"], "answer": 2, "explain": "Health data is sensitive personal data. Sharing it without clear consent raises privacy and data protection concerns."}, {"q": "Which is a benefit of cloud storage for a small business?", "options": ["Files can only be accessed from one office computer", "It removes the need for any internet connection", "The business no longer has any data protection duties", "Staff can access files from different locations and data is backed up off-site"], "answer": 3, "explain": "Cloud storage allows remote access and off-site backup, although the business still has legal duties for the data."}, {"q": "Which is an environmental impact linked to autonomous vehicles?", "options": ["They could drive more efficiently, but their sensors and data processing use extra energy", "They make copyright law harder to enforce", "They always reduce the digital divide", "They remove the need for road laws"], "answer": 0, "explain": "Smoother driving can save fuel, but the onboard computers and data centres that support them also use energy."}]}]}], "practice": {"parsons": [{"id": "pz-01", "topic": "programming", "lang": "python", "title": "Age next year", "prompt": "Ask for the user's name and then their age, and output a message saying how old they will be next year (for example \"Sam will be 16 next year\").", "lines": ["name = input(\"Enter your name: \")", "age = int(input(\"Enter your age: \"))", "next_age = age + 1", "print(name + \" will be \" + str(next_age) + \" next year\")"], "explain": "Input arrives as a string, so int() converts the age before the calculation, and str() converts the number back so it can be joined to the other strings with +."}, {"id": "pz-02", "topic": "programming", "lang": "python", "title": "Temperature check", "prompt": "Ask for a temperature. Output \"Hot\" if it is over 25, \"Warm\" if it is over 15 (but not over 25), and \"Cold\" otherwise.", "lines": ["temp = int(input(\"Enter the temperature: \"))", "if temp > 25:", "    print(\"Hot\")", "elif temp > 15:", "    print(\"Warm\")", "else:", "    print(\"Cold\")"], "explain": "The conditions are checked in order and only the first true branch runs, so the highest test (> 25) must come first; else catches everything left over."}, {"id": "pz-03", "topic": "programming", "lang": "pseudocode", "title": "Password check", "prompt": "Read a password from the user. Output \"Access granted\" if it is \"letmein\", otherwise output \"Access denied\".", "lines": ["password ← USERINPUT", "IF password = \"letmein\" THEN", "    OUTPUT \"Access granted\"", "ELSE", "    OUTPUT \"Access denied\"", "ENDIF"], "explain": "In AQA pseudocode = inside a condition is a comparison (assignment uses ←), and every IF must be closed with ENDIF."}, {"id": "pz-04", "topic": "programming", "lang": "python", "title": "Times table", "prompt": "Ask which times table to show, output the first five lines of it (for example \"7 x 1 = 7\" up to \"7 x 5 = 35\") and then output \"Done\".", "lines": ["number = int(input(\"Which times table? \"))", "for i in range(1, 6):", "    answer = number * i", "    print(number, \"x\", i, \"=\", answer)", "print(\"Done\")"], "explain": "range(1, 6) gives 1, 2, 3, 4 and 5 (the end value is not included); only the indented lines repeat, so \"Done\" is printed once after the loop."}, {"id": "pz-05", "topic": "programming", "lang": "python", "title": "Countdown", "prompt": "Ask for a starting number, count down to 1 (one number per line) and then output \"Lift off!\".", "lines": ["count = int(input(\"Start from: \"))", "while count > 0:", "    print(count)", "    count = count - 1", "print(\"Lift off!\")"], "explain": "The value is printed before it is reduced, so the first number shown is the starting number; the loop stops once count reaches 0."}, {"id": "pz-06", "topic": "programming", "lang": "python", "title": "Make a username", "prompt": "Ask for a first name and then a last name. Build a username from the first three letters of each, in lower case, then output the username followed by its length.", "lines": ["first = input(\"First name: \")", "last = input(\"Last name: \")", "username = first[0:3] + last[0:3]", "username = username.lower()", "print(\"Your username is \" + username)", "print(\"It is\", len(username), \"characters long\")"], "explain": "Slicing [0:3] takes the characters at index 0, 1 and 2; .lower() returns a new string, so the result has to be stored back in the variable."}, {"id": "pz-07", "topic": "algorithms", "lang": "pseudocode", "title": "Count the passes", "prompt": "Read five marks from the user and output how many of them are 40 or more.", "lines": ["passes ← 0", "FOR i ← 1 TO 5", "    mark ← STRING_TO_INT(USERINPUT)", "    IF mark ≥ 40 THEN", "        passes ← passes + 1", "    ENDIF", "ENDFOR", "OUTPUT passes"], "explain": "The counter is set to 0 once before the loop; FOR i ← 1 TO 5 runs exactly five times (AQA FOR loops include the end value), and the result is output after ENDFOR."}, {"id": "pz-08", "topic": "programming", "lang": "python", "title": "Average of four marks", "prompt": "Read four marks from the user, add them up and output the average.", "lines": ["total = 0", "for i in range(4):", "    mark = int(input(\"Enter a mark: \"))", "    total = total + mark", "average = total / 4", "print(\"Average mark:\", average)"], "explain": "A running total starts at 0 before the loop and has each mark added inside it; the average can only be worked out once the loop has finished."}, {"id": "pz-09", "topic": "algorithms", "lang": "python", "title": "Highest score", "prompt": "Find and output the highest value in the list of scores.", "lines": ["scores = [12, 7, 19, 4, 15]", "highest = scores[0]", "for score in scores:", "    if score > highest:", "        highest = score", "print(\"Highest score:\", highest)"], "explain": "Start by assuming the first item is the highest, then compare every item with it and replace it whenever a bigger one is found."}, {"id": "pz-10", "topic": "programming", "lang": "python", "title": "Menu validation", "prompt": "Ask the user to choose A, B or C. Keep saying that the entry is not a valid choice and asking again until they enter one of those letters, then output their choice.", "lines": ["choice = input(\"Enter A, B or C: \")", "while choice not in [\"A\", \"B\", \"C\"]:", "    print(choice, \"is not a valid choice\")", "    choice = input(\"Try again: \")", "print(\"You chose\", choice)"], "explain": "A validation loop needs one input before the loop and another inside it; without the second input the condition never changes and the loop runs forever."}, {"id": "pz-11", "topic": "algorithms", "lang": "pseudocode", "title": "Validate a mark", "prompt": "Read a mark from the user, repeating until it is between 0 and 100 inclusive. Output \"Out of range, try again\" after each invalid mark, then output \"Mark saved\".", "lines": ["REPEAT", "    mark ← STRING_TO_INT(USERINPUT)", "    IF mark < 0 OR mark > 100 THEN", "        OUTPUT \"Out of range, try again\"", "    ENDIF", "UNTIL mark ≥ 0 AND mark ≤ 100", "OUTPUT \"Mark saved\""], "explain": "REPEAT ... UNTIL checks its condition at the end, so the body always runs at least once; it stops as soon as the UNTIL condition is true."}, {"id": "pz-12", "topic": "programming", "lang": "python", "title": "Dice with a bonus", "prompt": "Roll a six-sided dice and output the roll. If it is a 6, roll a bonus dice, add it on and output the new score. Finally output the final score.", "lines": ["import random", "dice = random.randint(1, 6)", "print(\"You rolled a\", dice)", "if dice == 6:", "    bonus = random.randint(1, 6)", "    dice = dice + bonus", "    print(\"Bonus roll! You now have\", dice)", "print(\"Final score:\", dice)"], "explain": "random.randint(1, 6) returns a whole number from 1 to 6 inclusive; the random module must be imported before it can be used."}, {"id": "pz-13", "topic": "programming", "lang": "python", "title": "Shopping list", "prompt": "Ask for items until three have been entered, storing them in a list. Output how many items there are, then output each item in capitals.", "lines": ["items = []", "while len(items) < 3:", "    item = input(\"Enter an item: \")", "    items.append(item)", "print(\"You entered\", len(items), \"items\")", "for item in items:", "    print(item.upper())"], "explain": "append adds to the end of the list, so len(items) grows by one each time round and the while loop stops at 3; the for loop then visits each item in order."}, {"id": "pz-14", "topic": "programming", "lang": "python", "title": "Add VAT function", "prompt": "Write a function that takes a price and returns the price with 20% VAT added. Use it on a price entered by the user and output the result to 2 decimal places.", "lines": ["def add_vat(price):", "    vat = price * 0.2", "    total = price + vat", "    return total", "final = add_vat(float(input(\"Enter the price: \")))", "print(\"Price with VAT:\", round(final, 2))"], "explain": "A function must be defined before it is called; return sends the result back to the line that called it, where it is stored in final."}, {"id": "pz-15", "topic": "programming", "lang": "pseudocode", "title": "Grade subroutine", "prompt": "Write a subroutine that returns \"Distinction\" for a mark of 70 or more, \"Merit\" for 50 or more, and \"Pass\" otherwise. Call it on a mark entered by the user and output the result.", "lines": ["SUBROUTINE grade(mark)", "    result ← \"Pass\"", "    IF mark ≥ 70 THEN", "        result ← \"Distinction\"", "    ELSE IF mark ≥ 50 THEN", "        result ← \"Merit\"", "    ENDIF", "    RETURN result", "ENDSUBROUTINE", "OUTPUT grade(STRING_TO_INT(USERINPUT))"], "explain": "result starts as \"Pass\" and is only changed when a boundary is reached; the highest boundary is tested first so a mark of 85 is not wrongly given \"Merit\", and RETURN sends result back to the caller."}, {"id": "pz-16", "topic": "programming", "lang": "python", "title": "Count the vowels", "prompt": "Write a function that returns the number of vowels in a word (upper or lower case). Call it on a word entered by the user and output the result.", "lines": ["def count_vowels(word):", "    vowels = 0", "    for letter in word.lower():", "        if letter in \"aeiou\":", "            vowels = vowels + 1", "    return vowels", "print(count_vowels(input(\"Enter a word: \")))"], "explain": "The loop goes through the string one character at a time; return is indented to the function's level so it runs only after every letter has been checked."}, {"id": "pz-17", "topic": "algorithms", "lang": "pseudocode", "title": "Digit sum", "prompt": "Write a subroutine that adds up the digits of a whole number (for example 472 gives 13). Call it on a number entered by the user and output the result.", "lines": ["SUBROUTINE digit_sum(n)", "    total ← 0", "    WHILE n > 0", "        total ← total + n MOD 10", "        n ← n DIV 10", "    ENDWHILE", "    RETURN total", "ENDSUBROUTINE", "OUTPUT digit_sum(STRING_TO_INT(USERINPUT))"], "explain": "n MOD 10 gives the last digit and n DIV 10 removes it; the digit must be added before it is removed, and the loop ends when no digits are left."}, {"id": "pz-18", "topic": "programming", "lang": "python", "title": "Palindrome checker", "prompt": "Write a function that returns True if a word reads the same backwards (ignoring capitals) and False if not. Call it on a word entered by the user and output the result.", "lines": ["def is_palindrome(word):", "    backwards = \"\"", "    for letter in word.lower():", "        backwards = letter + backwards", "    return word.lower() == backwards", "print(is_palindrome(input(\"Enter a word: \")))"], "explain": "Putting each new letter in front of the string built so far reverses the word; comparing with == gives a Boolean that the function returns."}, {"id": "pz-19", "topic": "programming", "lang": "python", "title": "Average until -1", "prompt": "Keep reading marks until the user enters -1 (which is not a mark). Then output how many marks were entered and their average.", "lines": ["marks = []", "while True:", "    mark = int(input(\"Enter a mark (-1 to stop): \"))", "    if mark == -1:", "        break", "    marks.append(mark)", "average = sum(marks) / len(marks)", "print(\"Average of\", len(marks), \"marks is\", average)"], "explain": "The rogue value -1 is checked straight after each input and break leaves the loop before it can be stored, so it never affects the average."}, {"id": "pz-20", "topic": "algorithms", "lang": "pseudocode", "title": "Linear search subroutine", "prompt": "Write a subroutine that searches a list from the start and returns the index of the target, or -1 if it is not there. Search [\"Ali\", \"Beth\", \"Cara\"] for a name entered by the user and output the result.", "lines": ["SUBROUTINE search(items, target)", "    FOR i ← 0 TO LEN(items) - 1", "        IF items[i] = target THEN", "            RETURN i", "        ENDIF", "    ENDFOR", "    RETURN -1", "ENDSUBROUTINE", "OUTPUT search([\"Ali\", \"Beth\", \"Cara\"], USERINPUT)"], "explain": "Each item is checked in turn and the subroutine returns as soon as it finds a match; RETURN -1 sits after ENDFOR so it is only reached once every item has been checked."}, {"id": "pz-21", "topic": "algorithms", "lang": "python", "title": "Linear search function", "prompt": "Write a function that uses a while loop to search a list and returns the position of the target, or -1 if it is not found. Search [\"Ali\", \"Beth\", \"Cara\"] for a name entered by the user and output the result.", "lines": ["def linear_search(items, target):", "    index = 0", "    while index < len(items):", "        if items[index] == target:", "            return index", "        index = index + 1", "    return -1", "print(linear_search([\"Ali\", \"Beth\", \"Cara\"], input(\"Find: \")))"], "explain": "index moves on by one only when the current item is not the target; the loop condition stops it running past the end of the list, and -1 signals \"not found\"."}, {"id": "pz-22", "topic": "algorithms", "lang": "pseudocode", "title": "One bubble sort pass", "prompt": "Carry out one pass of a bubble sort on nums, swapping each pair of neighbours that is in the wrong order, then output nums.", "lines": ["nums ← [7, 3, 9, 2]", "FOR i ← 0 TO LEN(nums) - 2", "    temp ← nums[i]", "    IF temp > nums[i + 1] THEN", "        nums[i] ← nums[i + 1]", "        nums[i + 1] ← temp", "    ENDIF", "ENDFOR", "OUTPUT nums"], "explain": "Each item is copied into temp before it is compared; if it is bigger than its neighbour, nums[i] is overwritten with the neighbour and the saved value goes into nums[i + 1]. One pass moves the largest value to the end."}, {"id": "pz-23", "topic": "algorithms", "lang": "python", "title": "Full bubble sort", "prompt": "Sort the list into ascending order with a bubble sort, outputting the list after each pass (for example \"After pass 1 [2, 5, 1, 4, 8]\").", "lines": ["numbers = [5, 2, 8, 1, 4]", "for p in range(len(numbers) - 1):", "    for i in range(len(numbers) - 1 - p):", "        if numbers[i] > numbers[i + 1]:", "            temp = numbers[i]", "            numbers[i] = numbers[i + 1]", "            numbers[i + 1] = temp", "    print(\"After pass\", p + 1, numbers)"], "explain": "The outer loop counts the passes; each pass is one shorter (- p) because the largest values have already bubbled to the end. The print is inside the outer loop but outside the inner one."}, {"id": "pz-24", "topic": "algorithms", "lang": "pseudocode", "title": "Guess the number", "prompt": "Pick a random number from 1 to 10. Keep reading guesses, saying \"Too low\" or \"Too high\", until the user guesses it, then output \"Correct\".", "lines": ["secret ← RANDOM_INT(1, 10)", "REPEAT", "    guess ← STRING_TO_INT(USERINPUT)", "    IF guess < secret THEN", "        OUTPUT \"Too low\"", "    ELSE IF guess > secret THEN", "        OUTPUT \"Too high\"", "    ENDIF", "UNTIL guess = secret", "OUTPUT \"Correct\""], "explain": "The random number is chosen once, before the loop, so it stays the same for every guess; REPEAT ... UNTIL keeps asking until the guess matches."}], "traces": [{"id": "tr-01", "topic": "algorithms", "lang": "pseudocode", "title": "Sequence and selection", "code": "a ← 7\nb ← 3\nc ← a + b * 2\nIF c > 12 THEN\n    a ← c - a\nELSE\n    b ← b * 2\nENDIF\nOUTPUT a + b", "inputs": "", "columns": ["a", "b", "c", "OUTPUT"], "rows": [["7", "3", "", ""], ["7", "3", "13", ""], ["6", "3", "13", ""], ["6", "3", "13", "9"]], "prefill": 1, "explain": "There is no loop, so each row is one significant step: the starting values, working out c, the IF (only one branch runs), then the OUTPUT. Multiplication is done before addition, so c is 7 + 6 = 13, which is greater than 12, so the THEN branch runs."}, {"id": "tr-02", "topic": "algorithms", "lang": "pseudocode", "title": "FOR loop running total", "code": "total ← 0\nFOR i ← 1 TO 4\n    total ← total + i * 2\nENDFOR\nOUTPUT total", "inputs": "", "columns": ["i", "total", "OUTPUT"], "rows": [["", "0", ""], ["1", "2", ""], ["2", "6", ""], ["3", "12", ""], ["4", "20", ""], ["4", "20", "20"]], "prefill": 1, "explain": "The FOR loop runs for i = 1, 2, 3 and 4 (the end value is included) and adds double each value of i to a running total, so it outputs 2 + 4 + 6 + 8 = 20. Convention: one row per iteration of the loop, each cell showing the value at the end of that iteration; the first row holds the starting values and the last row is the OUTPUT after the loop."}, {"id": "tr-03", "topic": "algorithms", "lang": "pseudocode", "title": "Halving with DIV", "code": "n ← 50\ncount ← 0\nWHILE n > 5\n    n ← n DIV 2\n    count ← count + 1\nENDWHILE\nOUTPUT count", "inputs": "", "columns": ["n", "count", "OUTPUT"], "rows": [["50", "0", ""], ["25", "1", ""], ["12", "2", ""], ["6", "3", ""], ["3", "4", ""], ["3", "4", "4"]], "prefill": 1, "explain": "It counts how many times n can be halved (DIV gives the whole-number part, so 25 DIV 2 is 12) before it is 5 or less. The condition is checked at the start of each pass, so the loop stops when n becomes 3. Convention: one row per iteration of the loop, each cell showing the value at the end of that iteration; the first row holds the starting values and the last row is the OUTPUT after the loop."}, {"id": "tr-04", "topic": "algorithms", "lang": "pseudocode", "title": "Reversing digits with MOD and DIV", "code": "num ← 472\nrev ← 0\nWHILE num > 0\n    digit ← num MOD 10\n    rev ← rev * 10 + digit\n    num ← num DIV 10\nENDWHILE\nOUTPUT rev", "inputs": "", "columns": ["num", "digit", "rev", "OUTPUT"], "rows": [["472", "", "0", ""], ["47", "2", "2", ""], ["4", "7", "27", ""], ["0", "4", "274", ""], ["0", "4", "274", "274"]], "prefill": 1, "explain": "It reverses the digits of a number: num MOD 10 takes the last digit, rev * 10 + digit adds it to the end of the reversed number, and num DIV 10 removes the last digit. digit has no value until the first pass. Convention: one row per iteration of the loop, each cell showing the value at the end of that iteration; the first row holds the starting values and the last row is the OUTPUT after the loop."}, {"id": "tr-05", "topic": "algorithms", "lang": "pseudocode", "title": "Linear search with a flag", "code": "arr ← [4, 9, 2, 7]\ntarget ← 2\ni ← 0\nfound ← False\nWHILE i < LEN(arr) AND found = False\n    IF arr[i] = target THEN\n        found ← True\n    ELSE\n        i ← i + 1\n    ENDIF\nENDWHILE\nOUTPUT i", "inputs": "", "columns": ["i", "found", "OUTPUT"], "rows": [["0", "False", ""], ["1", "False", ""], ["2", "False", ""], ["2", "True", ""], ["2", "True", "2"]], "prefill": 1, "explain": "This is a linear search: it checks arr[0], arr[1], arr[2] in turn and stops when the target is found, so it outputs the index of the target (2). i only goes up when the item does not match. Convention: one row per iteration of the loop, each cell showing the value at the end of that iteration; the first row holds the starting values and the last row is the OUTPUT after the loop."}, {"id": "tr-06", "topic": "algorithms", "lang": "pseudocode", "title": "One pass of a bubble sort", "code": "nums ← [5, 1, 4, 2]\nFOR i ← 0 TO 2\n    IF nums[i] > nums[i + 1] THEN\n        temp ← nums[i]\n        nums[i] ← nums[i + 1]\n        nums[i + 1] ← temp\n    ENDIF\nENDFOR\nOUTPUT nums", "inputs": "", "columns": ["i", "temp", "nums", "OUTPUT"], "rows": [["", "", "[5, 1, 4, 2]", ""], ["0", "5", "[1, 5, 4, 2]", ""], ["1", "5", "[1, 4, 5, 2]", ""], ["2", "5", "[1, 4, 2, 5]", ""], ["2", "5", "[1, 4, 2, 5]", "[1, 4, 2, 5]"]], "prefill": 1, "explain": "This is one pass of a bubble sort: each pair of neighbours is compared and swapped (using temp) if they are in the wrong order, so the largest value, 5, bubbles to the end. temp has no value until the first swap. Convention: one row per iteration of the loop, each cell showing the value at the end of that iteration; the first row holds the starting values and the last row is the OUTPUT after the loop."}, {"id": "tr-07", "topic": "algorithms", "lang": "pseudocode", "title": "REPEAT until the total passes 20", "code": "total ← 0\ncount ← 0\nREPEAT\n    num ← STRING_TO_INT(USERINPUT)\n    total ← total + num\n    count ← count + 1\nUNTIL total > 20\nOUTPUT count", "inputs": "The user enters 8, then 5, then 10.", "columns": ["num", "total", "count", "OUTPUT"], "rows": [["", "0", "0", ""], ["8", "8", "1", ""], ["5", "13", "2", ""], ["10", "23", "3", ""], ["10", "23", "3", "3"]], "prefill": 1, "explain": "It counts how many numbers are entered before their total goes over 20. REPEAT ... UNTIL checks the condition at the end of each pass, so the third number (making 23) is still added before the loop stops. Convention: one row per iteration of the loop, each cell showing the value at the end of that iteration; the first row holds the starting values and the last row is the OUTPUT after the loop."}, {"id": "tr-08", "topic": "programming", "lang": "pseudocode", "title": "Calling a subroutine in a loop", "code": "SUBROUTINE triple(x)\n    RETURN x * 3\nENDSUBROUTINE\nresult ← 1\nFOR k ← 1 TO 3\n    result ← triple(result) - k\n    OUTPUT result\nENDFOR", "inputs": "", "columns": ["k", "result", "OUTPUT"], "rows": [["", "1", ""], ["1", "2", "2"], ["2", "4", "4"], ["3", "9", "9"]], "prefill": 1, "explain": "Each pass calls triple, which returns three times the current result, and then k is subtracted. The OUTPUT is inside the loop, so a value is output on every row. One row per iteration; the first row holds the starting values."}, {"id": "tr-09", "topic": "programming", "lang": "python", "title": "range with a step", "code": "total = 0\nfor n in range(3, 16, 3):\n    if n % 2 == 0:\n        total = total + n\n    else:\n        total = total - 1\nprint(total)", "inputs": "", "columns": ["n", "total", "OUTPUT"], "rows": [["", "0", ""], ["3", "-1", ""], ["6", "5", ""], ["9", "4", ""], ["12", "16", ""], ["15", "15", ""], ["15", "15", "15"]], "prefill": 1, "explain": "range(3, 16, 3) gives 3, 6, 9, 12, 15 (counting up in 3s and stopping before 16). Even values of n are added to the total and each odd value takes 1 off. Convention: one row per iteration of the loop, each cell showing the value at the end of that iteration; the first row holds the starting values and the last row is the OUTPUT after the loop."}, {"id": "tr-10", "topic": "programming", "lang": "python", "title": "PIN entry with three attempts", "code": "attempts = 0\npin = \"\"\nwhile pin != \"4321\" and attempts < 3:\n    pin = input(\"Enter PIN: \")\n    attempts = attempts + 1\nif pin == \"4321\":\n    print(\"Unlocked\")\nelse:\n    print(\"Locked\")", "inputs": "The user enters 1111, then 4321.", "columns": ["attempts", "pin", "OUTPUT"], "rows": [["0", "", ""], ["1", "1111", ""], ["2", "4321", ""], ["2", "4321", "Unlocked"]], "prefill": 1, "explain": "The loop keeps asking for the PIN until it is correct or three attempts have been used; the if after the loop decides which message to print. pin starts as an empty string, so its first cell is blank. Convention: one row per iteration of the loop, each cell showing the value at the end of that iteration; the first row holds the starting values and the last row is the OUTPUT after the loop."}, {"id": "tr-11", "topic": "algorithms", "lang": "python", "title": "Index of the largest value", "code": "temps = [12, 17, 9, 21, 15]\nhottest = 0\nfor i in range(1, len(temps)):\n    if temps[i] > temps[hottest]:\n        hottest = i\nprint(\"Hottest day:\", hottest)", "inputs": "", "columns": ["i", "hottest", "OUTPUT"], "rows": [["", "0", ""], ["1", "1", ""], ["2", "1", ""], ["3", "3", ""], ["4", "3", ""], ["4", "3", "Hottest day: 3"]], "prefill": 1, "explain": "hottest stores the index (position) of the largest value found so far, not the value itself. Each item from index 1 onwards is compared with temps[hottest]. Convention: one row per iteration of the loop, each cell showing the value at the end of that iteration; the first row holds the starting values and the last row is the OUTPUT after the loop."}, {"id": "tr-12", "topic": "programming", "lang": "python", "title": "Building a string", "code": "word = \"TRACE\"\nresult = \"\"\nfor i in range(len(word)):\n    if i % 2 == 0:\n        result = result + word[i]\n    else:\n        result = result + \"*\"\nprint(result)", "inputs": "", "columns": ["i", "result", "OUTPUT"], "rows": [["", "", ""], ["0", "T", ""], ["1", "T*", ""], ["2", "T*A", ""], ["3", "T*A*", ""], ["4", "T*A*E", ""], ["4", "T*A*E", "T*A*E"]], "prefill": 1, "explain": "It builds a new string one character at a time: letters at even indexes are kept and letters at odd indexes are replaced with *. result starts as an empty string, so its first cell is blank; string indexes start at 0. Convention: one row per iteration of the loop, each cell showing the value at the end of that iteration; the first row holds the starting values and the last row is the OUTPUT after the loop."}, {"id": "tr-13", "topic": "algorithms", "lang": "python", "title": "Function with a while loop", "code": "def gcd(a, b):\n    while b != 0:\n        r = a % b\n        a = b\n        b = r\n    return a\n\nprint(gcd(84, 36))", "inputs": "", "columns": ["a", "b", "r", "OUTPUT"], "rows": [["84", "36", "", ""], ["36", "12", "12", ""], ["12", "0", "0", ""], ["12", "0", "0", "12"]], "prefill": 1, "explain": "The function finds the highest common factor of 84 and 36 by repeatedly replacing the pair with b and the remainder a % b until the remainder is 0; the value returned is then printed. The first row shows the parameters when the function is called; r has no value until the first pass. Convention: one row per iteration of the loop, each cell showing the value at the end of that iteration; the first row holds the starting values and the last row is the OUTPUT after the loop."}, {"id": "tr-14", "topic": "programming", "lang": "python", "title": "Filtering a list", "code": "numbers = [3, 8, 5, 10, 6]\nevens = []\ncount = 0\nfor n in numbers:\n    if n % 2 == 0:\n        evens.append(n)\n        count = count + 1\nprint(count, evens)", "inputs": "", "columns": ["n", "count", "evens", "OUTPUT"], "rows": [["", "0", "[]", ""], ["3", "0", "[]", ""], ["8", "1", "[8]", ""], ["5", "1", "[8]", ""], ["10", "2", "[8, 10]", ""], ["6", "3", "[8, 10, 6]", ""], ["6", "3", "[8, 10, 6]", "3 [8, 10, 6]"]], "prefill": 1, "explain": "The for loop visits each item in numbers; n % 2 == 0 is True for even numbers, which are appended to the evens list and counted. Convention: one row per iteration of the loop, each cell showing the value at the end of that iteration; the first row holds the starting values and the last row is the OUTPUT after the loop."}], "programs": [{"id": "pg-01", "topic": "programming", "title": "Age next year", "marks": 3, "task": "Write a Python program that:\n- asks the user to enter their name\n- asks the user to enter their age as a whole number\n- outputs a message in the form: Hello [name], next year you will be [age + 1]\n\nYou must convert the age to an integer before doing the calculation.", "hint": "input() always gives you a string, so use int() before adding 1, then str() to join it back into the message.", "markPoints": ["Uses input to get the name and the age", "Converts the age to an integer using int()", "Adds 1 to the age", "Outputs the message in the required format, including the name and the new age (e.g. using str() and + or commas in print)"], "solution": "name = input(\"Enter your name: \")\nage = int(input(\"Enter your age: \"))\nnext_age = age + 1\nprint(\"Hello \" + name + \", next year you will be \" + str(next_age))", "tests": "Inputs Sam, 15 -> Output: Hello Sam, next year you will be 16\nInputs Priya, 11 -> Output: Hello Priya, next year you will be 12"}, {"id": "pg-02", "topic": "programming", "title": "Minutes to hours", "marks": 4, "task": "A cinema shows the length of a film in minutes. Write a Python program that:\n- asks the user to enter the length of a film in minutes (a whole number)\n- calculates the number of whole hours and the number of minutes left over\n- outputs the result in the form: [hours] hours and [minutes] minutes\n\nYou should use integer division (DIV) and remainder (MOD) operators.", "hint": "In Python, DIV is // and MOD is %, so 135 // 60 gives 2 and 135 % 60 gives 15.", "markPoints": ["Gets the number of minutes from the user and converts it to an integer", "Uses // 60 (DIV) to calculate the whole hours", "Uses % 60 (MOD) to calculate the minutes left over", "Outputs the hours and minutes in the required format"], "solution": "total_minutes = int(input(\"Enter the length of the film in minutes: \"))\nhours = total_minutes // 60\nminutes = total_minutes % 60\nprint(str(hours) + \" hours and \" + str(minutes) + \" minutes\")", "tests": "Input 135 -> Output: 2 hours and 15 minutes\nInput 150 -> Output: 2 hours and 30 minutes\nInput 45 -> Output: 0 hours and 45 minutes"}, {"id": "pg-03", "topic": "programming", "title": "Times table", "marks": 3, "task": "Write a Python program that:\n- asks the user to enter a whole number\n- uses a FOR loop to output the times table for that number from 1 to 12, one line at a time, in the form: [count] x [number] = [answer]", "hint": "range(1, 13) gives the numbers 1 to 12, because range stops before the end value.", "markPoints": ["Gets a number from the user and converts it to an integer", "Uses a FOR loop that repeats 12 times, for example range(1, 13)", "Calculates count x number inside the loop", "Outputs each line in the required format"], "solution": "number = int(input(\"Enter a number: \"))\nfor count in range(1, 13):\n    answer = count * number\n    print(count, \"x\", number, \"=\", answer)", "tests": "Input 7 -> Output: 1 x 7 = 7 / 2 x 7 = 14 / 3 x 7 = 21 / 4 x 7 = 28 / 5 x 7 = 35 / 6 x 7 = 42 / 7 x 7 = 49 / 8 x 7 = 56 / 9 x 7 = 63 / 10 x 7 = 70 / 11 x 7 = 77 / 12 x 7 = 84\nInput 3 -> Output: 1 x 3 = 3 / 2 x 3 = 6 / 3 x 3 = 9 / 4 x 3 = 12 / 5 x 3 = 15 / 6 x 3 = 18 / 7 x 3 = 21 / 8 x 3 = 24 / 9 x 3 = 27 / 10 x 3 = 30 / 11 x 3 = 33 / 12 x 3 = 36"}, {"id": "pg-04", "topic": "programming", "title": "Grade boundaries", "marks": 4, "task": "A teacher wants a program to turn a test mark into a grade. Write a Python program that:\n- asks the user to enter a mark out of 100 (you can assume a whole number between 0 and 100 is entered)\n- outputs Distinction if the mark is 70 or more\n- outputs Merit if the mark is 50 to 69\n- outputs Pass if the mark is 40 to 49\n- outputs Fail if the mark is below 40", "hint": "Check the highest boundary first with if, then use elif for the lower boundaries and else for Fail.", "markPoints": ["Gets the mark from the user and converts it to an integer", "Correct condition for Distinction (mark >= 70)", "Correct conditions for Merit (>= 50) and Pass (>= 40) using elif, or equivalent ranges", "Uses else (or a correct condition) to output Fail for marks below 40", "Boundary values are handled correctly (e.g. 70 gives Distinction, 40 gives Pass)"], "solution": "mark = int(input(\"Enter the mark: \"))\nif mark >= 70:\n    print(\"Distinction\")\nelif mark >= 50:\n    print(\"Merit\")\nelif mark >= 40:\n    print(\"Pass\")\nelse:\n    print(\"Fail\")", "tests": "Input 70 -> Output: Distinction\nInput 49 -> Output: Pass\nInput 39 -> Output: Fail"}, {"id": "pg-05", "topic": "programming", "title": "Theme park ride", "marks": 5, "task": "A theme park ride has these rules:\n- anyone 140 cm or taller can ride on their own\n- anyone from 120 cm up to 139 cm can ride only if an adult is with them\n- anyone shorter than 120 cm cannot ride\n\nWrite a Python program that:\n- asks the user for their height in centimetres (a whole number)\n- asks the user whether an adult is with them (yes or no)\n- outputs You can ride, You can ride with an adult, or Sorry, you cannot ride\n\nThe yes/no answer should be accepted in upper or lower case.", "hint": "Use .lower() on the yes/no answer, and combine two conditions with and for the middle rule.", "markPoints": ["Gets the height and converts it to an integer", "Gets the yes/no answer and converts it to lower case (or checks both cases)", "Correct condition height >= 140 outputs You can ride", "Uses and to check height >= 120 together with the answer being yes", "Outputs You can ride with an adult for that case", "Uses else to output Sorry, you cannot ride in all other cases"], "solution": "height = int(input(\"Enter your height in cm: \"))\nadult = input(\"Is an adult with you? (yes/no): \").lower()\nif height >= 140:\n    print(\"You can ride\")\nelif height >= 120 and adult == \"yes\":\n    print(\"You can ride with an adult\")\nelse:\n    print(\"Sorry, you cannot ride\")", "tests": "Inputs 145, no -> Output: You can ride\nInputs 125, YES -> Output: You can ride with an adult\nInputs 125, no -> Output: Sorry, you cannot ride"}, {"id": "pg-06", "topic": "programming", "title": "Ticket range check", "marks": 5, "task": "A concert booking system allows a customer to buy between 1 and 6 tickets. Each ticket costs £8.\n\nWrite a Python program that:\n- asks the user how many tickets they want\n- uses a range check so that, while the number is less than 1 or more than 6, it outputs Invalid - enter a number from 1 to 6 and asks again\n- once a valid number has been entered, outputs the total cost in the form: Total cost: £[cost]", "hint": "Use a while loop whose condition is true for invalid input: tickets < 1 or tickets > 6.", "markPoints": ["Gets the number of tickets and converts it to an integer", "Uses a WHILE loop to repeat while the input is invalid", "Correct range-check condition (tickets < 1 or tickets > 6)", "Outputs the error message and asks for the number again inside the loop", "Calculates the cost as tickets x 8 and outputs it after the loop in the required format"], "solution": "tickets = int(input(\"How many tickets do you want? \"))\nwhile tickets < 1 or tickets > 6:\n    print(\"Invalid - enter a number from 1 to 6\")\n    tickets = int(input(\"How many tickets do you want? \"))\ncost = tickets * 8\nprint(\"Total cost: £\" + str(cost))", "tests": "Input 4 -> Output: Total cost: £32\nInputs 0, 9, 6 -> Output: Invalid - enter a number from 1 to 6 / Invalid - enter a number from 1 to 6 / Total cost: £48\nInputs 7, 1 -> Output: Invalid - enter a number from 1 to 6 / Total cost: £8"}, {"id": "pg-07", "topic": "programming", "title": "Sponsored walk", "marks": 5, "task": "A school is collecting money for a sponsored walk. Write a Python program that:\n- repeatedly asks the user to enter the amount of a donation in whole pounds\n- stops asking when the user enters 0\n- keeps a running total of the donations and counts how many donations were entered (the 0 must not be counted)\n- after the loop, outputs Number of donations: [count] and Total raised: £[total]", "hint": "Ask for the first amount before the loop, then ask again at the end of the loop body so the 0 is never added.", "markPoints": ["Initialises the total and the count to 0", "Uses a WHILE loop that stops when 0 is entered", "Adds each donation to the total inside the loop", "Adds 1 to the count for each donation inside the loop", "The terminating 0 is not counted as a donation", "Outputs the number of donations and the total after the loop"], "solution": "total = 0\ncount = 0\namount = int(input(\"Enter donation in pounds (0 to finish): \"))\nwhile amount != 0:\n    total = total + amount\n    count = count + 1\n    amount = int(input(\"Enter donation in pounds (0 to finish): \"))\nprint(\"Number of donations: \" + str(count))\nprint(\"Total raised: £\" + str(total))", "tests": "Inputs 10, 25, 5, 0 -> Output: Number of donations: 3 / Total raised: £40\nInput 0 -> Output: Number of donations: 0 / Total raised: £0\nInputs 50, 0 -> Output: Number of donations: 1 / Total raised: £50"}, {"id": "pg-08", "topic": "programming", "title": "Weekly step counter", "marks": 5, "task": "A fitness app records the number of steps walked each day for a week. Write a Python program that:\n- uses a FOR loop to ask the user for the number of steps walked on each of the 7 days\n- calculates the total number of steps for the week\n- counts how many days the user walked 10000 steps or more\n- after the loop, outputs Total steps: [total] and Days goal reached: [count]", "hint": "Set total and count to 0 before the loop; inside the loop add to total every time but only add 1 to count when the steps are >= 10000.", "markPoints": ["Initialises the total and the count to 0 before the loop", "Uses a FOR loop that repeats exactly 7 times", "Gets the steps inside the loop and converts them to an integer", "Adds the steps to the running total", "Uses a condition steps >= 10000 to add 1 to the count", "Outputs the total and the count after the loop"], "solution": "total = 0\ncount = 0\nfor day in range(1, 8):\n    steps = int(input(\"Enter steps for day \" + str(day) + \": \"))\n    total = total + steps\n    if steps >= 10000:\n        count = count + 1\nprint(\"Total steps: \" + str(total))\nprint(\"Days goal reached: \" + str(count))", "tests": "Inputs 8000, 10000, 12500, 9999, 4000, 15000, 7000 -> Output: Total steps: 66499 / Days goal reached: 3\nInputs 1000, 2000, 3000, 4000, 5000, 6000, 7000 -> Output: Total steps: 28000 / Days goal reached: 0"}, {"id": "pg-09", "topic": "programming", "title": "Stationery stock search", "marks": 5, "task": "A school shop stores the items it sells in a list:\n\nitems = [\"pen\", \"pencil\", \"ruler\", \"rubber\", \"sharpener\"]\n\nWrite a Python program that:\n- asks the user to enter the name of an item and converts it to lower case\n- uses a loop to search through the list (a linear search)\n- if the item is found, outputs [item] is at index [index]\n- if the item is not found, outputs Item not found\n\nYou must not use Python's built-in ways of searching a list, such as the in operator or items.index().", "hint": "Loop through range(len(items)), compare items[i] with the search term, and use a Boolean variable found that starts as False.", "markPoints": ["Gets the item from the user and converts it to lower case", "Uses a loop to go through each position in the list (e.g. range(len(items)))", "Compares each list item with the search term", "Uses a Boolean flag (or equivalent) to record whether the item was found", "Outputs the item and its index when found", "Outputs Item not found only when the whole list has been searched without a match"], "solution": "items = [\"pen\", \"pencil\", \"ruler\", \"rubber\", \"sharpener\"]\nsearch = input(\"Enter the item to find: \").lower()\nfound = False\nfor i in range(len(items)):\n    if items[i] == search:\n        print(search + \" is at index \" + str(i))\n        found = True\nif found == False:\n    print(\"Item not found\")", "tests": "Input Ruler -> Output: ruler is at index 2\nInput pen -> Output: pen is at index 0\nInput stapler -> Output: Item not found"}, {"id": "pg-10", "topic": "programming", "title": "Counting votes", "marks": 4, "task": "The votes in a class election are stored in a list:\n\nvotes = [\"Red\", \"Blue\", \"Red\", \"Green\", \"Red\", \"Blue\", \"Green\", \"Red\"]\n\nWrite a Python program that:\n- asks the user to enter the name of a team\n- uses a loop to count how many times that team appears in the list\n- outputs the result in the form: [team] received [count] votes", "hint": "Start a count at 0 and add 1 each time the vote in the list matches the team entered.", "markPoints": ["Gets the team name from the user", "Initialises a count to 0", "Uses a loop to go through every item in the list", "Adds 1 to the count when the item matches the team entered", "Outputs the team and the count in the required format"], "solution": "votes = [\"Red\", \"Blue\", \"Red\", \"Green\", \"Red\", \"Blue\", \"Green\", \"Red\"]\nteam = input(\"Enter the team name: \")\ncount = 0\nfor vote in votes:\n    if vote == team:\n        count = count + 1\nprint(team + \" received \" + str(count) + \" votes\")", "tests": "Input Red -> Output: Red received 4 votes\nInput Blue -> Output: Blue received 2 votes\nInput Yellow -> Output: Yellow received 0 votes"}, {"id": "pg-11", "topic": "programming", "title": "Highest and lowest temperature", "marks": 6, "task": "A weather station stores a week of midday temperatures and the matching days in two lists:\n\ndays = [\"Mon\", \"Tue\", \"Wed\", \"Thu\", \"Fri\", \"Sat\", \"Sun\"]\ntemps = [14, 17, 12, 19, 16, 11, 15]\n\nWrite a Python program that finds the highest and the lowest temperature and the day on which each occurred. It should output:\nHighest: [temperature] on [day]\nLowest: [temperature] on [day]\n\nYou must not use the built-in max() or min() functions.", "hint": "Set highest and lowest to the first temperature, then loop through the rest, updating them (and remembering the index) whenever you find a bigger or smaller value.", "markPoints": ["Initialises highest and lowest to the first value in the list (or a suitable starting value)", "Uses a loop to go through the temperatures", "Uses a correct comparison (temps[i] > highest) to update the highest", "Uses a correct comparison (temps[i] < lowest) to update the lowest", "Stores the index (or day) of the highest and lowest values", "Uses the stored index to look up the day in the days list", "Outputs the highest and lowest with their days in the required format"], "solution": "days = [\"Mon\", \"Tue\", \"Wed\", \"Thu\", \"Fri\", \"Sat\", \"Sun\"]\ntemps = [14, 17, 12, 19, 16, 11, 15]\nhighest = temps[0]\nlowest = temps[0]\nhigh_index = 0\nlow_index = 0\nfor i in range(1, len(temps)):\n    if temps[i] > highest:\n        highest = te
