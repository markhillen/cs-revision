optic cable offers high bandwidth over long distances, which suits large uploads and live streaming. It is more expensive than copper."}, {"q": "Why is a wired network usually considered more secure than a wireless one?", "options": ["Wired data is always encrypted", "An attacker needs physical access to a cable to intercept data", "Wired networks cannot get viruses", "Wired networks do not use protocols"], "answer": 1, "explain": "Wireless signals travel through the air, but intercepting wired data needs physical access to the cabling. Wired networks can still get malware."}, {"q": "Which of these is most likely to weaken a wireless signal?", "options": ["Thick walls between the device and the access point", "Using fibre optic cable", "Adding a terminator", "Using HTTPS"], "answer": 0, "explain": "Wireless signal strength depends on distance from the WAP and obstructions such as thick walls."}, {"q": "Which statement about Ethernet is correct?", "options": ["It is used to send email", "It is a type of wireless network", "It can only use fibre optic cable", "It is a family of protocols for wired LANs"], "answer": 3, "explain": "Ethernet is a set of standards for wired LANs and can run over copper or fibre optic cable.", "offSpec": "removed"}], "corrections": [{"said": "A wired network can't be packet sniffed, so it is more secure.", "fix": "Wired data can still be intercepted, but it is harder because an attacker needs physical access to the cable. Wireless signals can be picked up by anyone in range."}, {"said": "Wired has better bandwidth because more things can be connected at once.", "fix": "Bandwidth is the maximum amount of data that can be sent per second. Wired is better because it usually has higher bandwidth, not because it connects more devices."}, {"said": "Ethernet is a wired network that uses copper or fibre optic cables.", "fix": "Ethernet is a family of protocols (standards) for communication on a wired LAN. It can run over copper or fibre optic cable.", "offSpec": "removed"}]}, {"id": "net-03", "title": "Bandwidth, network speed and latency", "pdfPage": 190, "keyPoints": ["Bandwidth is the maximum amount of data that can be transmitted across a network per second.", "Network speed is how fast data is actually transferred. It is usually measured in megabits per second (Mbps).", "Latency is the time delay between data being sent and it being received, usually measured in milliseconds.", "High bandwidth does not guarantee low latency. A fast connection can still feel laggy.", "Large downloads depend mainly on bandwidth. Real-time uses such as gaming, video calls and remote surgery need low latency.", "Data rates are given in bits per second, so convert bytes to bits (multiply by 8) before calculating.", "Transfer time (seconds) = file size in bits ÷ speed in bits per second.", "Performance is also reduced by many users sharing a connection, interference and data collisions."], "keyPointsOff": [2, 3, 4, 5, 6], "keyPointsOffWhy": ["beyond", "beyond", "beyond", "beyond", "beyond"], "flashcards": [{"q": "What is bandwidth?", "a": "The maximum amount of data that can be transmitted across a network per second."}, {"q": "What is latency?", "a": "The time delay between data being sent and it being received.", "offSpec": "beyond"}, {"q": "What is network speed and what unit is it usually measured in?", "a": "How fast data is actually transferred across a network. Usually measured in megabits per second (Mbps)."}, {"q": "What is the formula for transfer time?", "a": "Time (seconds) = file size in bits ÷ transfer speed in bits per second.", "offSpec": "beyond"}, {"q": "How do you convert megabytes (MB) to megabits (Mb)?", "a": "Multiply by 8, because 1 byte = 8 bits.", "offSpec": "beyond"}, {"q": "How long does an 800 MB file take to download at 20 Mbps?", "a": "800 × 8 = 6400 megabits. 6400 ÷ 20 = 320 seconds.", "offSpec": "beyond"}, {"q": "Alex has 200 Mbps broadband but online games feel laggy. What is the likely cause?", "a": "High latency. The delay between sending and receiving data is the problem, not a lack of bandwidth.", "offSpec": "beyond"}, {"q": "Why does a video call need both high bandwidth and low latency?", "a": "High bandwidth carries the video and audio without losing quality. Low latency stops delays, so people can talk naturally.", "offSpec": "beyond"}, {"q": "Why does latency matter less when downloading a large film?", "a": "The download time depends mainly on how much data can be sent per second (bandwidth). A short delay at the start makes little difference.", "offSpec": "beyond"}, {"q": "Which matters most for remote surgery: bandwidth or latency?", "a": "Latency. Any delay between the surgeon's movement and the robot's response could be dangerous.", "offSpec": "beyond"}], "mcq": [{"q": "A 500 MB file is downloaded at 50 Mbps. How long does it take?", "options": ["1.25 seconds", "10 seconds", "80 seconds", "640 seconds"], "answer": 2, "explain": "500 MB × 8 = 4000 megabits. 4000 ÷ 50 = 80 seconds. 10 seconds forgets to convert bytes to bits.", "offSpec": "beyond"}, {"q": "Which term means the time delay between data being sent and received?", "options": ["Bandwidth", "Latency", "Bit rate", "File size"], "answer": 1, "explain": "Latency is delay. Bandwidth is the maximum data per second.", "offSpec": "beyond"}, {"q": "What does Mbps stand for?", "options": ["Megabits per second", "Megabytes per second", "Million bytes per signal", "Maximum bits per second"], "answer": 0, "explain": "Network speeds are measured in bits, so Mbps means megabits per second."}, {"q": "A 4 GB film is downloaded at 100 Mbps. Taking 1 GB as 1000 MB, how long does it take?", "options": ["32 seconds", "40 seconds", "320 seconds", "3200 seconds"], "answer": 2, "explain": "4 GB = 4000 MB = 32,000 megabits. 32,000 ÷ 100 = 320 seconds.", "offSpec": "beyond"}, {"q": "Which statement is correct?", "options": ["High bandwidth always means low latency", "A slow download always means low bandwidth", "A network can have high bandwidth and still have high latency", "Latency is measured in megabits"], "answer": 2, "explain": "Bandwidth and latency are separate. A connection can carry lots of data per second but still have a long delay.", "offSpec": "beyond"}]}, {"id": "net-04", "title": "Network topologies", "offSpec": "removed", "pdfPage": 192, "keyPoints": ["A network topology is the physical arrangement of the devices (nodes) and connections in a network.", "Bus topology: all devices share one main cable (the bus), with a terminator at each end to stop signals bouncing back.", "Bus advantages: cheap, easy to install, uses less cable than a star, and suits small or temporary networks.", "Bus disadvantages: if the main cable fails the whole network fails; collisions increase and performance drops as traffic grows; every device sees all the data.", "Star topology: every device has its own cable to a central switch, which sends data only to the device it is meant for.", "Star advantages: if one cable fails only that device is affected; very few collisions; good performance and security; easy to add devices.", "Star disadvantages: more cable and a switch are needed, so it costs more; if the central switch fails the whole network fails.", "Star is the most common layout for wired LANs."], "keyPointsOff": [0, 1, 2, 3, 4, 5, 6, 7], "keyPointsOffWhy": ["removed", "removed", "removed", "removed", "removed", "removed", "removed", "removed"], "flashcards": [{"q": "What is a network topology?", "a": "The physical arrangement or layout of the devices and connections in a network.", "offSpec": "removed"}, {"q": "Describe a bus topology.", "a": "All devices are connected to a single main cable (the bus), with a terminator at each end.", "offSpec": "removed"}, {"q": "What is the purpose of a terminator in a bus network?", "a": "It stops signals bouncing back along the cable (echoes), which would interfere with other data.", "offSpec": "removed"}, {"q": "Describe a star topology.", "a": "Every device has its own cable connected to a central switch (or hub).", "offSpec": "removed"}, {"q": "What does the switch do in a star network?", "a": "It receives data and sends it only to the device it is intended for, which reduces traffic and collisions.", "offSpec": "removed"}, {"q": "Give two advantages of a star topology.", "a": "If one cable fails only that device is affected; very few data collisions, so performance stays good as devices are added.", "offSpec": "removed"}, {"q": "Give two disadvantages of a star topology.", "a": "Expensive because of the amount of cable and the switch; if the central switch fails the whole network goes down.", "offSpec": "removed"}, {"q": "Give two advantages of a bus topology.", "a": "Cheap and easy to install; uses less cable than a star network.", "offSpec": "removed"}, {"q": "Give two disadvantages of a bus topology.", "a": "If the main cable fails the whole network stops; data collisions increase and the network slows as more devices are added.", "offSpec": "removed"}, {"q": "Why are collisions more common in a bus network?", "a": "All devices share one cable, so two devices sending at the same time causes their data to collide.", "offSpec": "removed"}], "mcq": [{"q": "In a bus network, which component stops signals bouncing back along the cable?", "options": ["Switch", "Terminator", "Router", "Network interface card"], "answer": 1, "explain": "Terminators at each end of the bus absorb signals so they do not reflect back.", "offSpec": "removed"}, {"q": "In a star network, one computer's cable is cut. What happens?", "options": ["Only that computer loses its connection", "The whole network stops working", "All data collides", "The switch shuts down"], "answer": 0, "explain": "Each device has its own cable to the switch, so one failed cable only affects that device.", "offSpec": "removed"}, {"q": "A head office with 30 computers on 3 floors needs a reliable network. Which topology is best and why?", "options": ["Bus, because it uses the most cable", "Bus, because one cable failure only affects one computer", "Star, because it is the cheapest layout", "Star, because a single cable failure does not stop the rest of the network"], "answer": 3, "explain": "A star is more reliable and has fewer collisions, which matters with 30 busy computers, even though it costs more.", "offSpec": "removed"}, {"q": "What is the single point of failure in a star network?", "options": ["Any one workstation", "The terminator", "The central switch", "The printer"], "answer": 2, "explain": "All traffic passes through the central switch, so if it fails no device can communicate.", "offSpec": "removed"}, {"q": "Which topology uses the least cable?", "options": ["Bus", "Star", "Both use the same", "Neither uses cable"], "answer": 0, "explain": "A bus uses one shared cable, whereas a star needs a separate cable from every device to the switch.", "offSpec": "removed"}], "corrections": [{"said": "In a star network data can't collide.", "fix": "A star network has very few collisions because each device has its own cable to the switch, but collisions are not impossible.", "offSpec": "removed"}]}, {"id": "net-05", "title": "Transmitting data", "pdfPage": 196, "keyPoints": ["A device needs a network interface controller (NIC) to connect to a network.", "The internet is the worldwide network of networks (cables, routers and other hardware). The World Wide Web is the collection of web pages accessed over the internet. They are not the same thing.", "An IP address identifies a device on a network so that data can be delivered to it.", "IPv4 addresses are 32 bits, written as four numbers from 0 to 255 (e.g. 210.123.8.79). This gives about 4.3 billion addresses, which is not enough.", "IPv6 addresses are 128 bits, written as eight groups of four hexadecimal digits, giving a vastly larger number of addresses.", "Data is split into packets. Header: source and destination IP addresses, packet number, total number of packets and time to live. Payload: the data. Footer: end-of-packet marker and error-checking data.", "Routers forward packets between networks. They use routing tables to choose an efficient route and route around faults, so packets may take different routes.", "Splitting data into packets means only lost or damaged packets need to be re-sent, and many users can share the network at once."], "keyPointsOff": [3, 4, 5], "keyPointsOffWhy": ["beyond", "beyond", "beyond"], "flashcards": [{"q": "What does a NIC do?", "a": "A network interface controller (card) is the hardware that lets a device connect to a network and send and receive data."}, {"q": "What is the difference between the internet and the World Wide Web?", "a": "The internet is the global network of connected networks (the hardware). The World Wide Web is the collection of web pages accessed using it."}, {"q": "What is an IP address?", "a": "A number that identifies a device on a network, so data can be sent to the right place."}, {"q": "Describe an IPv4 address.", "a": "32 bits, written as four numbers from 0 to 255 separated by dots, e.g. 210.123.8.79.", "offSpec": "beyond"}, {"q": "Why was IPv6 introduced?", "a": "IPv4 only allows about 4.3 billion addresses, which is not enough. IPv6 uses 128 bits, giving vastly more addresses.", "offSpec": "beyond"}, {"q": "What does a packet header contain?", "a": "Source and destination IP addresses, the packet number, the total number of packets and the time to live.", "offSpec": "beyond"}, {"q": "What do the payload and footer of a packet contain?", "a": "Payload: the actual data being sent. Footer: a marker showing the end of the packet and error-checking data.", "offSpec": "beyond"}, {"q": "What does time to live (TTL) in a packet header do?", "a": "Sets the maximum number of hops a packet can make before it is discarded, so lost packets do not circulate forever.", "offSpec": "beyond"}, {"q": "What does a router do?", "a": "Forwards packets between networks, using a routing table to choose an efficient route and avoid faulty or busy links."}, {"q": "Why is data split into packets before it is sent?", "a": "Only lost or damaged packets need re-sending, not the whole file, and packets from many users can share the network."}], "mcq": [{"q": "Which of these is a valid IPv4 address?", "options": ["192.168.300.1", "192.168.1", "192.168.1.20", "13E7:0000:51D5:9CC8"], "answer": 2, "explain": "IPv4 needs four numbers, each from 0 to 255. 300 is too large, and the last option is in IPv6 style.", "offSpec": "beyond"}, {"q": "Which part of a packet contains the destination IP address?", "options": ["Payload", "Header", "Footer", "Checksum"], "answer": 1, "explain": "The header holds addressing information: source and destination IP addresses, packet number and total packets.", "offSpec": "beyond"}, {"q": "What is the largest number that can appear in one part of an IPv4 address?", "options": ["99", "128", "255", "999"], "answer": 2, "explain": "Each part is 8 bits (1 byte), so it ranges from 0 to 255.", "offSpec": "beyond"}, {"q": "What is the main job of a router?", "options": ["To store web pages", "To stop signals bouncing on a bus cable", "To encrypt passwords", "To forward packets between networks, choosing a route for them"], "answer": 3, "explain": "Routers use routing tables to send packets towards their destination across networks."}, {"q": "Why is data split into packets before it is sent?", "options": ["So the file is encrypted", "So the file becomes smaller", "So that only lost or damaged packets need to be re-sent", "So that it can only take one route"], "answer": 2, "explain": "If one packet is lost, only that packet is re-sent rather than the whole file. Packets can also take different routes."}], "corrections": [{"said": "The World Wide Web is one of the three things needed to access the internet.", "fix": "The World Wide Web is the collection of web pages accessed over the internet, not the internet itself. The internet is the worldwide network of networks."}, {"said": "The packet footer just tells the receiver it is the end of the packet.", "fix": "The footer also contains error-checking data (such as a checksum) so the receiver can tell whether the packet was damaged.", "offSpec": "beyond"}, {"said": "Data is split into packets because if it is lost or corrupted it has to restart the process.", "fix": "It is the opposite: with packets, only the lost or corrupted packets need to be re-sent, not the whole file. Packets can also take different routes and share the network."}]}, {"id": "net-06", "title": "Network protocols", "pdfPage": 198, "keyPoints": ["A protocol is a set of rules that allows devices to communicate, e.g. how to start and end a connection, format data and deal with errors.", "Ethernet: protocols for wired LANs. Wi-Fi: protocols for wireless LANs.", "TCP: splits data into packets with sequence numbers, checks for errors, asks for missing or damaged packets to be re-sent and reassembles them in order. It is reliable.", "UDP: sends packets without setting up a connection or checking they arrive. It is faster but lost packets are not re-sent, so it suits streaming, gaming and voice calls.", "IP: adds source and destination IP addresses to packets and routes them across networks.", "HTTP: transfers web pages between a web server and a browser. HTTPS does the same but encrypts the data.", "SMTP: sends email, from a client to a mail server and between mail servers. IMAP: retrieves email, which stays on the server so it can be read on several devices.", "FTP: transfers files between computers over a network, e.g. uploading website files to a web server."], "keyPointsOff": [1, 3, 7], "keyPointsOffWhy": ["removed", "removed", "removed"], "flashcards": [{"q": "What is a protocol?", "a": "A set of rules that allows two devices to communicate with each other."}, {"q": "What is the purpose of TCP?", "a": "Splits data into numbered packets, checks for errors, requests missing or damaged packets again and reassembles them in the correct order."}, {"q": "What is the purpose of UDP and when is it used?", "a": "Sends packets quickly without checking they arrive or re-sending lost ones. Used for live streaming, online gaming and voice calls, where speed matters more.", "offSpec": "removed"}, {"q": "What is the purpose of IP?", "a": "Adds the source and destination IP addresses to each packet and routes packets across networks to the right device."}, {"q": "What is the difference between HTTP and HTTPS?", "a": "Both transfer web pages between a web server and a browser. HTTPS also encrypts the data so it cannot be read if intercepted."}, {"q": "What is SMTP used for?", "a": "Sending email: from an email client to a mail server, and between mail servers."}, {"q": "What is IMAP used for?", "a": "Retrieving email from a mail server. Messages stay on the server, so they can be read and kept in sync on several devices."}, {"q": "What is FTP used for? Give an example.", "a": "Transferring files between computers over a network, e.g. uploading website files to a web server.", "offSpec": "removed"}, {"q": "What is a handshaking protocol?", "a": "One where the two devices exchange signals to set up a connection and agree the rules before data is sent. TCP uses handshaking."}, {"q": "Give a situation where HTTPS should be used instead of HTTP.", "a": "When sending sensitive data, such as logging in or entering card details on an online banking or shopping website."}], "mcq": [{"q": "Which protocol would be used to upload website files to a web server?", "options": ["SMTP", "FTP", "IMAP", "UDP"], "answer": 1, "explain": "FTP (File Transfer Protocol) transfers files between a computer and a server.", "offSpec": "removed"}, {"q": "Which protocol is used to send email?", "options": ["SMTP", "IMAP", "HTTP", "FTP"], "answer": 0, "explain": "SMTP sends email. IMAP is used to retrieve email from a server."}, {"q": "A live online game needs data to arrive with as little delay as possible. Which transport protocol is most suitable?", "options": ["TCP, because it re-sends lost packets", "IMAP, because it keeps data on a server", "FTP, because it transfers files", "UDP, because it does not wait to re-send lost packets"], "answer": 3, "explain": "UDP is faster because it skips checking and re-sending. A few lost packets matter less than delay in a live game.", "offSpec": "removed"}, {"q": "What is an advantage of IMAP?", "options": ["It encrypts web pages", "It routes packets across the internet", "Emails stay on the server, so they can be read on several devices", "It sends emails between mail servers"], "answer": 2, "explain": "IMAP keeps messages on the mail server, so the same mailbox can be viewed on a phone, laptop or tablet."}, {"q": "How is HTTPS different from HTTP?", "options": ["It is used to send email", "It encrypts data sent between the browser and the web server", "It sends data without error checking", "It only works on wired networks"], "answer": 1, "explain": "HTTPS is the secure version of HTTP. It encrypts the data so it cannot be read if intercepted."}, {"q": "Which protocol asks for missing or damaged packets to be sent again?", "options": ["TCP", "UDP", "SMTP", "Ethernet"], "answer": 0, "explain": "TCP checks packets and requests any that are missing or corrupted. UDP does not."}], "corrections": [{"said": "Gap fill: 'either a central, hub or switch' and 'go through the server node'.", "fix": "The two words are swapped: 'either a server, hub or switch' and 'they all have to go through the central node'.", "offSpec": "removed"}, {"said": "A handshaking protocol is a protocol computers use to communicate, like TCP.", "fix": "Handshaking is when two devices exchange signals to set up a connection and agree the rules before data is sent. TCP uses handshaking."}, {"said": "Handshaking is a disadvantage when sending a message.", "fix": "Handshaking is a disadvantage for real-time tasks where delay matters, such as live streaming, online gaming or voice and video calls."}, {"said": "Two functions of TCP are sending a header and sending a footer.", "fix": "TCP splits data into packets with sequence numbers, checks for errors, requests missing or damaged packets again and reassembles the packets in the correct order."}, {"said": "Use HTTPS over HTTP for a file that is classified.", "fix": "Use HTTPS when sending sensitive data, such as login details or card details on an online banking or shopping website."}]}, {"id": "net-07", "title": "The TCP/IP model", "pdfPage": 204, "keyPoints": ["A layer is a group of protocols with a similar function. Layers are a way of organising protocols, not physical parts of a computer.", "The four layers, from top to bottom, are: application, transport, internet, link. Mnemonic: Always Try In Life.", "Application layer: HTTP, HTTPS, SMTP and IMAP. Deals with how data moves in and out of applications such as web browsers and email clients.", "Transport layer: TCP. Sets up communication between two devices, splits data into packets and handles error checking.", "Internet layer: IP. Adds IP addresses to packets and routes them across networks.", "Link layer: handles the physical connection, network hardware (e.g. the NIC and cables) and device drivers.", "Each layer only communicates with the layers directly above and below it.", "Layering means each layer can be developed or changed without affecting the others."], "flashcards": [{"q": "Name the four layers of the TCP/IP model from top to bottom.", "a": "Application, transport, internet, link (Always Try In Life)."}, {"q": "Which protocols work at the application layer?", "a": "HTTP, HTTPS, SMTP and IMAP."}, {"q": "Which protocol works at the transport layer?", "a": "TCP (Transmission Control Protocol)."}, {"q": "Which protocol works at the internet layer?", "a": "IP (Internet Protocol)."}, {"q": "Which protocols work at the link layer?", "a": "Ethernet and Wi-Fi.", "offSpec": "removed"}, {"q": "What is a layer in the TCP/IP model?", "a": "A group of protocols that do a similar job. It is a way of organising protocols, not a physical part of the computer."}, {"q": "What does the transport layer do?", "a": "Sets up communication between two devices, splits data into packets with sequence numbers and checks for errors."}, {"q": "What does the internet layer do?", "a": "Adds the source and destination IP addresses to packets and routes them across networks."}, {"q": "Can the application layer communicate directly with the internet layer?", "a": "No. Each layer only communicates with the layers directly above and below it, so it must go through the transport layer."}, {"q": "Why are protocols organised into layers?", "a": "Each layer has a clear job, so it can be developed or changed without affecting the other layers."}], "mcq": [{"q": "In which layer of the TCP/IP model does TCP operate?", "options": ["Application", "Link", "Internet", "Transport"], "answer": 3, "explain": "TCP is a transport layer protocol."}, {"q": "In which layer does Ethernet operate?", "options": ["Transport", "Internet", "Link", "Application"], "answer": 2, "explain": "Ethernet and Wi-Fi are link layer protocols, dealing with the physical network connection.", "offSpec": "removed"}, {"q": "Which protocol belongs in the application layer?", "options": ["IP", "SMTP", "Wi-Fi", "UDP"], "answer": 1, "explain": "SMTP, like HTTP, HTTPS and IMAP, operates at the application layer."}, {"q": "Which is the correct order of the TCP/IP layers from top to bottom?", "options": ["Application, transport, internet, link", "Application, internet, transport, link", "Link, internet, transport, application", "Transport, application, link, internet"], "answer": 0, "explain": "From the top: application, transport, internet, link."}, {"q": "Which layer is responsible for addressing packets and routing them across networks?", "options": ["Application", "Transport", "Link", "Internet"], "answer": 3, "explain": "IP works at the internet layer, adding IP addresses and routing packets."}], "corrections": [{"said": "True: Ethernet belongs in the physical layer.", "fix": "False. The 4-layer TCP/IP model has no physical layer; Ethernet belongs in the link layer.", "offSpec": "removed"}, {"said": "True: the transport layer holds protocols describing where packets will route to.", "fix": "False. Addressing and routing are done by IP in the internet layer. The transport layer (TCP) handles packets and error checking."}, {"said": "An email application uses TCP at the application layer, and IP 'assigns an IP'.", "fix": "The application layer uses SMTP to send and IMAP to retrieve email. TCP is in the transport layer. IP adds source and destination IP addresses and routes packets."}]}, {"id": "net-08", "title": "Network security: authentication and encryption", "pdfPage": 207, "keyPoints": ["Network security aims to let authorised users access only what they need and to keep unauthorised people out.", "The four AQA methods are authentication, encryption, firewalls and MAC address filtering.", "Authentication checks that a user is who they claim to be, e.g. with a username and password, before allowing access.", "Password rules (e.g. minimum length) make passwords harder to guess. Access levels control which files and folders each user can see.", "Other authentication methods include two-factor authentication and biometrics such as fingerprint scans.", "Encryption uses an algorithm and a key to turn plaintext into unreadable ciphertext. Only someone with the correct key can decrypt it.", "Encryption does not stop data being intercepted, but it makes intercepted data unreadable.", "The Caesar cipher shifts each letter a fixed number of places. It is easy to crack because there are only 25 possible shifts."], "keyPointsOff": [7], "keyPointsOffWhy": ["beyond"], "flashcards": [{"q": "What is the aim of network security?", "a": "To allow authorised people to access only what they need, and to prevent unauthorised people from gaining any access."}, {"q": "Name the four network security methods in the AQA specification.", "a": "Authentication, encryption, firewalls and MAC address filtering."}, {"q": "What is authentication?", "a": "Checking that a user is who they claim to be, e.g. with a username and password, before giving them access."}, {"q": "Why might a network manager set password rules?", "a": "Rules such as a minimum length make passwords harder to guess or crack."}, {"q": "How can a school use authentication to protect files?", "a": "Each user logs in, and access levels mean students see only their own areas, while teachers and finance staff can see other files."}, {"q": "What is encryption?", "a": "Using an algorithm and a key to turn plaintext into ciphertext, which cannot be understood without the key."}, {"q": "Does encryption stop data being intercepted?", "a": "No. It does not stop interception, but it makes the intercepted data unreadable to anyone without the key."}, {"q": "How does a Caesar cipher work?", "a": "Each letter is shifted a fixed number of places along the alphabet, e.g. with a shift of +3, A becomes D.", "offSpec": "beyond"}, {"q": "Why is the Caesar cipher weak?", "a": "There are only 25 possible shifts, so an attacker can quickly try them all.", "offSpec": "beyond"}, {"q": "Decrypt YMJ (Caesar shift +5).", "a": "THE. Each letter is shifted back 5 places.", "offSpec": "beyond"}], "mcq": [{"q": "Which is an example of authentication?", "options": ["Blocking traffic from certain IP addresses", "Scrambling a message with a key", "Entering a username and password to log in", "Splitting data into packets"], "answer": 2, "explain": "Authentication proves a user's identity. Scrambling with a key is encryption; blocking traffic is a firewall."}, {"q": "What does encryption do to intercepted data?", "options": ["Deletes it", "Makes it unreadable without the key", "Stops it being sent", "Sends it back to the sender"], "answer": 1, "explain": "Encryption does not stop interception, but the ciphertext cannot be understood without the key."}, {"q": "Using a Caesar cipher with a shift of +3, what is CAT encrypted as?", "options": ["FDW", "ZXQ", "DBU", "CAT3"], "answer": 0, "explain": "C+3 = F, A+3 = D, T+3 = W, giving FDW.", "offSpec": "beyond"}, {"q": "Why is the Caesar cipher easy to crack?", "options": ["It uses a 128-bit key", "It needs a firewall", "It only works on numbers", "There are only 25 possible shifts to try"], "answer": 3, "explain": "An attacker can simply try every one of the 25 shifts until the text makes sense.", "offSpec": "beyond"}, {"q": "What is needed to decrypt ciphertext back into plaintext?", "options": ["A firewall", "A MAC address", "The correct key", "A faster network"], "answer": 2, "explain": "Only someone with the correct key can turn the ciphertext back into readable plaintext."}], "corrections": [{"said": "Decrypted line (+5 shift): 'the caesers cypher is an example of roman inteligence'.", "fix": "The correct decryption is THE CAESAR CIPHER IS AN EXAMPLE OF ROMAN INGENUITY.", "offSpec": "beyond"}, {"said": "Encrypted line (+4 shift) stopped after 'Gspswwyw aew xli asvphw jmvwxh'.", "fix": "The full answer is GSPSWWYW AEW XLI ASVPH'W JMVWX HMKMXEP GSQTYXIV.", "offSpec": "beyond"}]}, {"id": "net-09", "title": "Network security: firewalls and MAC address filtering", "pdfPage": 210, "keyPoints": ["A firewall is hardware, software or both that checks traffic entering or leaving a network and blocks it according to set rules.", "Firewall rules can block certain IP addresses, ports or types of traffic. A firewall can stop outside attacks and stop users reaching unwanted sites.", "Operating systems and home routers include built-in firewalls.", "A MAC address is a unique hardware identifier built into a device's network interface card by the manufacturer.", "MAC address filtering only lets devices whose MAC addresses are on an approved (allowed) list connect to the network.", "MAC filtering does not stop an unauthorised person using an approved device, and MAC addresses can be faked (spoofed) to get round it.", "Two-factor authentication adds a second check, such as a code sent to a phone. It is more secure but less convenient.", "Biometric authentication uses physical features (fingerprint, face, voice, retina). It is convenient but needs expensive equipment and can fail if a feature changes."], "flashcards": [{"q": "What is a firewall?", "a": "Hardware, software or both that monitors traffic entering and leaving a network and blocks traffic that breaks set rules."}, {"q": "What can a firewall block?", "a": "Traffic from certain IP addresses, ports or types of traffic, unwanted internet traffic coming in and users accessing blocked websites."}, {"q": "What is a MAC address?", "a": "A unique identifier for a device's network hardware, built into the network interface card by the manufacturer."}, {"q": "What is MAC address filtering?", "a": "Only devices whose MAC addresses are on an approved list can connect. Any other device is refused."}, {"q": "What is a limitation of MAC address filtering?", "a": "It does not stop an unauthorised person from using an approved device, and a MAC address can be faked (spoofed) to look like an approved one."}, {"q": "What is two-factor authentication?", "a": "A second check as well as the password, such as a code sent to a phone, so an intruder needs both to log in."}, {"q": "Give one disadvantage of two-factor authentication.", "a": "It is less convenient: users must have their phone or other confirmation device with them every time."}, {"q": "Give one advantage and one disadvantage of biometric authentication.", "a": "Advantage: convenient and hard to fake. Disadvantage: equipment is expensive, and it may fail if a feature changes, e.g. after an injury."}, {"q": "Which method would stop unknown devices joining a company's wireless network?", "a": "MAC address filtering, which only lets devices on the approved list connect."}], "mcq": [{"q": "Which security method only allows devices on an approved list to connect to a network?", "options": ["Encryption", "MAC address filtering", "HTTPS", "Biometrics"], "answer": 1, "explain": "MAC address filtering checks a device's MAC address against an allowed list."}, {"q": "What is the main purpose of a firewall?", "options": ["To check traffic in and out of a network and block it according to rules", "To speed up the network", "To turn plaintext into ciphertext", "To give every device a MAC address"], "answer": 0, "explain": "A firewall filters network traffic using rules, blocking anything unwanted."}, {"q": "Which of these is an example of two-factor authentication?", "options": ["Entering a password twice", "Connecting with a cable instead of Wi-Fi", "Using a longer password", "Entering a password and then a code sent to your phone"], "answer": 3, "explain": "Two-factor authentication needs two different things, e.g. something you know (password) and something you have (phone)."}, {"q": "Which is a disadvantage of biometric authentication?", "options": ["Users must remember a long password", "It cannot identify individual people", "The scanning equipment can be expensive", "It only works on wireless networks"], "answer": 2, "explain": "Biometric scanners and software are expensive, and scans may fail if a feature changes."}, {"q": "Where is a device's MAC address stored?", "options": ["On the web server", "In its network interface card", "In the firewall rules", "In the packet payload"], "answer": 1, "explain": "The MAC address is built into the network interface hardware by the manufacturer."}], "corrections": [{"said": "Gap fill: the measures are called 'network-security'.", "fix": "The word from the list is 'cyber': the measures are called cyber-security."}]}, {"id": "net-10", "title": "Networks recap", "pdfPage": 223, "keyPoints": ["Two offices in different cities linked together form a WAN, because they cover a large geographical area using leased connections.", "A router forwards packets between networks, e.g. joining a home or school LAN to the internet. A switch connects devices within a LAN.", "An IP address identifies a device on a network and can change. A MAC address is fixed into the network hardware by the manufacturer.", "Wired networks can use copper or fibre optic cable. Fibre is better for long distances and high bandwidth, such as linking buildings.", "Upgrading from bus to star improves reliability and reduces collisions, but costs more to install.", "Choose protocols by the task: HTTPS for payments, SMTP to send and IMAP to read email."], "keyPointsOff": [4], "keyPointsOffWhy": ["removed"], "flashcards": [{"q": "A company links its London and Manchester offices to share files. Is this a LAN or a WAN? Why?", "a": "A WAN, because it covers a large geographical area and uses infrastructure leased from telecoms companies."}, {"q": "Give three reasons why a school might use a network.", "a": "Teachers and students can share files and printers; staff can communicate by email; users can log in and reach their work from any computer."}, {"q": "What is the purpose of a router?", "a": "To forward data packets between networks, e.g. connecting a school LAN to the internet, choosing a route for each packet."}, {"q": "How does an IP address differ from a MAC address?", "a": "An IP address identifies a device on a network and can change. A MAC address is a permanent unique ID built into the network hardware."}, {"q": "A business needs to link a new building a few hundred metres away to its LAN. What could it use?", "a": "Fibre optic cable, which carries high bandwidth over long distances, or a wireless link between the buildings."}, {"q": "Why must a website that takes payments use HTTPS rather than HTTP?", "a": "HTTPS encrypts the data, so card details and passwords cannot be read if they are intercepted."}, {"q": "Give three benefits of upgrading from a bus to a star topology.", "a": "One failed cable no longer stops the whole network; fewer collisions so better performance when busy; easier to add new devices.", "offSpec": "removed"}, {"q": "Give one drawback of upgrading from a bus to a star topology.", "a": "It costs more because more cable and a central switch are needed, and experts may be needed to install it.", "offSpec": "removed"}, {"q": "Why would a voice call app use UDP rather than TCP?", "a": "UDP does not wait for lost packets to be re-sent, so there is less delay. A small gap is better than a delayed conversation.", "offSpec": "removed"}], "mcq": [{"q": "Which pairing of protocol and TCP/IP layer is correct?", "options": ["IP and internet", "UDP and application", "HTTP and transport", "Wi-Fi and internet"], "answer": 0, "explain": "IP is in the internet layer. HTTP is application, UDP is transport and Wi-Fi is link."}, {"q": "Which statement about IP and MAC addresses is correct?", "options": ["A MAC address is used to route packets across the internet", "Both are always fixed by the manufacturer", "An IP address is stored on the NIC and never changes", "A MAC address is built into the network hardware; an IP address can change"], "answer": 3, "explain": "MAC addresses are fixed in the hardware. IP addresses are given to a device by the network and can change."}, {"q": "Which device connects a home LAN to the internet?", "options": ["Terminator", "Bluetooth headset", "Router", "Firewall rule"], "answer": 2, "explain": "A router forwards packets between networks, such as the home LAN and the internet."}, {"q": "A student wants to read the same email folders on a phone and a laptop. Which protocol supports this?", "options": ["SMTP", "IMAP", "FTP", "UDP"], "answer": 1, "explain": "IMAP keeps messages on the mail server, so every device shows the same mailbox."}, {"q": "A 10 MB file is sent at 2 Mbps. How long does it take?", "options": ["5 seconds", "20 seconds", "40 seconds", "80 seconds"], "answer": 2, "explain": "10 MB × 8 = 80 megabits. 80 ÷ 2 = 40 seconds.", "offSpec": "beyond"}, {"q": "Why would a busy office switch from a bus to a star topology?", "options": ["To use less cable", "To make the network cheaper to install", "To remove the need for a switch", "To reduce collisions and stop one cable fault bringing down the whole network"], "answer": 3, "explain": "A star has fewer collisions and one failed cable only affects one device. It uses more cable and costs more.", "offSpec": "removed"}], "corrections": [{"said": "A router is where all the wires lead to and is a wireless access point.", "fix": "A router forwards data packets between networks, for example connecting a home or school LAN to the internet. A switch connects devices within a LAN."}, {"said": "Fibre optic uses light whereas Ethernet is made of copper.", "fix": "Ethernet is a set of protocols that can run over copper or fibre. Fibre uses light, giving higher bandwidth over longer distances with no electrical interference.", "offSpec": "removed"}, {"said": "FTP would be used for sending texts.", "fix": "FTP is used to transfer files between computers, for example uploading website files to a web server.", "offSpec": "removed"}, {"said": "POP3 sends emails.", "fix": "POP3 retrieves email from a mail server. SMTP is the protocol that sends email.", "offSpec": "removed"}, {"said": "The four TCP/IP layers: 'translation, ?, physical, link', then 'application, transport, internet, network'.", "fix": "The four layers from top to bottom are application, transport, internet and link."}, {"said": "A MAC address is used with an IP address to identify the application.", "fix": "A MAC address identifies a device's network hardware, not an application. A port number is used with the IP address to reach the right application."}]}]}, {"topic": "cyber", "name": "Cyber security", "lessons": [{"id": "cyb-01", "title": "Introduction to cyber security", "pdfPage": 239, "keyPoints": ["Cyber security consists of the processes, practices and technologies designed to protect networks, computers, programs and data from attack, damage or unauthorised access.", "Its main purpose is to keep data and systems safe: stopping data being stolen, changed or deleted, and keeping systems working for the people who should use them.", "Malicious hackers break into systems with harmful intent, for example to steal data for financial gain.", "Ethical hackers test a system's security with the owner's permission and report the flaws so they can be fixed.", "Hacking into a computer system without permission is illegal in the UK under the Computer Misuse Act.", "Penetration testing is the process of attempting to gain access to resources without knowledge of usernames, passwords and other normal means of access, to find weaknesses before criminals do.", "White-box testing: the tester has knowledge of, and possibly basic credentials for, the system. It simulates a malicious insider, such as a disgruntled employee.", "Black-box testing: the tester has no knowledge or credentials. It simulates an external attack. Results go into a report with suggested fixes."], "flashcards": [{"q": "Define cyber security.", "a": "The processes, practices and technologies designed to protect networks, computers, programs and data from attack, damage or unauthorised access."}, {"q": "What is the difference between a malicious hacker and an ethical hacker?", "a": "A malicious hacker breaks in with harmful intent, e.g. to steal data. An ethical hacker tests security with permission and reports flaws so they can be fixed."}, {"q": "Which UK law makes unauthorised hacking illegal?", "a": "The Computer Misuse Act."}, {"q": "What is penetration testing?", "a": "Attempting to gain access to resources without knowledge of usernames, passwords and other normal means of access, to find vulnerabilities so they can be fixed."}, {"q": "What does a white-box penetration test simulate?", "a": "A malicious insider who has knowledge of, and possibly basic credentials for, the target system, e.g. a disgruntled employee or ex-employee."}, {"q": "What does a black-box penetration test simulate?", "a": "An external attack by a hacker who has no knowledge of the system and no credentials."}, {"q": "What does a penetration tester give the organisation at the end of a test?", "a": "A report listing the weaknesses found and suggestions for how to fix them."}, {"q": "Why must a penetration tester have a written contract before testing?", "a": "Hacking without permission is illegal, so the contract gives permission and sets out what the tester can and cannot do."}, {"q": "Why is black-box testing seen as a realistic test?", "a": "The tester starts with no inside information, just like a real external attacker."}], "mcq": [{"q": "Which is the best definition of cyber security?", "options": ["Software that removes viruses from a computer", "The processes, practices and technologies that protect networks, computers, programs and data from attack, damage or unauthorised access", "The act of breaking into a computer system to steal data", "A law that makes hacking illegal in the UK"], "answer": 1, "explain": "Cyber security is much wider than anti-virus software: it covers processes, practices and technologies protecting systems and data."}, {"q": "A company hires a tester and gives them details of its operating system, hardware and database tables before the test. What type of test is this?", "options": ["Black-box penetration test", "Phishing test", "White-box penetration test", "CAPTCHA test"], "answer": 2, "explain": "In a white-box test the tester is given knowledge of the system, simulating a malicious insider."}, {"q": "What does a black-box penetration test aim to simulate?", "options": ["An external attack by someone with no knowledge of the system", "A malicious insider with login details", "A hardware failure in the server room", "A user forgetting their password"], "answer": 0, "explain": "Black-box testers are given no details or credentials, like a real outside attacker."}, {"q": "Which law makes it illegal to access a computer system without permission in the UK?", "options": ["Data Protection Act", "Copyright, Designs and Patents Act", "Freedom of Information Act", "Computer Misuse Act"], "answer": 3, "explain": "The Computer Misuse Act covers unauthorised access to computer systems."}, {"q": "What is the main reason an organisation pays for penetration testing?", "options": ["To install anti-virus software on every computer", "To find vulnerabilities in its systems so they can be fixed before criminals exploit them", "To train staff to type passwords faster", "To make the network run faster"], "answer": 1, "explain": "Penetration testing finds weaknesses and the report explains how to fix them."}], "corrections": [{"said": "Cyber security is pieces of code that protect from malware.", "fix": "Cyber security is the processes, practices and technologies designed to protect networks, computers, programs and data from attack, damage or unauthorised access. It is much wider than anti-malware code."}, {"said": "Gap-fill: during a penetration test a 'cyber' attack takes place.", "fix": "The missing word is 'simulated': a penetration test is a simulated attack carried out with the owner's permission."}]}, {"id": "cyb-02", "title": "Social engineering", "pdfPage": 244, "keyPoints": ["Social engineering is the art of manipulating people so they give up confidential information.", "It targets the trusting nature of people rather than technical weaknesses, so it can get round strong technical security.", "Blagging (pretexting) is creating and using an invented scenario to make a victim give away information or do something they normally would not.", "Phishing is a technique of fraudulently obtaining private information, often using email or SMS.", "Signs of phishing include an odd sender address, a generic greeting, spelling errors, urgent or threatening wording, and links or attachments asking for personal details.", "Shouldering (shoulder surfing) is observing a person's private information over their shoulder, e.g. a PIN at a cashpoint.", "Protection: staff training, checking a caller's identity, never sharing passwords, not clicking unknown links, spam filters, shielding PINs and using privacy screens."], "flashcards": [{"q": "Define social engineering.", "a": "The art of manipulating people so they give up confidential information."}, {"q": "What is blagging?", "a": "Creating and using an invented scenario to engage a victim so they are more likely to give away information or do something they normally would not. Also called pretexting."}, {"q": "What is phishing?", "a": "A technique of fraudulently obtaining private information, often using email or SMS."}, {"q": "What is shouldering?", "a": "Observing a person's private information over their shoulder, e.g. watching someone enter their PIN at a cashpoint."}, {"q": "Give three signs that an email might be a phishing attempt.", "a": "Any three: unusual sender address, generic greeting, spelling or grammar errors, urgent or threatening tone, suspicious links or attachments, requests for personal details."}, {"q": "Give two ways to protect against shouldering.", "a": "Check who is around before entering a PIN or password, shield the keypad with your hand, use a privacy screen filter, avoid private tasks in busy public places."}, {"q": "How can an organisation protect its staff against blagging?", "a": "Train staff to spot blagging, have procedures to verify a caller's identity, and a rule that passwords are never given out."}, {"q": "Why might a criminal use social engineering instead of attacking the system directly?", "a": "People are often the weakest link. Tricking someone can bypass strong technical security such as firewalls and encryption."}], "mcq": [{"q": "Someone phones an office pretending to be from the IT department and asks a member of staff for their password to 'fix a problem'. What is this?", "options": ["Shouldering", "Blagging", "Pharming", "Spyware"], "answer": 1, "explain": "Blagging uses an invented scenario to trick the victim into giving away information."}, {"q": "Which of these is phishing?", "options": ["Watching someone type their PIN at a cashpoint", "Malware that encrypts files and demands payment", "An email pretending to be from a bank asking you to confirm your login details", "A program that records every key you press"], "answer": 2, "explain": "Phishing fraudulently obtains private information, often by email or SMS."}, {"q": "Which is the best protection against shouldering?", "options": ["Shielding the keypad and checking who is nearby", "Installing anti-virus software", "Using a spam filter", "Running a penetration test"], "answer": 0, "explain": "Shouldering is someone physically watching you, so software does not help; covering the keypad and awareness do."}, {"q": "Why can social engineering be effective even against a system with strong technical security?", "options": ["It uses faster computers than the defenders", "It only works on old operating systems", "It breaks encryption", "It tricks people into giving access, so it bypasses the technical defences"], "answer": 3, "explain": "Social engineering exploits human trust rather than technical flaws."}, {"q": "Which feature is LEAST likely to suggest an email is a phishing attempt?", "options": ["A generic greeting such as 'Dear customer'", "An urgent demand to act within 24 hours", "A sender address that matches the real organisation and no request for personal details", "A link asking you to re-enter your bank password"], "answer": 2, "explain": "A genuine sender with no request for personal information is not a typical phishing sign; the others are."}]}, {"id": "cyb-03", "title": "Malware: types and how they work", "pdfPage": 246, "keyPoints": ["Malware (malicious software) is an umbrella term for any hostile or intrusive software.", "A virus attaches itself to files or programs and copies itself when the infected file is run. It may delete or corrupt data and software.", "A worm copies itself and spreads across networks on its own, without needing a host file or human action, and can use up resources until the system crashes.", "A trojan pretends to be harmless software, such as a game, while doing something harmful in the background, e.g. giving someone remote access.", "Spyware secretly monitors the user and sends information such as keystrokes (via a keylogger), passwords and screenshots to criminals.", "Ransomware encrypts files and demands payment to unlock them. Adware forces unwanted adverts; scareware uses fake warnings to frighten users into buying fake software.", "Pharming redirects a website's traffic to a fake copy of the site, which records details such as passwords and card numbers. The user can type the correct web address and still end up on the fake site.", "Protection: up-to-date anti-malware software, firewalls, updating software, not opening unknown attachments or downloads, and keeping backups."], "keyPointsOff": [2, 5], "keyPointsOffWhy": ["beyond", "beyond"], "flashcards": [{"q": "Define malware.", "a": "Short for malicious software: an umbrella term for any hostile or intrusive software, e.g. viruses, trojans and spyware."}, {"q": "What is a computer virus?", "a": "Malware that attaches itself to files or programs and copies itself when the infected file is run. It may delete or corrupt data."}, {"q": "What is a worm?", "a": "Malware that replicates and spreads across networks by itself, without a host file or human action. It can use up resources until the system crashes.", "offSpec": "beyond"}, {"q": "What is a trojan?", "a": "Malware disguised as harmless or useful software, such as a game, that carries out a harmful task in the background."}, {"q": "What does spyware do?", "a": "Secretly monitors what the user does, e.g. recording keystrokes and taking screenshots, and sends the information to criminals."}, {"q": "What is a keylogger?", "a": "A type of spyware that records every key pressed, to capture passwords and other sensitive information."}, {"q": "What does ransomware do?", "a": "Encrypts the victim's files so they cannot be used, then demands payment to unlock them.", "offSpec": "beyond"}, {"q": "What is pharming?", "a": "An attack that redirects a website's traffic to a fake, identical-looking site that records details such as usernames, passwords and card numbers."}, {"q": "What is scareware?", "a": "Malware that shows a fake warning, e.g. 'your computer has a virus', to frighten the user into buying or downloading fake software.", "offSpec": "beyond"}, {"q": "How does a virus spread from one computer to another?", "a": "Infected files are shared, e.g. as email attachments, downloads or on USB sticks. When an infected file is run, the virus copies itself into other files."}], "mcq": [{"q": "Which type of malware spreads across a network by itself without needing to attach to a file?", "options": ["Virus", "Trojan", "Worm", "Adware"], "answer": 2, "explain": "A worm is standalone and self-spreading; a virus needs a host file to be run.", "offSpec": "beyond"}, {"q": "Mark downloads a free game. While he plays, it secretly lets someone else access his computer. What type of malware is this?", "options": ["Trojan", "Worm", "Ransomware", "Adware"], "answer": 0, "explain": "A trojan pretends to be harmless software while doing something harmful in the background."}, {"q": "What does ransomware do?", "options": ["Displays unwanted pop-up adverts", "Records every key pressed", "Floods a server with traffic", "Encrypts files and demands payment to unlock them"], "answer": 3, "explain": "Ransomware makes files unusable by encrypting them, then demands a ransom.", "offSpec": "beyond"}, {"q": "A user types the correct web address but is taken to a fake copy of their bank's site that records their login details. What is this?", "options": ["Shouldering", "Pharming", "Scareware", "Click fraud"], "answer": 1, "explain": "Pharming redirects a website's traffic to a fake site to collect details."}, {"q": "Which type of malware secretly records keystrokes and sends them to criminals?", "options": ["Adware", "Scareware", "Spyware", "Worm"], "answer": 2, "explain": "Spyware monitors the user, often using a keylogger, and sends the data on."}, {"q": "Which statement about computer viruses is true?", "options": ["They can only spread over the internet", "They attach to files and replicate when the infected file is run", "They spread by themselves without any file being run", "They are always harmless"], "answer": 1, "explain": "Viruses need a host file to be run before they copy themselves. Malware that spreads by itself without a host file is a worm."}], "corrections": [{"said": "DDoS is a type of malware.", "fix": "DDoS (distributed denial of service) is an attack, not a type of malware. It is carried out by a botnet of malware-infected computers flooding a server with traffic.", "offSpec": "beyond"}]}, {"id": "cyb-04", "title": "Malware: further threats and anti-malware", "pdfPage": 248, "keyPoints": ["Key difference: a virus needs a human to run an infected file to spread; a worm spreads on its own.", "A botnet is a network of computers infected with malware and controlled as a group without their owners knowing.", "A DDoS (distributed denial of service) attack uses a botnet to flood a server with traffic until it is overloaded, denying access to genuine users. DDoS is an attack, not a type of malware.", "Cryptojacking secretly uses a victim's processor to mine cryptocurrency, causing slow performance and high CPU use.", "Click fraud malware secretly clicks on adverts in the background to make money for criminals at advertisers' expense.", "Signature-based detection compares files with a database of known malware signatures, so the database must be updated constantly to recognise new malware.", "Heuristic analysis looks for suspicious behaviour or code structure to detect new, unknown malware.", "Quarantine isolates an infected or suspicious file so it cannot run, spread or damage other files."], "keyPointsOff": [0, 1, 2, 3, 4], "keyPointsOffWhy": ["beyond", "beyond", "beyond", "beyond", "beyond"], "flashcards": [{"q": "State one difference between a virus and a worm.", "a": "A virus needs a human to run an infected file to spread; a worm replicates and spreads across networks on its own.", "offSpec": "beyond"}, {"q": "What is a botnet?", "a": "A network of computers infected with malware and controlled as a group without the owners' knowledge.", "offSpec": "beyond"}, {"q": "What is a DDoS attack?", "a": "A distributed denial of service attack: a botnet floods a server with traffic until it is overloaded, so genuine users cannot access it.", "offSpec": "beyond"}, {"q": "What is cryptojacking?", "a": "Malware that secretly uses a victim's CPU or GPU to mine cryptocurrency, causing slow performance and high resource use.", "offSpec": "beyond"}, {"q": "What is click fraud malware?", "a": "Malware that secretly uses your computer to click on online adverts, earning money for criminals and costing advertisers.", "offSpec": "beyond"}, {"q": "What is signature-based detection?", "a": "Anti-malware compares files against a database of known malware signatures (code patterns) to find matches."}, {"q": "Why must anti-malware software be updated regularly?", "a": "New malware appears every day. Signature-based detection can only recognise malware whose signature is in its database, so definitions must be kept up to date."}, {"q": "What is heuristic analysis?", "a": "Looking for suspicious behaviour or code structures to detect new, unknown malware that has no known signature yet."}, {"q": "What does quarantine do?", "a": "Isolates an infected or suspicious file in a restricted area so it cannot run, spread or damage other files."}], "mcq": [{"q": "Alex's computer fan runs at full speed and the CPU is busy even when idle. Which malware is most likely?", "options": ["Adware", "Cryptojacking", "Scareware", "Ransomware"], "answer": 1, "explain": "Cryptojacking secretly uses the processor to mine cryptocurrency, causing high CPU use.", "offSpec": "beyond"}, {"q": "How does a DDoS attack make a website unavailable?", "options": ["It encrypts the website's files", "It changes the website's IP address", "A botnet floods the server with traffic until it is overloaded", "It guesses the administrator's password"], "answer": 2, "explain": "Many infected machines send traffic at once, overloading the server so genuine users cannot get in.", "offSpec": "beyond"}, {"q": "Which anti-malware method compares files against a database of known malware code patterns?", "options": ["Signature-based detection", "Heuristic analysis", "Quarantine", "CAPTCHA"], "answer": 0, "explain": "Signature-based detection matches files to known signatures, so it needs regular updates."}, {"q": "Why can heuristic analysis catch malware that signature-based detection misses?", "options": ["It deletes every file it scans", "It only checks files downloaded today", "It blocks all internet traffic", "It looks for suspicious behaviour, so it can spot new malware with no known signature"], "answer": 3, "explain": "Heuristics look at behaviour and code structure, so they can detect new (zero-day) threats."}, {"q": "Thomas sees a pop-up saying his computer is infected, with a link to buy software to fix it. He has no virus. What type of malware is this?", "options": ["Trojan", "Worm", "Scareware", "Spyware"], "answer": 2, "explain": "Scareware frightens users with fake warnings so they buy or download fake software.", "offSpec": "beyond"}], "corrections": [{"said": "A worm infects files, copying itself whenever the file is run.", "fix": "That describes a virus. A worm spreads across networks by itself, without needing a host file or a human to run anything.", "offSpec": "beyond"}, {"said": "Click fraud malware redirects browsers to fake versions of websites to steal information.", "fix": "That describes pharming. Click fraud malware secretly uses your computer to click on online adverts to make money for criminals.", "offSpec": "beyond"}, {"said": "Keyloggers are a type of browser malware.", "fix": "Keyloggers are spyware that record every key pressed. Browser malware includes pharming, adware and click fraud."}, {"said": "Adware is used to frustrate users or to make money for someone shady.", "fix": "Adware forces the browser to show unwanted pop-up adverts or redirects it to unwanted pages, to make money for its creator through advertising.", "offSpec": "beyond"}, {"said": "Anti-malware must be updated so it can recognise the code structure.", "fix": "New malware appears every day. Signature-based detection only recognises malware whose signature is in its database, so the definitions must be updated to catch new threats."}, {"said": "Click fraud does not really hurt anyone.", "fix": "It does cause harm: advertisers pay for fake clicks, your computer's resources and bandwidth are used without permission, and the money funds criminals.", "offSpec": "beyond"}, {"said": "Only careless people end up with malware.", "fix": "Careful users can also be infected: worms spread without any user action, unpatched software can be exploited, and well-made phishing can fool anyone."}]}, {"id": "cyb-05", "title": "Detecting and preventing threats", "pdfPage": 248, "fromSpec": true, "keyPoints": ["Other threats: weak and default passwords, misconfigured access rights, removable media and unpatched or outdated software.", "Weak or default passwords (e.g. 'password' or a factory setting) are easy to guess. Misconfigured access rights let users see or change data they should not.", "Removable media such as USB sticks can bring in malware or be used to take data out. Unpatched software has known vulnerabilities that attackers can exploit.", "Biometric measures use a unique body feature, such as a fingerprint or face, to identify a user. They are common on mobile devices and cannot easily be guessed or forgotten.", "Password systems protect accounts by requiring strong passwords, limiting failed attempts and refusing default or common passwords.", "CAPTCHA (or similar) is a test that humans can pass but automated programs (bots) find hard, used to stop bots creating accounts or submitting forms.", "Email confirmation sends a link to the user's email address to confirm their identity, e.g. when registering or resetting a password.", "Automatic software updates install patches as soon as they are released, fixing vulnerabilities before they can be exploited."], "flashcards": [{"q": "Why are default passwords a security threat?", "a": "They are set by the manufacturer and widely known or easy to find, so attackers can guess them if they are not changed."}, {"q": "What are misconfigured access rights?", "a": "Permissions set up wrongly, so users can see, change or delete data or settings they should not be able to."}, {"q": "Why is removable media a security threat?", "a": "Devices such as USB sticks can bring malware into a system or be used to copy data out of an organisation."}, {"q": "Why is unpatched or outdated software a threat?", "a": "It contains known vulnerabilities that have not been fixed, so attackers can exploit them."}, {"q": "What are biometric measures?", "a": "Security that identifies a user by a unique body feature, such as a fingerprint, face or iris. Common on mobile devices."}, {"q": "Give one advantage of biometrics over passwords.", "a": "A biometric feature cannot be forgotten and is very hard to guess or share."}, {"q": "Give two features of a good password system.", "a": "Any two: requiring long passwords mixing character types, rejecting common or default passwords, limiting failed login attempts, not reusing old passwords."}, {"q": "What is CAPTCHA used for?", "a": "To check that a user is a human, not an automated program (bot), e.g. before creating an account or submitting a form."}, {"q": "How does an email confirmation help security?", "a": "A link is sent to the user's registered email address, confirming they own that address and are who they claim to be."}, {"q": "Why are automatic software updates important?", "a": "They install security patches as soon as they are released, closing known vulnerabilities quickly without relying on the user."}], "mcq": [{"q": "A website asks users to pick out images containing traffic lights before creating an account. What is this security measure?", "options": ["Biometrics", "Email confirmation", "CAPTCHA", "Penetration testing"], "answer": 2, "explain": "CAPTCHA checks that the user is a human and not an automated bot."}, {"q": "Which security measure is designed to fix known vulnerabilities in software?", "options": ["Automatic software updates", "CAPTCHA", "Email confirmation", "Shouldering"], "answer": 0, "explain": "Updates install patches that close known vulnerabilities; unpatched software is a threat."}, {"q": "Which of these is a biometric security measure?", "options": ["A four-digit PIN", "A fingerprint scanner on a phone", "A link sent by email", "A security question"], "answer": 1, "explain": "Biometrics use unique body features such as fingerprints or faces."}, {"q": "A school network lets every student open and edit the teachers' exam folder. Which threat is this?", "options": ["Removable media", "Phishing", "Weak passwords", "Misconfigured access rights"], "answer": 3, "explain": "The permissions are set up wrongly, giving users access they should not have."}, {"q": "After registering on a website, Priya receives a message with a link she must click to activate her account. What is the purpose?", "options": ["To confirm her identity by proving she owns the email address", "To check she is not a bot by solving a puzzle", "To install automatic updates", "To scan her computer for malware"], "answer": 0, "explain": "Email confirmation verifies that the user controls the email address they gave."}, {"q": "Why is a password system that limits the number of failed login attempts more secure?", "options": ["It makes passwords shorter and easier to remember", "It removes the need for a username", "It stops an attacker from trying huge numbers of guesses", "It encrypts all files on the computer"], "answer": 2, "explain": "Locking the account after several failures prevents repeated guessing."}]}]}, {"topic": "databases", "name": "Databases and SQL", "lessons": [{"id": "db-01", "title": "Relational database concepts", "pdfPage": null, "fromSpec": true, "keyPoints": ["A database is an organised, persistent collection of data that can be searched, sorted and updated.", "A relational database stores data in several tables that are linked together using keys.", "A table holds data about one type of thing (e.g. pupils). A record is one row: all the data about one item. A field is one column: one item of data stored for every record.", "Every field has a data type, such as integer, real, Boolean, string or date. A telephone number is stored as a string because it can start with 0 and is not used in calculations.", "A primary key is a field that uniquely identifies each record in a table, so no two records can have the same value, e.g. `PupilID`.", "A foreign key is a field in one table that is the primary key of another table. It creates the link (relationship) between the two tables.", "Data redundancy means the same data is stored more than once unnecessarily. Data inconsistency means copies of the same data do not match, e.g. after only one copy is updated.", "Relational databases reduce redundancy and inconsistency because each fact is stored once, in one table, and other tables refer to it using a foreign key."], "flashcards": [{"q": "What is a relational database?", "a": "A database that stores data in separate tables which are linked together using primary and foreign keys."}, {"q": "What is a record?", "a": "One row of a table, holding all the data about one item, e.g. one pupil."}, {"q": "What is a field?", "a": "One column of a table, holding one item of data (one attribute) for every record, e.g. `Surname`."}, {"q": "What is a primary key?", "a": "A field that uniquely identifies each record in a table. No two records can share the same primary key value."}, {"q": "What is a foreign key?", "a": "A field in one table that is the primary key of another table. It is used to link the two tables."}, {"q": "What is data redundancy?", "a": "When the same data is stored more than once unnecessarily, wasting storage space."}, {"q": "What is data inconsistency?", "a": "When copies of the same data do not match, e.g. a phone number is updated in one record but not in the others."}, {"q": "How does a relational database reduce redundancy and inconsistency?", "a": "Each fact is stored once in its own table. Other tables link to it with a foreign key, so there is only one copy to update."}, {"q": "Which data type should be used for a telephone number field, and why?", "a": "String. It may start with 0 or contain spaces, and it is never used in calculations."}, {"q": "Which data type suits a field that records whether a book is in stock?", "a": "Boolean, because it only ever has two values: True or False."}], "mcq": [{"q": "Which field is the most suitable primary key for the `Pupil` table?", "code": "Pupil\nPupilID | FirstName | Surname | Form\nP01     | Amir      | Shah    | 11A\nP02     | Beth      | Jones   | 11B\nP03     | Cara      | Shah    | 11A\nP04     | Amir      | Lewis   | 11C", "options": ["FirstName", "Surname", "Form", "PupilID"], "answer": 3, "explain": "`PupilID` has a different value for every record. `FirstName`, `Surname` and `Form` all contain repeated values (e.g. two pupils called Amir, two in 11A), so they cannot uniquely identify a record."}, {"q": "A library database has the tables `Book(BookID, Title, AuthorID, Year)` and `Author(AuthorID, FirstName, Surname)`. The primary keys are `BookID` and `AuthorID` respectively. Which field in the `Book` table is a foreign key?", "code": "Author\nAuthorID | FirstName | Surname\n1        | Mia       | Patel\n2        | Tom       | Reed\n3        | Zara      | Khan\n\nBook\nBookID | Title        | AuthorID | Year\n101    | Night Garden | 2        | 2019\n102    | Lost River   | 1        | 2021\n103    | Iron Sky     | 2        | 2023\n104    | Paper Moon   | 3        | 2020\n105    | Silent Tide  | 1        | 2018", "options": ["BookID", "AuthorID", "Title", "Year"], "answer": 1, "explain": "`AuthorID` is in the `Book` table but it is the primary key of the `Author` table, so it is a foreign key that links each book to its author."}, {"q": "Look at the `ClubMember` table. Which problem does the record for Chloe show?", "code": "ClubMember\nMemberID | Name  | Club  | LeaderName | LeaderPhone\n1        | Asha  | Chess | Mr Bell    | 07700 900123\n2        | Ben   | Chess | Mr Bell    | 07700 900123\n3        | Chloe | Chess | Mr Bell    | 07700 900321", "options": ["The primary key is not unique", "Data inconsistency: the same leader has two different phone numbers", "The `Name` field has the wrong data type", "The table contains too few fields"], "answer": 1, "explain": "Mr Bell's phone number is stored three times (redundancy) and one copy differs from the others, so the data is inconsistent. It is no longer clear which number is correct."}, {"q": "How should the `ClubMember` table be redesigned to remove the redundant leader data?", "code": "ClubMember\nMemberID | Name  | Club  | LeaderName | LeaderPhone\n1        | Asha  | Chess | Mr Bell    | 07700 900123\n2        | Ben   | Chess | Mr Bell    | 07700 900123\n3        | Chloe | Chess | Mr Bell    | 07700 900321", "options": ["Add a second `LeaderPhone` field to every record", "Delete the `MemberID` field", "Store each club's leader details once in a `Club` table and link to it with a `ClubID` foreign key in the member table", "Store the leader's phone number as an integer instead of a string"], "answer": 2, "explain": "Moving the leader details into their own `Club` table means each phone number is stored once. Members refer to their club with a `ClubID` foreign key, so updating one record updates it for everyone."}, {"q": "A field stores a customer's telephone number, e.g. 07700 900123. Which data type is most suitable?", "options": ["String", "Integer", "Real", "Boolean"], "answer": 0, "explain": "A telephone number may start with 0 and contain a space, and it is never used in calculations, so it should be stored as a string. Storing it as an integer would lose the leading 0."}, {"q": "Which statement about relational databases is true?", "options": ["All the data must be stored in one large table", "A foreign key value must be different in every record of its table", "Every table in the database must contain exactly the same fields", "Data is split into linked tables so that each fact is stored only once"], "answer": 3, "explain": "Splitting data into linked tables means each fact is stored once, which reduces redundancy and inconsistency. A foreign key value can repeat, e.g. many books can share the same `AuthorID`."}]}, {"id": "db-02", "title": "SQL: SELECT, FROM, WHERE, ORDER BY", "pdfPage": null, "fromSpec": true, "keyPoints": ["SQL (Structured Query Language) is used to retrieve and change data in a relational database.", "`SELECT` lists the fields to return, separated by commas. `SELECT *` returns every field.", "`FROM` names the table the data comes from.", "`WHERE` gives the condition a record must meet to be returned, e.g. `WHERE Price < 20`. Text values go in quotation marks, e.g. `WHERE Genre = 'Racing'`; numbers do not.", "Comparison operators in conditions: `=`, `<>` (not equal), `<`, `<=`, `>`, `>=`. Conditions can be combined with `AND` and `OR`.", "`ORDER BY field ASC` sorts the results in ascending order (A to Z, smallest first). `ORDER BY field DESC` sorts in descending order (Z to A, largest first).", "The clauses go in the order `SELECT ... FROM ... WHERE ... ORDER BY ...`. The field used in `ORDER BY` does not have to be one of the fields selected.", "Only the fields listed after `SELECT` appear in the results, even if `WHERE` tests a different field."], "flashcards": [{"q": "What does `SELECT` do in an SQL query?", "a": "It lists the fields (columns) whose values will be returned."}, {"q": "What does `FROM` do in an SQL query?", "a": "It names the table that the data is taken from."}, {"q": "What does `WHERE` do in an SQL query?", "a": "It sets a condition, so only records that meet the condition are returned."}, {"q": "What does `SELECT *` return?", "a": "Every field of each record that matches the query."}, {"q": "What is the difference between `ORDER BY Price ASC` and `ORDER BY Price DESC`?", "a": "`ASC` sorts from lowest to highest price. `DESC` sorts from highest to lowest."}, {"q": "Write the clauses of a retrieval query in the correct order.", "a": "`SELECT` fields `FROM` table `WHERE` condition `ORDER BY` field `ASC`/`DESC`."}, {"q": "Why does `'Racing'` need quotation marks in `WHERE Genre = 'Racing'` but 20 does not in `WHERE Price < 20`?", "a": "Text (string) values must be in quotation marks. Numeric values are written without them."}, {"q": "Write a query to return the `Title` of every game with a `Rating` of at least 8.", "a": "`SELECT Title FROM Game WHERE Rating >= 8`"}, {"q": "What is the difference between `AND` and `OR` in a `WHERE` clause?", "a": "`AND` returns records that meet both conditions. `OR` returns records that meet at least one of the conditions."}], "mcq": [{"q": "What does this query return?\n\n`SELECT Title FROM Game WHERE Genre = 'Racing'`", "code": "Game\nGameID | Title        | Genre      | Price | Rating\n1      | Star Quest   | Adventure  | 25.00 | 8\n2      | Kart Rush    | Racing     | 15.50 | 7\n3      | Pixel Farm   | Simulation | 10.00 | 9\n4      | Turbo Track  | Racing     | 30.00 | 6\n5      | Dungeon Deep | Adventure  | 20.00 | 9", "options": ["Star Quest, Dungeon Deep", "Kart Rush, Turbo Track", "Racing, Racing", "All five titles"], "answer": 1, "explain": "Only records where `Genre` is exactly `'Racing'` are returned, and only the `Title` field is shown: Kart Rush and Turbo Track."}, {"q": "Which query returns the titles of all games with a rating of 9?", "code": "Game\nGameID | Title        | Genre      | Price | Rating\n1      | Star Quest   | Adventure  | 25.00 | 8\n2      | Kart Rush    | Racing     | 15.50 | 7\n3      | Pixel Farm   | Simulation | 10.00 | 9\n4      | Turbo Track  | Racing     | 30.00 | 6\n5      | Dungeon Deep | Adventure  | 20.00 | 9", "options": ["SELECT Title FROM Game WHERE Rating > 9", "SELECT Rating FROM Game WHERE Title = 9", "SELECT Title FROM Game WHERE Rating = 9", "SELECT Game FROM Title WHERE Rating = 9"], "answer": 2, "explain": "`SELECT Title` picks the field to show, `FROM Game` names the table, and `WHERE Rating = 9` keeps Pixel Farm and Dungeon Deep. `Rating > 9` would return nothing, and the last option swaps the table and field names."}, {"q": "Which title is in the first row of the results of this query?\n\n`SELECT Title FROM Game ORDER BY Price DESC`", "code": "Game\nGameID | Title        | Genre      | Price | Rating\n1      | Star Quest   | Adventure  | 25.00 | 8\n2      | Kart Rush    | Racing     | 15.50 | 7\n3      | Pixel Farm   | Simulation | 10.00 | 9\n4      | Turbo Track  | Racing     | 30.00 | 6\n5      | Dungeon Deep | Adventure  | 20.00 | 9", "options": ["Pixel Farm", "Star Quest", "Dungeon Deep", "Turbo Track"], "answer": 3, "explain": "`DESC` sorts from highest to lowest price, so the most expensive game, Turbo Track at 30.00, comes first."}, {"q": "What does this query return?\n\n`SELECT Title, Price FROM Game WHERE Price < 20 ORDER BY Price ASC`", "code": "Game\nGameID | Title        | Genre      | Price | Rating\n1      | Star Qu
