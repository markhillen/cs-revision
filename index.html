</head><body><title>CS Revision</title>

<style>
/* Layout: one-column app shell (max 760px) with a sticky top bar; topics read like the coloured section tabs of his OneNote notebook; mastery drawn as an 8-bit byte. */
:root{
  --bg:#eef1f6; --surface:#ffffff; --surface-2:#f5f7fb; --line:#d6dce8;
  --ink:#16203a; --ink-2:#4a5672; --ink-3:#7a849c;
  --accent:#1f4fd1; --accent-ink:#ffffff; --accent-soft:#e3eafc;
  --good:#127a46; --good-soft:#e0f3e9; --bad:#b4252f; --bad-soft:#fbe5e6; --warn:#a85f00; --warn-soft:#fdf0dc;
  --code-bg:#f1f3f8; --code-ink:#1d2742;
  --t-data:#1ec3b4; --t-algorithms:#e2534a; --t-programming:#f0a020; --t-systems:#7a5ad8; --t-networks:#2b8be0; --t-cyber:#3f9c3a;
  --font:Arial, "Helvetica Neue", Helvetica, sans-serif;
  --mono:"SFMono-Regular", Menlo, Consolas, "Liberation Mono", monospace;
  --r:12px;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#0f1422; --surface:#182033; --surface-2:#1d2740; --line:#2c3854;
  --ink:#e7ecf7; --ink-2:#aab4cc; --ink-3:#7f8aa6;
  --accent:#7d9cff; --accent-ink:#0b1430; --accent-soft:#22305a;
  --good:#5fd197; --good-soft:#163a2a; --bad:#ff8a91; --bad-soft:#41191e; --warn:#ffbf5e; --warn-soft:#3d2c12;
  --code-bg:#111829; --code-ink:#dce4f7; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#0f1422; --surface:#182033; --surface-2:#1d2740; --line:#2c3854;
  --ink:#e7ecf7; --ink-2:#aab4cc; --ink-3:#7f8aa6;
  --accent:#7d9cff; --accent-ink:#0b1430; --accent-soft:#22305a;
  --good:#5fd197; --good-soft:#163a2a; --bad:#ff8a91; --bad-soft:#41191e; --warn:#ffbf5e; --warn-soft:#3d2c12;
  --code-bg:#111829; --code-ink:#dce4f7; color-scheme:dark}
*{box-sizing:border-box}
html,body{background:var(--bg)}
body{color:var(--ink);font-family:var(--font);font-size:16px;line-height:1.45;-webkit-text-size-adjust:100%}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:10;background:var(--surface)}
button{font:inherit;color:inherit;cursor:pointer}
button:focus-visible,a:focus-visible,input:focus-visible{outline:3px solid var(--accent);outline-offset:2px}
.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;background:var(--surface);border-bottom:1px solid var(--line);
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
.top-in{max-width:760px;margin:0 auto;display:flex;align-items:center;gap:12px;height:56px}
.brand{display:flex;align-items:center;gap:10px;min-width:0;flex:1}
.brand b{font-size:17px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.brand small{color:var(--ink-3);font-size:12px;letter-spacing:.06em;text-transform:uppercase}
.back{border:0;background:none;padding:8px 10px 8px 0;font-size:16px;color:var(--accent);display:flex;align-items:center;gap:4px}
.wrap{max-width:760px;margin:0 auto;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:20px 48px;display:flex;flex-direction:column;gap:20px}
h1{font-size:26px;line-height:1.2;margin:0;text-wrap:balance}
h2{font-size:19px;margin:0;text-wrap:balance}
h3{font-size:16px;margin:0}
.muted{color:var(--ink-2)} .small{font-size:13px} .tiny{font-size:12px;color:var(--ink-3)}
.label{font-size:12px;letter-spacing:.07em;text-transform:uppercase;color:var(--ink-3);font-weight:bold}
.panel{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:16px}
.row{display:flex;gap:12px;align-items:center;flex-wrap:wrap}
.grow{flex:1;min-width:0}
.btn{border:1px solid var(--line);background:var(--surface);border-radius:10px;padding:11px 16px;font-size:15px;font-weight:bold;min-height:44px}
.btn.primary{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.btn.ghost{background:transparent}
.btn:disabled{opacity:.45;cursor:default}
.btn.block{width:100%}
.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}
.stat{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:12px 14px}
.stat .n{font-size:26px;font-weight:bold;font-variant-numeric:tabular-nums}
.today{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.mode{display:flex;flex-direction:column;align-items:flex-start;gap:4px;text-align:left;border:1px solid var(--line);background:var(--surface);border-radius:var(--r);padding:14px;min-height:96px}
.mode b{font-size:16px} .mode span{font-size:13px;color:var(--ink-2)}
.mode.hero{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)} .mode.hero span{color:var(--accent-ink);opacity:.85}
/* topic tabs */
.topics{display:flex;flex-direction:column;gap:8px}
.topic{display:grid;grid-template-columns:10px 1fr auto;gap:14px;align-items:center;text-align:left;border:1px solid var(--line);background:var(--surface);border-radius:var(--r);padding:14px 14px 14px 0;overflow:hidden}
.topic .tab{align-self:stretch;border-radius:0 6px 6px 0}
.topic .meta{font-size:13px;color:var(--ink-2)}
.byte{display:flex;gap:3px;margin-top:8px}
.byte i{width:14px;height:14px;border-radius:3px;border:1px solid var(--line);background:var(--surface-2);display:block}
.byte i.on{border-color:transparent}
.pct{font-weight:bold;font-variant-numeric:tabular-nums;font-size:18px;text-align:right}
.pct small{display:block;font-weight:normal;font-size:11px;color:var(--ink-3);letter-spacing:.04em}
/* lessons list */
.lessons{display:flex;flex-direction:column;border:1px solid var(--line);border-radius:var(--r);background:var(--surface);overflow:hidden}
.lesson{display:flex;gap:12px;align-items:center;padding:13px 14px;border:0;border-top:1px solid var(--line);background:none;text-align:left;width:100%}
.lesson:first-child{border-top:0}
.lesson .num{font-variant-numeric:tabular-nums;color:var(--ink-3);width:22px;flex:none;font-size:13px}
.bar{height:6px;border-radius:3px;background:var(--surface-2);overflow:hidden;width:64px;flex:none;border:1px solid var(--line)}
.bar i{display:block;height:100%}
.chip{display:inline-block;font-size:12px;font-weight:bold;padding:3px 8px;border-radius:999px;background:var(--surface-2);color:var(--ink-2);border:1px solid var(--line)}
.chip.good{background:var(--good-soft);color:var(--good);border-color:transparent}
.chip.bad{background:var(--bad-soft);color:var(--bad);border-color:transparent}
.chip.warn{background:var(--warn-soft);color:var(--warn);border-color:transparent}
/* card */
.progress{height:6px;background:var(--surface-2);border-radius:3px;overflow:hidden;border:1px solid var(--line)}
.progress i{display:block;height:100%;background:var(--accent);transition:width .25s}
.card{background:var(--surface);border:1px solid var(--line);border-radius:16px;padding:22px 20px;min-height:260px;display:flex;flex-direction:column;gap:14px}
.card .q{font-size:21px;line-height:1.35;font-weight:bold}
.card .a{font-size:18px;line-height:1.45;border-top:1px dashed var(--line);padding-top:14px}
.card .src{margin-top:auto}
.flip{min-height:52px}
.grades{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.grades .btn{display:flex;flex-direction:column;align-items:center;gap:2px;padding:10px 6px}
.grades .btn small{font-weight:normal;font-size:12px;color:var(--ink-3)}
.g-again{border-color:var(--bad)!important;color:var(--bad)} .g-hard{border-color:var(--warn)!important;color:var(--warn)} .g-good{border-color:var(--good)!important;color:var(--good)}
pre.code{background:var(--code-bg);color:var(--code-ink);font-family:var(--mono);font-size:14px;line-height:1.5;border-radius:10px;padding:12px 14px;margin:0;overflow-x:auto;white-space:pre;border:1px solid var(--line)}
code{font-family:var(--mono);font-size:.92em;background:var(--code-bg);padding:1px 5px;border-radius:5px}
.opts{display:flex;flex-direction:column;gap:8px}
.opt{display:flex;gap:12px;align-items:flex-start;text-align:left;border:1.5px solid var(--line);background:var(--surface);border-radius:12px;padding:13px 14px;min-height:52px;width:100%;font-size:16px}
.opt .k{flex:none;width:26px;height:26px;border-radius:50%;border:1.5px solid var(--line);display:grid;place-items:center;font-size:13px;font-weight:bold;color:var(--ink-2)}
.opt.correct{border-color:var(--good);background:var(--good-soft)} .opt.correct .k{background:var(--good);border-color:var(--good);color:var(--surface)}
.opt.wrong{border-color:var(--bad);background:var(--bad-soft)} .opt.wrong .k{background:var(--bad);border-color:var(--bad);color:var(--surface)}
.opt:disabled{cursor:default;color:var(--ink)}
.explain{border-radius:12px;padding:12px 14px;font-size:15px}
.explain.good{background:var(--good-soft)} .explain.bad{background:var(--bad-soft)}
.explain b{display:block;margin-bottom:2px}
.picker{display:flex;flex-wrap:wrap;gap:8px}
.pick{border:1.5px solid var(--line);background:var(--surface);border-radius:999px;padding:8px 14px;font-size:14px;display:flex;align-items:center;gap:8px;min-height:40px}
.pick .dot{width:10px;height:10px;border-radius:50%}
.pick[aria-pressed="true"]{border-color:var(--accent);background:var(--accent-soft);font-weight:bold}
.kp{margin:0;padding-left:20px;display:flex;flex-direction:column;gap:8px}
.drill-in{display:flex;gap:8px}
.drill-in input{flex:1;min-width:0;font:inherit;font-size:20px;font-family:var(--mono);padding:10px 12px;border:1.5px solid var(--line);border-radius:10px;background:var(--surface);color:var(--ink)}
.big{font-size:30px;font-weight:bold;font-family:var(--mono);letter-spacing:.04em;overflow-wrap:anywhere}
.tbl{width:100%;border-collapse:collapse;font-size:14px}
.tbl td,.tbl th{padding:8px 6px;border-top:1px solid var(--line);text-align:left;vertical-align:top}
.tbl th{font-size:12px;color:var(--ink-3);text-transform:uppercase;letter-spacing:.05em;border-top:0}
.tbl td.n{text-align:right;font-variant-numeric:tabular-nums;white-space:nowrap}
.note{font-size:13px;color:var(--ink-2);background:var(--surface-2);border:1px solid var(--line);border-radius:10px;padding:10px 12px}
.center{text-align:center}
.score{font-size:54px;font-weight:bold;font-variant-numeric:tabular-nums;line-height:1}
/* practice */
.pz{display:flex;flex-direction:column;gap:6px;padding:8px;border:1.5px dashed var(--line);border-radius:12px;background:var(--surface-2)}
.pz-ans{min-height:64px;background:var(--surface)}
.pzl{font-family:var(--mono);font-size:14px;text-align:left;white-space:pre-wrap;overflow-wrap:anywhere;border:1px solid var(--line);background:var(--surface);border-radius:8px;padding:10px 12px;min-height:44px;color:var(--code-ink)}
.pzl.right{border-color:var(--good);background:var(--good-soft)} .pzl.wrong{border-color:var(--bad);background:var(--bad-soft)}
.tbl.trace th,.tbl.trace td{text-align:center;font-family:var(--mono);border:1px solid var(--line);padding:0}
.tbl.trace th{padding:8px;text-transform:none;font-size:13px;color:var(--ink-2)}
.tbl.trace td.given{padding:8px;color:var(--ink-2);background:var(--surface-2)}
.tbl.trace input{width:100%;min-width:64px;border:0;background:transparent;font:inherit;font-size:16px;text-align:center;padding:10px 4px;color:var(--ink)}
.tbl.trace td.ok{background:var(--good-soft)} .tbl.trace td.no{background:var(--bad-soft)}
.ta{width:100%;font:inherit;font-size:16px;line-height:1.5;padding:12px;border:1.5px solid var(--line);border-radius:12px;background:var(--surface);color:var(--ink);resize:vertical}
.ta.mono{font-family:var(--mono);font-size:15px}
.ticks{display:flex;flex-direction:column;gap:6px}
.tick{display:flex;gap:10px;align-items:flex-start;padding:8px 10px;border:1px solid var(--line);border-radius:10px;background:var(--surface-2);cursor:pointer}
.tick input{width:22px;height:22px;flex:none;margin:1px 0 0;accent-color:var(--good)}
.opt.picked{border-color:var(--accent);background:var(--accent-soft)} .opt.picked .k{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.clock{font-family:var(--mono);font-weight:bold;font-size:16px;font-variant-numeric:tabular-nums;padding:4px 10px;border-radius:8px;background:var(--surface-2);border:1px solid var(--line)}
.clock.late{color:var(--bad);border-color:var(--bad)}
details summary{cursor:pointer;color:var(--accent)}
.set{display:flex;gap:10px;align-items:center;flex-wrap:wrap}
.set input[type=date]{font:inherit;padding:8px 10px;border:1.5px solid var(--line);border-radius:10px;background:var(--surface);color:var(--ink);min-height:44px}
.switch{display:flex;gap:10px;align-items:center;cursor:pointer}
.switch input{width:22px;height:22px;accent-color:var(--accent)}
@media (max-width:480px){ .mode{min-height:0} .stats .n{font-size:22px} .card .q{font-size:19px} h1{font-size:23px} .today{grid-template-columns:1fr} }
@media (prefers-reduced-motion:reduce){*{transition:none!important}}
</style>

<script>
window.BANK = {"topics": [{"topic": "data", "name": "Data representation", "lessons": [{"id": "data-01", "title": "Binary numbers", "pdfPage": 10, "keyPoints": ["Denary (decimal) is base 10 and uses the ten digits 0 to 9. Each column is worth 10 times the column to its right.", "Binary is base 2 and uses only 0 and 1. Computers use binary because their circuits have two states: on (1) and off (0).", "Computers use binary to represent all data and instructions.", "8-bit column headings, from left to right: 128, 64, 32, 16, 8, 4, 2, 1.", "A bit is a single 0 or 1. A nibble is 4 bits. A byte is 8 bits.", "Binary to denary: add up the column values that have a 1 under them.", "Denary to binary: work from 128 down. If the column value fits into what is left, write 1 and subtract it; otherwise write 0.", "One byte can hold 256 different values, from 0 (`00000000`) to 255 (`11111111`)."], "flashcards": [{"q": "What number base is denary, and which digits does it use?", "a": "Base 10, using the digits 0 to 9."}, {"q": "Why do computers use binary?", "a": "Their electrical circuits have only two states, on and off, which can be represented by 1 and 0."}, {"q": "What is a bit?", "a": "A single binary digit: a 0 or a 1. It is the smallest unit of data."}, {"q": "How many bits are in a nibble and in a byte?", "a": "A nibble is 4 bits. A byte is 8 bits."}, {"q": "Write the 8-bit binary column headings.", "a": "128, 64, 32, 16, 8, 4, 2, 1"}, {"q": "Convert `00011000` to denary.", "a": "24 (16 + 8)"}, {"q": "Convert `01111000` to denary.", "a": "120 (64 + 32 + 16 + 8)"}, {"q": "Convert `11010111` to denary.", "a": "215 (128 + 64 + 16 + 4 + 2 + 1)"}, {"q": "Convert 37 to 8-bit binary.", "a": "`00100101` (32 + 4 + 1)"}, {"q": "Convert 118 to 8-bit binary.", "a": "`01110110` (64 + 32 + 16 + 4 + 2)"}, {"q": "What is the largest denary number that can be stored in 8 bits?", "a": "255, which is `11111111`. A byte has 256 possible values, 0 to 255."}], "mcq": [{"q": "What is `10100101` in denary?", "options": ["181", "165", "164", "101"], "answer": 1, "explain": "128 + 32 + 4 + 1 = 165."}, {"q": "Which of these is 146 in 8-bit binary?", "options": ["10010100", "10100010", "10001010", "10010010"], "answer": 3, "explain": "146 = 128 + 16 + 2, so the 128, 16 and 2 columns hold a 1: `10010010`."}, {"q": "How many different values can be represented using 8 bits?", "options": ["256", "255", "128", "512"], "answer": 0, "explain": "Each extra bit doubles the number of values: 2^8 = 256 (the numbers 0 to 255)."}, {"q": "Which statement is true?", "options": ["A byte is 4 bits", "A nibble is 4 bits", "A bit can store 0, 1 or 2", "A nibble is 16 bits"], "answer": 1, "explain": "A nibble is half a byte, so it is 4 bits."}, {"q": "To convert binary to denary you should:", "options": ["add the column values where there is a 1", "add all the column values together", "multiply the column values where there is a 1", "subtract each column value from 255"], "answer": 0, "explain": "Only the columns containing a 1 count, so add those column values."}], "corrections": [{"said": "`01111000` = 122", "fix": "`01111000` = 120 (64 + 32 + 16 + 8)."}, {"said": "118 = `01110100`", "fix": "118 = `01110110` (64 + 32 + 16 + 4 + 2). `01110100` is 116."}, {"said": "146 = `10010100`", "fix": "146 = `10010010` (128 + 16 + 2). `10010100` is 148."}, {"said": "To convert binary to decimal, add all numbers together that do not exceed it", "fix": "To convert binary to denary, add the column values that have a 1 under them, e.g. `00011000` = 16 + 8 = 24."}]}, {"id": "data-02", "title": "Hexadecimal numbers 1", "pdfPage": 12, "keyPoints": ["Hexadecimal (hex) is base 16. It uses the digits 0 to 9 and the letters A to F.", "A = 10, B = 11, C = 12, D = 13, E = 14, F = 15.", "In a 2-digit hex number the column values are 16 and 1 (a third column would be 256).", "A nibble (4 bits) has 16 combinations, so one hex digit represents exactly one nibble.", "Hex to denary: multiply the left digit by 16 and add the right digit, e.g. 4A = 4 x 16 + 10 = 74.", "Denary to hex: divide by 16. The whole number is the first digit and the remainder is the second, e.g. 200 = 12 r 8 = C8.", "Hex is used because it is shorter and easier for humans to read, write and remember than binary, so fewer mistakes are made.", "Hex does not save storage space: the computer still stores everything in binary."], "flashcards": [{"q": "What number base is hexadecimal, and which digits does it use?", "a": "Base 16, using 0 to 9 and A to F."}, {"q": "What denary values do the hex digits A to F represent?", "a": "A = 10, B = 11, C = 12, D = 13, E = 14, F = 15."}, {"q": "What are the column values for a 2-digit hex number?", "a": "16s and 1s."}, {"q": "Convert 4A (hex) to denary.", "a": "74 (4 x 16 = 64, plus A = 10)"}, {"q": "Convert AB (hex) to denary.", "a": "171 (10 x 16 = 160, plus B = 11)"}, {"q": "Convert 100 (denary) to hex.", "a": "64 (100 / 16 = 6 remainder 4)"}, {"q": "Convert 26 (denary) to hex.", "a": "1A (26 / 16 = 1 remainder 10, and 10 = A)"}, {"q": "Why is hexadecimal often used in computer science?", "a": "It is shorter and easier for humans to read, write and remember than binary, so fewer errors are made. It converts easily to binary."}, {"q": "Does using hexadecimal save storage space in a computer?", "a": "No. Computers store all data in binary. Hex is only a shorter way for humans to write binary."}, {"q": "What is the largest 2-digit hex number, and its denary value?", "a": "FF, which is 255."}], "mcq": [{"q": "What is C8 (hex) in denary?", "options": ["128", "188", "200", "208"], "answer": 2, "explain": "C = 12, so 12 x 16 + 8 = 200."}, {"q": "What is 48 (denary) in hex?", "options": ["30", "48", "2F", "3A"], "answer": 0, "explain": "48 / 16 = 3 remainder 0, so 48 = 30 in hex."}, {"q": "Which is a reason hexadecimal is used?", "options": ["It takes up less space in memory", "It is easier for humans to read and write than long binary numbers", "Processors can only process hexadecimal", "It stores text more efficiently than binary"], "answer": 1, "explain": "Hex is a human-friendly shorthand for binary. The computer still stores the data in binary."}, {"q": "What is the hex digit F in denary?", "options": ["16", "14", "6", "15"], "answer": 3, "explain": "The hex digits run 0 to 9 then A (10) to F (15)."}, {"q": "Which hex number is 175 in denary?", "options": ["FA", "A5", "AF", "BF"], "answer": 2, "explain": "175 / 16 = 10 remainder 15. 10 = A and 15 = F, so 175 = AF."}]}, {"id": "data-03", "title": "Hexadecimal numbers 2", "pdfPage": 14, "keyPoints": ["Binary to hex: split the byte into two nibbles and convert each nibble into one hex digit, e.g. `0011 1001` = 39.", "Hex to binary: reverse the process. Convert each hex digit into a 4-bit nibble and join them, e.g. 23 = `0010 0011`.", "Always write each nibble as 4 bits, keeping leading zeros, e.g. 0F = `0000 1111`.", "Nibbles `1010` to `1111` become the hex digits A to F.", "To convert hex to denary you can go via binary, or multiply the left digit by 16 and add the right digit.", "Hex is used for HTML colour codes, MAC addresses and assembly language."], "flashcards": [{"q": "How do you convert an 8-bit binary number to hex?", "a": "Split it into two nibbles (4 bits each) and convert each nibble into one hex digit."}, {"q": "How do you convert a 2-digit hex number to binary?", "a": "Convert each hex digit into a 4-bit nibble, then join the two nibbles together."}, {"q": "Convert `10111000` to hex.", "a": "B8 (`1011` = B, `1000` = 8)"}, {"q": "Convert `11010110` to hex.", "a": "D6 (`1101` = D, `0110` = 6)"}, {"q": "Convert BD (hex) to binary.", "a": "`10111101` (B = `1011`, D = `1101`)"}, {"q": "Convert A2 (hex) to binary.", "a": "`10100010` (A = `1010`, 2 = `0010`)"}, {"q": "Convert 3A (hex) to binary.", "a": "`00111010` (3 = `0011`, A = `1010`)"}, {"q": "Convert 7F (hex) to denary.", "a": "127 (7 x 16 + 15)"}, {"q": "Convert `1001101` to denary.", "a": "77 (64 + 8 + 4 + 1)"}, {"q": "Give three uses of hexadecimal.", "a": "HTML colour codes, MAC addresses and assembly language."}], "mcq": [{"q": "What is `11001110` in hex?", "options": ["EC", "CE", "BE", "C14"], "answer": 1, "explain": "`1100` = C and `1110` = E, so the answer is CE."}, {"q": "What is F6 (hex) in binary?", "options": ["11110110", "01101111", "11111000", "11100110"], "answer": 0, "explain": "F = `1111` and 6 = `0110`."}, {"q": "What is `10101010` in denary?", "options": ["85", "160", "299", "170"], "answer": 3, "explain": "128 + 32 + 8 + 2 = 170. No 8-bit number can be greater than 255."}, {"q": "Which of these is a common use of hexadecimal?", "options": ["Measuring the sampling rate of sound", "HTML colour codes such as #FF0000", "Compressing text files", "Storing images losslessly"], "answer": 1, "explain": "Hex is used for colour codes, MAC addresses and assembly language because it is easy for people to read."}, {"q": "What is `110010` in denary?", "options": ["50", "52", "25", "48"], "answer": 0, "explain": "32 + 16 + 2 = 50."}, {"q": "What is 1F (hex) in binary?", "options": ["00010101", "11110001", "00011111", "00011110"], "answer": 2, "explain": "1 = `0001` and F = `1111`."}], "corrections": [{"said": "BD = `10111011`", "fix": "BD = `10111101` (B = `1011`, D = `1101`). `10111011` is BB."}, {"said": "`110010` = 52", "fix": "`110010` = 50 (32 + 16 + 2)."}, {"said": "`1001101` = 141", "fix": "`1001101` = 77 (64 + 8 + 4 + 1)."}, {"said": "`10101010` = 299", "fix": "`10101010` = 170 (128 + 32 + 8 + 2). An 8-bit number can never be more than 255."}, {"said": "`11010110` = D8 in hex", "fix": "`11010110` = D6 (`1101` = D, `0110` = 6)."}]}, {"id": "data-04", "title": "Units of measure", "pdfPage": 17, "keyPoints": ["The bit is the smallest unit of data: one 0 or 1. 4 bits = 1 nibble and 8 bits = 1 byte.", "1 kilobyte (KB) = 1000 bytes; 1 megabyte (MB) = 1000 KB; 1 gigabyte (GB) = 1000 MB; 1 terabyte (TB) = 1000 GB. A petabyte (PB) is 1000 TB.", "To convert bits to bytes divide by 8. To move up each unit after that divide by 1000; to move down multiply by 1000.", "One keyboard character such as 'd' takes 1 byte, so 'ICT' takes 3 bytes, which is 24 bits.", "GB means gigabyte; Gb means gigabit.", "Binary prefixes use powers of 2, e.g. 1 kibibyte (KiB) = 1024 bytes. AQA does not require you to know these: always use the decimal prefixes (1 KB = 1000 bytes) in calculations."], "flashcards": [{"q": "What is the smallest unit of data?", "a": "The bit (binary digit): a single 0 or 1."}, {"q": "List the units from smallest to largest.", "a": "Bit, nibble, byte, kilobyte, megabyte, gigabyte, terabyte, petabyte."}, {"q": "How many bytes are in 1 kilobyte?", "a": "1000 bytes."}, {"q": "How many megabytes are in 1 gigabyte?", "a": "1000 MB."}, {"q": "How many bits are in 1 kilobyte?", "a": "8000 bits (1000 bytes x 8)."}, {"q": "Convert 400 KB to bits.", "a": "400 x 1000 = 400,000 bytes; x 8 = 3,200,000 bits."}, {"q": "Convert 300 MB to GB.", "a": "0.3 GB (300 / 1000)."}, {"q": "Convert 25 GB to MB.", "a": "25,000 MB (25 x 1000)."}, {"q": "How many bits are needed to store the text 'ICT' using one byte per character?", "a": "24 bits (3 characters x 8 bits)."}, {"q": "What is a kibibyte?", "a": "1024 bytes (KiB). It is a binary prefix and is not required for AQA; in AQA calculations a kilobyte is 1000 bytes."}, {"q": "What is the difference between GB and Gb?", "a": "GB is gigabytes; Gb is gigabits."}], "mcq": [{"q": "How many bytes are in 2.5 MB?", "options": ["250,000", "2,500", "2,500,000", "20,000,000"], "answer": 2, "explain": "1 MB = 1,000,000 bytes, so 2.5 MB = 2,500,000 bytes."}, {"q": "1000 megabytes is equal to:", "options": ["1 terabyte", "1 gigabyte", "1 kilobyte", "1 petabyte"], "answer": 1, "explain": "Each unit is 1000 times the one before: 1000 MB = 1 GB, and 1000 GB = 1 TB."}, {"q": "Convert 16,000 bits into kilobytes.", "options": ["16 KB", "128 KB", "0.2 KB", "2 KB"], "answer": 3, "explain": "16,000 / 8 = 2000 bytes, then 2000 / 1000 = 2 KB."}, {"q": "Which of these is the largest amount of storage?", "options": ["1,500 GB", "900,000 MB", "2 TB", "1,000,000,000 KB"], "answer": 2, "explain": "1,500 GB = 1.5 TB, 900,000 MB = 0.9 TB and 1,000,000,000 KB = 1 TB, so 2 TB is largest."}, {"q": "Which statement is true in AQA calculations?", "options": ["1 kilobyte is 1000 bytes", "1 kilobyte is 1024 bytes", "1 megabyte is 1000 bytes", "1 terabyte is 1000 megabytes"], "answer": 0, "explain": "AQA uses decimal prefixes: 1 KB = 1000 bytes, 1 MB = 1000 KB, 1 GB = 1000 MB and 1 TB = 1000 GB. 1024 belongs to the binary prefixes (kibibyte), which AQA does not use."}], "corrections": [{"said": "1000 megabytes = 1 terabyte", "fix": "1000 MB = 1 GB, and 1000 GB = 1 TB."}, {"said": "Conversion table row for 25 GB: 2500 MB, 250000 KB, 250000000 bytes, 312500000000 bits", "fix": "25 GB = 25,000 MB = 25,000,000 KB = 25,000,000,000 bytes = 200,000,000,000 bits (multiply by 1000 each step down, then by 8 for bits)."}, {"said": "300 MB row: 300000000000 bits", "fix": "300 MB = 300,000,000 bytes; x 8 = 2,400,000,000 bits."}, {"said": "400 KB row: 400000000 bits", "fix": "400 KB = 400,000 bytes; x 8 = 3,200,000 bits."}, {"said": "A kilobyte is factually 1024 bytes (and a megabyte 1024 KB, a gigabyte 1024 MB)", "fix": "In AQA, 1 KB = 1000 bytes, 1 MB = 1000 KB and 1 GB = 1000 MB. 1024 bytes is a kibibyte (KiB), a binary prefix."}]}, {"id": "data-05", "title": "Binary addition", "pdfPage": 21, "keyPoints": ["Binary addition rules: 0 + 0 = 0; 0 + 1 = 1; 1 + 1 = 10 (write 0, carry 1); 1 + 1 + 1 = 11 (write 1, carry 1).", "Add from the right-hand column to the left, carrying just as in denary column addition.", "AQA can ask you to add up to three binary numbers of up to 8 bits each.", "Overflow happens when a result is too big for the bits available, e.g. an 8-bit sum greater than 255 needs a ninth bit.", "With overflow, either extra memory is needed to store the value or the extra bit is discarded, giving a wrong answer.", "A binary shift moves all the bits left or right. A left shift of one place multiplies by 2; a right shift of one place divides by 2.", "A shift of n places multiplies or divides by 2^n. Bits shifted off the end are lost, so right shifts can lose the remainder."], "flashcards": [{"q": "What is 1 + 1 in binary?", "a": "10: write 0 and carry 1."}, {"q": "What is 1 + 1 + 1 in binary?", "a": "11: write 1 and carry 1."}, {"q": "Calculate `111` + `101`.", "a": "`1100` (7 + 5 = 12)"}, {"q": "Calculate `1101` + `0111`.", "a": "`10100` (13 + 7 = 20)"}, {"q": "Calculate `1001101` + `1001010`.", "a": "`10010111` (77 + 74 = 151)"}, {"q": "What is overflow?", "a": "When the result of a calculation is too large for the number of bits available, e.g. more than 255 in 8 bits."}, {"q": "What are the two possible effects of overflow?", "a": "Extra memory is needed to store the extra bit, or the extra bit is discarded and the result is wrong."}, {"q": "Calculate `10111101` + `01101010`. Is there overflow in 8 bits?", "a": "`100100111` (189 + 106 = 295). Yes: 295 needs 9 bits."}, {"q": "What is the effect of shifting a binary number one place to the left?", "a": "It multiplies the number by 2."}, {"q": "What is the effect of shifting a binary number two places to the right?", "a": "It divides the number by 4 (2 x 2). Any remainder is lost."}, {"q": "Shift `00010100` (20) three places left. Give the result.", "a": "`10100000`, which is 160. Three places left multiplies by 8."}], "mcq": [{"q": "Calculate `1100` + `1101`.", "options": ["10001", "11101", "11001", "1001"], "answer": 2, "explain": "12 + 13 = 25, which is `11001`."}, {"q": "Which 8-bit addition causes overflow?", "options": ["`01111111` + `00000001`", "`10000000` + `10000000`", "`01000000` + `01000000`", "`11110000` + `00001111`"], "answer": 1, "explain": "128 + 128 = 256, which needs a ninth bit. The others total 128, 128 and 255."}, {"q": "What is `00001100` after a right shift of two places?", "options": ["`00110000`", "`00000110`", "`00011000`", "`00000011`"], "answer": 3, "explain": "Two places right divides by 4: 12 / 4 = 3."}, {"q": "What does a left shift of three places do to a binary number?", "options": ["Multiplies it by 8", "Multiplies it by 3", "Divides it by 8", "Multiplies it by 6"], "answer": 0, "explain": "Each place left multiplies by 2, so three places multiplies by 2 x 2 x 2 = 8."}, {"q": "Calculate `0110` + `0011`.", "options": ["`1011`", "`1001`", "`0111`", "`1101`"], "answer": 1, "explain": "6 + 3 = 9, which is `1001`."}, {"q": "Add these three binary numbers.", "options": ["`00010010`", "`00010000`", "`00001110`", "`00011000`"], "answer": 0, "explain": "5 + 6 + 7 = 18, which is 16 + 2 = `00010010`.", "code": "  00000101\n  00000110\n+ 00000111"}], "corrections": [{"said": "`111` + `101` = `1110`", "fix": "`111` + `101` = `1100` (7 + 5 = 12)."}, {"said": "`1001101` + `1001010` = `1010111`", "fix": "`1001101` + `1001010` = `10010111` (77 + 74 = 151). The final carry makes the answer 8 bits long."}]}, {"id": "data-06", "title": "ASCII", "pdfPage": 24, "keyPoints": ["Computers store text as binary. A character set gives every character a unique binary code.", "ASCII (American Standard Code for Information Interchange) uses 7 bits, giving 2^7 = 128 characters (codes 0 to 127).", "Because computers work in bytes, each ASCII code is stored in 8 bits with the extra (leftmost) bit set to 0.", "Extended ASCII uses the 8th bit to add another 128 characters (256 in total), e.g. for letters used in other languages.", "Character codes run in sequence: if 'W' is 87, then 'X' is 88 and 'Y' is 89.", "Useful codes: space = 32, 'A' = 65, 'a' = 97 (`01100001`), '0' = 48.", "Upper case and lower case letters have different codes, and a digit character is not its number value: '5' has code 53, while 'S' is 83."], "flashcards": [{"q": "What does ASCII stand for?", "a": "American Standard Code for Information Interchange."}, {"q": "How many bits does standard ASCII use, and how many characters can it represent?", "a": "7 bits, giving 128 characters (codes 0 to 127)."}, {"q": "Why are 7-bit ASCII codes usually stored in 8 bits?", "a": "Computers organise memory in bytes, so each code is padded to 8 bits with the leftmost bit set to 0."}, {"q": "What is extended ASCII?", "a": "An 8-bit version of ASCII with 256 characters. The extra 128 are used for other languages' letters and symbols."}, {"q": "What is a character set?", "a": "A defined list of characters that a computer can recognise, each with its own unique binary code."}, {"q": "Which character has ASCII code 83?", "a": "Capital 'S'."}, {"q": "Decode `01101000` using ASCII.", "a": "104, which is lower case 'h'."}, {"q": "Which character has ASCII code 32?", "a": "The space."}, {"q": "If 'A' is 65, what is the code for 'E'?", "a": "69. Codes run in sequence, and E is four letters after A."}, {"q": "Is ASCII code 53 the letter 'S'?", "a": "No. 53 is the digit character '5'. Capital 'S' is 83."}], "mcq": [{"q": "How many characters can standard 7-bit ASCII represent?", "options": ["256", "127", "128", "65,536"], "answer": 2, "explain": "2^7 = 128 codes, numbered 0 to 127."}, {"q": "The ASCII code for 'a' is 97. What is the code for 'd'?", "options": ["101", "100", "68", "99"], "answer": 1, "explain": "Codes run in sequence: a = 97, b = 98, c = 99, d = 100."}, {"q": "Decode the ASCII codes 72 105.", "options": ["hi", "HI", "Hj", "Hi"], "answer": 3, "explain": "72 is capital 'H' and 105 is lower case 'i'."}, {"q": "Why was extended ASCII introduced?", "options": ["To use the 8th bit to add 128 more characters, such as letters used in other languages", "To make text files smaller", "To store images as text", "To replace binary with denary"], "answer": 0, "explain": "Extended ASCII uses the spare 8th bit, doubling the character set from 128 to 256."}, {"q": "Which byte is the ASCII code for capital 'S' (83)?", "options": ["`01010110`", "`01110011`", "`01010011`", "`00110101`"], "answer": 2, "explain": "64 + 16 + 2 + 1 = 83. The others are 86 ('V'), 115 ('s') and 53 ('5')."}], "corrections": [{"said": "Shifting `00010100` three places left: it halves for every place to the right it moves", "fix": "Shifting three places left multiplies by 2 x 2 x 2 = 8: `00010100` (20) becomes `10100000` (160)."}, {"said": "Encoded message 53,105,120,32,53,101,118,101,110 for 'Six Seven'", "fix": "ASCII 53 is the digit '5', so this decodes as '5ix 5even'. Capital 'S' is 83: 83,105,120,32,83,101,118,101,110."}]}, {"id": "data-07", "title": "Unicode", "pdfPage": 28, "keyPoints": ["ASCII has only 128 characters (256 in extended ASCII), not enough for languages such as Chinese.", "Different countries used different versions of extended ASCII, so the same code could show different characters on different computers.", "Unicode is a character set that uses up to 32 bits (4 bytes) per character. It was originally designed for 16 bits.", "Unicode can represent over a million characters, covering almost every written language plus symbols and emoji.", "The first 128 Unicode codes are the same as ASCII.", "Advantage of Unicode: far more characters and languages in one worldwide standard. Disadvantage: more bits per character, so text files can be larger."], "flashcards": [{"q": "What is Unicode?", "a": "A character set that uses up to 32 bits per character so it can represent characters from almost every written language."}, {"q": "How many bytes is 32 bits?", "a": "4 bytes."}, {"q": "Why was Unicode needed when ASCII already existed?", "a": "ASCII has only 128 (or 256) characters, not enough for many languages, and different countries used different extended ASCII versions."}, {"q": "Give one advantage of Unicode over ASCII.", "a": "It can represent far more characters, including languages such as Chinese, plus symbols and emoji."}, {"q": "Give one disadvantage of Unicode compared with ASCII.", "a": "It uses more bits per character, so text takes up more storage."}, {"q": "How do the first 128 Unicode codes relate to ASCII?", "a": "They are the same as the ASCII codes."}, {"q": "How many characters can an extended ASCII character set hold?", "a": "256 (8 bits)."}, {"q": "How many different characters can 16 bits represent?", "a": "65,536 (2^16)."}, {"q": "Why were there several different extended ASCII character sets?", "a": "Extended ASCII only has 128 extra spaces, so different languages or countries needed their own set of special characters."}, {"q": "The ASCII code for 'W' is 87. What is 'Y', and why?", "a": "89. Character codes run in sequence, and Y is two letters after W."}], "mcq": [{"q": "How many bytes are used by a 32-bit Unicode character?", "options": ["2", "4", "8", "32"], "answer": 1, "explain": "32 bits / 8 = 4 bytes."}, {"q": "Which is an advantage of Unicode over ASCII?", "options": ["It uses fewer bits per character", "It can only store English text", "It can represent characters from nearly every written language", "It makes text files smaller"], "answer": 2, "explain": "Unicode has room for over a million characters, so it covers almost every language."}, {"q": "Which statement is true?", "options": ["The first 128 Unicode characters have the same codes as ASCII", "Unicode uses 7 bits per character", "Standard ASCII can represent Chinese characters", "Unicode files are always smaller than ASCII files"], "answer": 0, "explain": "Unicode was designed to be compatible with ASCII for its first 128 codes."}, {"q": "How many different characters can a 16-bit code represent?", "options": ["32,768", "256", "1,000,000", "65,536"], "answer": 3, "explain": "2^16 = 65,536."}, {"q": "How much storage do 1000 characters need using 32 bits per character?", "options": ["1 KB", "8 KB", "4 KB", "32 KB"], "answer": 2, "explain": "1000 x 32 = 32,000 bits; / 8 = 4000 bytes = 4 KB."}], "corrections": [{"said": "Gap-fill: each code is stored as an 8 bit 'code'", "fix": "The word is 'byte': each ASCII code is stored as an 8-bit byte with the highest bit set to 0. 'Code' belongs in the later 'code page' gap."}, {"said": "Q5: extended ASCII is used for languages whose letters won't fit into ASCII", "fix": "This also needs to explain why there are several versions: extended ASCII only has 128 extra spaces, so different languages and countries needed their own set of special characters."}, {"said": "Unicode allows around 1.2 million characters", "fix": "Unicode has about 1.1 million possible codes (1,114,112). Saying 'over a million' is safe."}]}, {"id": "data-08", "title": "Bitmap images 1", "pdfPage": 30, "keyPoints": ["Colour in the real world is analogue: a continuous, infinite range of values. Images on computers are digital: discrete values.", "A bitmap image is a grid (array) of pixels.", "Pixel is short for picture element: the smallest dot that makes up an image.", "Each pixel's colour is stored as a binary pattern. In a black and white image each pixel is 1 bit, e.g. 1 = black, 0 = white.", "The size of a bitmap image is measured in pixels: width x height, e.g. an 8 x 8 image has 64 pixels. This is sometimes called the image resolution.", "More pixels give more detail but a larger file, because every pixel's colour must be stored.", "dpi means dots per inch: how many pixels fit into each inch when an image is printed or displayed."], "flashcards": [{"q": "What is a bitmap image?", "a": "An image made of a grid of pixels, with each pixel's colour stored as a binary pattern."}, {"q": "What does 'pixel' stand for?", "a": "Picture element: the smallest dot that makes up an image."}, {"q": "What is the difference between analogue and digital?", "a": "Analogue values are continuous, with an infinite range. Digital values are discrete (separate, fixed steps)."}, {"q": "How many colours can a 1-bit-per-pixel image show?", "a": "2, e.g. black (1) and white (0)."}, {"q": "How many pixels are in an image 8 pixels wide and 8 pixels high?", "a": "64 (8 x 8)."}, {"q": "How do you work out the size of an image in pixels?", "a": "Width in pixels x height in pixels."}, {"q": "What does dpi stand for?", "a": "Dots per inch."}, {"q": "With 1 = black and 0 = white, draw the row `11000011`.", "a": "Black, black, white, white, white, white, black, black."}, {"q": "Why does an image with more pixels have a larger file size?", "a": "Each pixel's colour must be stored in binary, so more pixels means more bits."}], "mcq": [{"q": "What is a pixel?", "options": ["The number of colours in an image", "The smallest single element of a bitmap image", "A unit of file size", "The width of an image in inches"], "answer": 1, "explain": "Pixel stands for picture element, the smallest dot in an image."}, {"q": "Using 1 = black and 0 = white, which binary row gives black, white, black, white?", "options": ["`0101`", "`1100`", "`0011`", "`1010`"], "answer": 3, "explain": "Each bit is one pixel, read left to right: 1 black, 0 white, 1 black, 0 white."}, {"q": "An image is 600 pixels wide and 700 pixels high. How many pixels does it have?", "options": ["1,300", "42,000", "420,000", "4,200,000"], "answer": 2, "explain": "600 x 700 = 420,000 pixels."}, {"q": "Why are images on a computer described as digital?", "options": ["They are stored as discrete binary values", "They have an infinite range of colours", "They are always black and white", "They are measured in hertz"], "answer": 0, "explain": "Computers store each pixel as a fixed binary value, so the image is made of discrete values."}, {"q": "A black and white image is 10 x 10 pixels and uses 1 bit per pixel. What is its size in bits?", "options": ["10", "100", "200", "800"], "answer": 1, "explain": "10 x 10 = 100 pixels, each 1 bit, so 100 bits."}], "corrections": [{"said": "Image resolution is in dpi", "fix": "For AQA, image size is given as width x height in pixels, e.g. 8 x 8 = 64 pixels. dpi (dots per inch) describes how densely pixels are printed or displayed."}]}, {"id": "data-09", "title": "Bitmap images 2", "pdfPage": 33, "keyPoints": ["Colour depth (bit depth) is the number of bits used to store the colour of each pixel.", "n bits give 2^n colours: 1 bit = 2, 2 bits = 4, 3 bits = 8, 4 bits = 16, 8 bits = 256, 16 bits = 65,536.", "A higher colour depth gives more colours and better quality, but needs more storage.", "Image file size (bits) = width x height x colour depth. Divide by 8 to get bytes.", "To find the colour depth for a number of colours, find the smallest n where 2^n is at least that number, e.g. 5 colours need 3 bits.", "Convert the answer into the most suitable unit: bits / 8 = bytes, then / 1000 for KB, / 1000 again for MB."], "flashcards": [{"q": "What is colour depth?", "a": "The number of bits used to store the colour of each pixel. Also called bit depth."}, {"q": "How many colours can a 4-bit colour depth represent?", "a": "16 (2^4)."}, {"q": "What colour depth is needed for 256 colours?", "a": "8 bits (2^8 = 256)."}, {"q": "What is the minimum colour depth for an image with 5 colours?", "a": "3 bits. 2 bits give only 4 colours; 3 bits give 8."}, {"q": "What is the formula for the file size of a bitmap image?", "a": "Width x height x colour depth = size in bits. Divide by 8 for bytes."}, {"q": "An image is 600 x 700 pixels with a colour depth of 16 bits. What is its file size?", "a": "600 x 700 x 16 = 6,720,000 bits = 840,000 bytes = 840 KB."}, {"q": "An image is 800 x 1600 pixels and uses 5 colours. What is its file size?", "a": "5 colours need 3 bits. 800 x 1600 x 3 = 3,840,000 bits = 480,000 bytes = 480 KB."}, {"q": "How many megabytes is 20,800,000 bits?", "a": "20,800,000 / 8 = 2,600,000 bytes = 2.6 MB."}, {"q": "Convert 3,400,000 bits into the most appropriate unit.", "a": "3,400,000 / 8 = 425,000 bytes = 425 KB."}, {"q": "What happens when you increase the colour depth of an image?", "a": "More colours can be shown and quality improves, but the file size increases."}, {"q": "An 8 x 8 image uses 4 colours. What is its colour depth and file size?", "a": "Colour depth 2 bits. 8 x 8 x 2 = 128 bits = 16 bytes."}], "mcq": [{"q": "How many colours can be shown with a 16-bit colour depth?", "options": ["16", "256", "32,768", "65,536"], "answer": 3, "explain": "2^16 = 65,536 colours."}, {"q": "An image is 100 x 50 pixels with a colour depth of 8 bits. What is its file size in bytes?", "options": ["5,000", "40,000", "400", "50,000"], "answer": 0, "explain": "100 x 50 x 8 = 40,000 bits; / 8 = 5,000 bytes."}, {"q": "An image needs 20 different colours. What is the minimum colour depth?", "options": ["4 bits", "5 bits", "20 bits", "3 bits"], "answer": 1, "explain": "4 bits give only 16 colours; 5 bits give 32, which is enough."}, {"q": "The colour depth of an image is changed from 8 bits to 16 bits, with the same width and height. What happens?", "options": ["The number of colours doubles", "The file size halves", "The file size doubles", "Nothing changes"], "answer": 2, "explain": "Each pixel now uses twice as many bits, so the file size doubles. The number of colours goes from 256 to 65,536."}, {"q": "A file is 3,400,000 bits. What is this in the most appropriate unit?", "options": ["3.4 MB", "425 KB", "425 MB", "42.5 KB"], "answer": 1, "explain": "3,400,000 / 8 = 425,000 bytes = 425 KB."}], "corrections": [{"said": "Unit for resolution is dpi (dots per image)", "fix": "dpi means dots per inch. For this question the answer is the number of pixels: 8 x 8 = 64 pixels."}, {"said": "800 x 1600 image with 5 colours = 4.8 MB", "fix": "5 colours need 3 bits (2 bits give only 4). 800 x 1600 x 3 = 3,840,000 bits; / 8 = 480,000 bytes = 480 KB."}, {"said": "20,800,000 bits = 26 MB", "fix": "20,800,000 / 8 = 2,600,000 bytes = 2.6 MB."}]}, {"id": "data-10", "title": "Sound", "pdfPage": 36, "keyPoints": ["Sound is analogue: continuous waves of changing air pressure. It must be converted to digital form to be stored on a computer.", "Sampling means measuring the amplitude of the sound wave at regular moments in time.", "Sampling rate is the number of samples taken per second, measured in hertz (Hz). 44.1 kHz means 44,100 samples per second.", "Sample resolution is the number of bits used to store each sample.", "A higher sampling rate or sample resolution makes the digital sound closer to the original, but makes the file larger.", "Sound file size (bits) = sampling rate (Hz) x sample resolution (bits) x length (seconds). Divide by 8 for bytes.", "Always convert the length to seconds first, e.g. 3 minutes = 180 s and 2.5 minutes = 150 s."], "flashcards": [{"q": "Why must sound be converted before a computer can store it?", "a": "Sound is analogue (continuous) and computers can only store digital (binary) data."}, {"q": "What is a sample?", "a": "A measurement of the amplitude of the sound wave at one moment in time."}, {"q": "What is the sampling rate, and what is its unit?", "a": "The number of samples taken per second, measured in hertz (Hz)."}, {"q": "What does a sampling rate of 44.1 kHz mean?", "a": "44,100 samples are taken every second."}, {"q": "What is sample resolution?", "a": "The number of bits used to store each sample."}, {"q": "What is the formula for the size of a sound file?", "a": "Sampling rate (Hz) x sample resolution (bits) x length (seconds) = size in bits."}, {"q": "Find the file size: 12 kHz, 8-bit resolution, 3 minutes.", "a": "12,000 x 8 x 180 = 17,280,000 bits = 2,160,000 bytes = 2,160 KB (2.16 MB)."}, {"q": "Find the file size: 44.1 kHz, 24-bit resolution, 2.5 minutes.", "a": "44,100 x 24 x 150 = 158,760,000 bits = 19,845,000 bytes = 19.845 MB."}, {"q": "What is the size in bits of a recording at 50 Hz, 8 bits, 30 seconds?", "a": "50 x 8 x 30 = 12,000 bits (1,500 bytes)."}, {"q": "A sound file is 2.6 MB. How many bits is this?", "a": "2,600,000 bytes x 8 = 20,800,000 bits."}, {"q": "What is the effect of increasing the sample resolution?", "a": "Each sample is recorded more accurately, so quality improves, but the file size increases."}], "mcq": [{"q": "What unit is the sampling rate measured in?", "options": ["Bits", "Hertz (Hz)", "Decibels", "Bytes per second"], "answer": 1, "explain": "Sampling rate is a frequency: samples per second, measured in hertz."}, {"q": "A 10 second jingle is sampled at 8,000 Hz with a 16-bit sample resolution. What is the file size?", "options": ["20 KB", "1,280 KB", "160 MB", "160 KB"], "answer": 3, "explain": "8,000 x 16 x 10 = 1,280,000 bits; / 8 = 160,000 bytes = 160 KB."}, {"q": "What does sample resolution mean?", "options": ["The number of samples taken each second", "The length of the recording", "The number of bits used to store each sample", "The volume of the sound"], "answer": 2, "explain": "Sample resolution is the number of bits per sample, like colour depth for images."}, {"q": "Which change would make a digital recording closer to the original sound?", "options": ["Increasing the sampling rate", "Reducing the sample resolution", "Reducing the sampling rate", "Making the recording shorter"], "answer": 0, "explain": "Taking more samples each second captures the shape of the wave more accurately."}, {"q": "A 200 second recording is sampled at 44,100 Hz with 16-bit resolution. What is its size?", "options": ["141.12 MB", "17.64 MB", "2.205 MB", "1.764 MB"], "answer": 1, "explain": "44,100 x 16 x 200 = 141,120,000 bits; / 8 = 17,640,000 bytes = 17.64 MB."}, {"q": "A 2 minute track is sampled at 8 Hz with a 4-bit resolution. What is its size in bytes?", "options": ["480", "3,840", "60", "240"], "answer": 0, "explain": "8 x 4 x 120 = 3,840 bits; / 8 = 480 bytes."}], "corrections": [{"said": "12 kHz, 8 bits, 3 minutes = 216 KB", "fix": "12,000 x 8 x 180 = 17,280,000 bits; / 8 = 2,160,000 bytes = 2160 KB (2.16 MB)."}, {"said": "44.1 kHz, 24 bits, 2.5 minutes = 21.168 MB", "fix": "2.5 minutes is 150 seconds, not 160. 44,100 x 24 x 150 = 158,760,000 bits; / 8 = 19,845,000 bytes = 19.845 MB."}, {"said": "Task 2 Q1-5 (asked for size in bits) answered as 1.5 KB, 18.75 KB, 180 KB, 600 KB, 441 KB", "fix": "The KB values are right, but the questions asked for bits: 12,000; 150,000; 1,440,000; 4,800,000; and 3,528,000 bits (rate x resolution x seconds, without dividing by 8)."}]}, {"id": "data-11", "title": "Compression 1: lossy, lossless and RLE", "pdfPage": 42, "keyPoints": ["Compression makes files smaller so they take up less storage and transfer or download faster.", "Compression works by removing data redundancy: data that is repeated unnecessarily.", "Lossless compression lets the original data be restored exactly. It is needed for text and program files.", "Lossy compression permanently removes some data to make the file much smaller. It is used for images, sound and video, but is not suitable for text.", "Run length encoding (RLE) is a lossless method that replaces runs of repeated data with frequency/data pairs.", "Example: `0000011100` becomes 5 0, 3 1, 2 0 (how many, then which value).", "RLE works best when there are long runs of the same value. With few repeats it can make the data bigger."], "flashcards": [{"q": "What is data compression?", "a": "Reducing the size of a file so it takes up less storage space, while still letting the data be used."}, {"q": "Give two reasons for compressing files.", "a": "They take up less storage space, and they transfer or download more quickly."}, {"q": "What is data redundancy?", "a": "Data that is repeated unnecessarily. Compression removes it."}, {"q": "What is lossless compression?", "a": "Compression where the file can be decompressed back to exactly the original data."}, {"q": "What is lossy compression?", "a": "Compression that permanently removes some data to make the file smaller. The original cannot be restored exactly."}, {"q": "Which type of compression must be used for text, and why?", "a": "Lossless. Losing any data would change the text, e.g. letters would be missing or wrong."}, {"q": "Name types of file that can use lossy compression.", "a": "Images, sound and video (e.g. JPEG photos and MP3 music)."}, {"q": "What is run length encoding (RLE)?", "a": "A lossless compression method that stores each run of repeated data as a pair: how many times it repeats, then the value."}, {"q": "Write `0000011100` using RLE.", "a": "5 0, 3 1, 2 0"}, {"q": "Expand the RLE data 3 0, 2 1, 1 0, 2 1, 3 0.", "a": "`00011011000`"}, {"q": "When is RLE not effective?", "a": "When the data has few runs of repeated values. It can even make the file larger."}], "mcq": [{"q": "Which type of compression allows the original file to be restored exactly?", "options": ["Lossy", "Lossless", "Both lossy and lossless", "Neither"], "answer": 1, "explain": "Lossless compression removes only redundant data, so it can be fully reversed."}, {"q": "Which file is least suitable for lossy compression?", "options": ["A holiday photo", "A music track", "A text document", "A video clip"], "answer": 2, "explain": "Losing data from text would change the words. Images, sound and video can lose small details unnoticed."}, {"q": "What is the RLE for a row of eleven 1s, `11111111111`?", "options": ["11 1", "1 11", "1 1 1 1", "11 0"], "answer": 0, "explain": "There is one run: 11 copies of the value 1."}, {"q": "What is the RLE for the row `00100000100`?", "options": ["2 0, 1 1, 6 0, 1 1, 1 0", "0 2, 1 1, 0 5, 1 1, 0 2", "2 1, 1 0, 5 1, 1 0, 2 1", "2 0, 1 1, 5 0, 1 1, 2 0"], "answer": 3, "explain": "Count each run in order: two 0s, one 1, five 0s, one 1, two 0s."}, {"q": "Which statement about RLE is true?", "options": ["It permanently deletes data", "It works best on data with few repeated values", "It is a lossless method", "It can only be used on text"], "answer": 2, "explain": "The runs can be expanded back into exactly the original data."}], "corrections": [{"said": "Lossless compression is needed for sound files and text", "fix": "Text and program files need lossless compression. Sound (and images and video) can use lossy compression, e.g. MP3."}]}, {"id": "data-12", "title": "Compression 2: Huffman coding", "pdfPage": 46, "keyPoints": ["Huffman coding is a lossless compression method, often used for text.", "It uses a binary tree. Each character is a leaf, and each branch is labelled 0 (left) or 1 (right).", "A character's code is found by following the path from the root to that character.", "More frequent characters are nearer the root, so they get shorter codes. This reduces the total number of bits.", "The root node's value is the total number of characters; each node's value is the sum of its two children.", "Uncompressed size in 7-bit ASCII = number of characters x 7, e.g. ABRACADABRA = 11 x 7 = 77 bits.", "Compressed size = for each character, frequency x code length, all added up. ABRACADABRA compresses to 23 bits, saving 54 bits."], "flashcards": [{"q": "What is Huffman coding?", "a": "A lossless compression method, often used for text, that gives frequent characters shorter binary codes using a binary tree."}, {"q": "In a Huffman tree, what do the left and right branches represent?", "a": "Left = 0 and right = 1."}, {"q": "How do you find a character's code from a Huffman tree?", "a": "Follow the path from the root to the character, writing 0 for each left branch and 1 for each right branch."}, {"q": "Why do the most frequent characters get the shortest codes?", "a": "They appear most often, so giving them short codes reduces the total number of bits."}, {"q": "What does the value at the root of a Huffman tree represent?", "a": "The total number of characters in the text."}, {"q": "How many bits are needed to store ABRACADABRA in 7-bit ASCII?", "a": "77 bits (11 characters x 7)."}, {"q": "What are the character frequencies in ABRACADABRA?", "a": "A 5, B 2, R 2, C 1, D 1."}, {"q": "With codes A = `0`, B = `110`, R = `111`, C = `100`, D = `101`, how many bits does ABRACADABRA need?", "a": "23 bits: A 5 x 1 + B 2 x 3 + R 2 x 3 + C 1 x 3 + D 1 x 3."}, {"q": "How many bits does Huffman coding save on ABRACADABRA compared with 7-bit ASCII?", "a": "54 bits (77 - 23)."}, {"q": "Is Huffman coding lossy or lossless?", "a": "Lossless: the original text can be decoded exactly."}], "mcq": [{"q": "Using A = `0`, B = `10`, C = `11`, how many bits are needed for ABACA?", "options": ["5", "7", "10", "35"], "answer": 1, "explain": "A, B, A, C, A = 1 + 2 + 1 + 2 + 1 = 7 bits."}, {"q": "In a Huffman tree, which character gets the shortest code?", "options": ["The least frequent character", "The character that comes first in the alphabet", "The most frequent character", "The last character in the text"], "answer": 2, "explain": "The most frequent character is placed closest to the root."}, {"q": "How many bits are needed to store HELLO in 7-bit ASCII?", "options": ["35", "40", "5", "28"], "answer": 0, "explain": "5 characters x 7 bits = 35 bits."}, {"q": "Using A = `0`, B = `10`, C = `11`, decode `01011`.", "options": ["ACB", "BAC", "AAB", "ABC"], "answer": 3, "explain": "Read left to right: `0` = A, `10` = B, `11` = C."}, {"q": "What does the number at the root node of a Huffman tree show?", "options": ["The number of different characters", "The total number of characters in the text", "The length of the longest code", "The number of bits saved"], "answer": 1, "explain": "Each node holds the sum of its children's frequencies, so the root holds the total."}], "corrections": [{"said": "Bit depth = number of characters x 7 (ASCII)", "fix": "Number of characters x 7 is the uncompressed size in 7-bit ASCII, not 'bit depth'. ABRACADABRA = 11 x 7 = 77 bits; Huffman coding reduces it to 23 bits."}]}, {"id": "data-13", "title": "Compression 3: building Huffman trees", "pdfPage": 48, "keyPoints": ["Step 1: count the frequency of every character, including spaces and punctuation. Upper and lower case letters are different characters.", "Step 2: list the characters in order of frequency, from lowest to highest.", "Step 3: join the two lowest-frequency nodes under a new node whose value is the sum of their frequencies.", "Step 4: put the new node back into the list in order, after any existing nodes with the same frequency.", "Repeat steps 3 and 4 until only one node is left: the root, whose value is the total number of characters.", "Label each left branch 0 and each right branch 1, then read off each character's code.", "Codes can differ depending on how ties are ordered, but a correct Huffman tree always gives the same total number of bits."], "flashcards": [{"q": "What is the first step in building a Huffman tree?", "a": "Count how many times each character appears (its frequency)."}, {"q": "Do spaces and punctuation count when building a Huffman tree?", "a": "Yes. Every character counts, including spaces, punctuation and symbols."}, {"q": "Which two nodes are combined at each step?", "a": "The two nodes with the lowest frequencies."}, {"q": "What value does the new combined node get?", "a": "The sum of the frequencies of the two nodes it joins."}, {"q": "Where is the new node placed in the list?", "a": "In order of frequency, after any existing nodes with the same frequency."}, {"q": "When is the Huffman tree finished?", "a": "When only one node is left. This is the root."}, {"q": "What are the character frequencies in COMMITMENT?", "a": "M 3, T 2, and C, O, I, E, N 1 each (10 characters)."}, {"q": "How many bits does COMMITMENT need in 7-bit ASCII and with Huffman coding?", "a": "70 bits in ASCII (10 x 7) and 27 bits with Huffman coding."}, {"q": "How many characters are in 'She sells sea shells.'?", "a": "21, including the 3 spaces and the full stop. In 7-bit ASCII that is 147 bits."}, {"q": "In 'She sells sea shells.', what is the frequency of lower case 's'?", "a": "5. The capital 'S' is a different character with frequency 1."}], "mcq": [{"q": "Characters have frequencies 1, 1, 2 and 3. What is the value of the first new node?", "options": ["2", "3", "4", "1"], "answer": 0, "explain": "The two lowest frequencies (1 and 1) are combined: 1 + 1 = 2."}, {"q": "In ACCOMMODATE, what is the frequency of the letter C?", "options": ["1", "3", "2", "4"], "answer": 2, "explain": "A-C-C-O-M-M-O-D-A-T-E contains C twice."}, {"q": "A Huffman tree for COMMITMENT gives M = `10`, T = `111`, N = `110`, C = `000`, O = `001`, I = `010`, E = `011`. How many bits are needed?", "options": ["70", "24", "30", "27"], "answer": 3, "explain": "M 3 x 2 + T 2 x 3 + N 1 x 3 + (C, O, I, E) 4 x 3 = 6 + 6 + 3 + 12 = 27 bits."}, {"q": "Two students build correct Huffman trees for the same word but get different codes. Why?", "options": ["One of them must have made a mistake", "Tied frequencies can be ordered differently, but the total bits stay the same", "Huffman codes are chosen at random", "They used different ASCII tables"], "answer": 1, "explain": "Ties can be placed in different orders. Any correct tree gives the same compressed size."}, {"q": "When is a Huffman tree complete?", "options": ["When every node has a frequency of 1", "When all characters are in alphabetical order", "When only one node, the root, is left", "After exactly 7 steps"], "answer": 2, "explain": "Nodes are combined until a single root node remains."}]}]}, {"topic": "algorithms", "name": "Algorithms", "lessons": [{"id": "alg-01", "title": "Decomposition and abstraction", "pdfPage": 52, "keyPoints": ["Computational thinking is a problem-solving approach: understanding a problem and developing a step-by-step solution that a computer or a person could carry out.", "Its four cornerstones are decomposition, abstraction, pattern recognition and algorithms.", "Decomposition means breaking a problem into smaller sub-problems, each of which carries out an identifiable task. Sub-problems can be broken down further.", "Smaller sub-problems are easier to understand, solve and test, and can be shared out among a team.", "Abstraction means removing unnecessary detail from a problem so you can focus on what matters.", "The London Underground map is an abstraction: it keeps lines, stations and connections but leaves out real distances and geography.", "Abstraction hides how something works (a car's gearbox, a TV remote's circuits) so you only deal with what it does."], "flashcards": [{"q": "What is decomposition?", "a": "Breaking a problem down into smaller sub-problems, each of which carries out an identifiable task. Each sub-problem can be broken down further if needed."}, {"q": "What is abstraction?", "a": "Removing unnecessary detail from a problem so you can focus on the details that matter for solving it."}, {"q": "Name the four cornerstones of computational thinking.", "a": "Decomposition, abstraction, pattern recognition and algorithms."}, {"q": "What is computational thinking?", "a": "A problem-solving approach: understanding a problem and working out a step-by-step solution that a computer (or a person) could carry out."}, {"q": "Give two benefits of decomposition.", "a": "Each smaller problem is easier to understand and solve; parts can be solved and tested separately or shared out among a team."}, {"q": "Why is the London Underground map an example of abstraction?", "a": "It shows only lines, stations and connections. Real distances, geography and depth are removed because they are not needed to plan a journey."}, {"q": "Learning to drive without knowing how the gearbox works is an example of what?", "a": "Abstraction: you use what the car does (change gear) while the details of how it works are hidden."}, {"q": "Decompose the task \"create a mobile app\" into three sub-problems.", "a": "For example: design the screens (user interface), decide how to store the user's data, code each feature. Testing and publishing are further sub-problems."}], "mcq": [{"q": "Which statement best describes abstraction?", "options": ["Removing unnecessary detail to focus on what is important", "Breaking a problem into smaller sub-problems", "Spotting similarities between problems", "Writing a sequence of steps to solve a problem"], "answer": 0, "explain": "Abstraction removes detail that is not needed. Breaking a problem down is decomposition."}, {"q": "Which of these is an example of decomposition?", "options": ["Splitting a game project into graphics, scoring and controls", "Drawing a map that shows only stations and lines", "Noticing that two programs both need a login screen", "Following a recipe one step at a time"], "answer": 0, "explain": "Decomposition breaks a large problem into smaller parts that can each be solved separately."}, {"q": "A sat-nav shows roads and junctions but not the colour of the buildings. Which technique is this?", "options": ["Decomposition", "Iteration", "Pattern recognition", "Abstraction"], "answer": 3, "explain": "Detail that is not needed for navigation has been removed, which is abstraction."}, {"q": "Which of these is NOT one of the four cornerstones of computational thinking?", "options": ["Abstraction", "Decomposition", "Iteration", "Pattern recognition"], "answer": 2, "explain": "The four cornerstones are decomposition, abstraction, pattern recognition and algorithms. Iteration is a programming construct."}, {"q": "Why is decomposition useful when solving a large problem?", "options": ["It removes the need to test the finished program", "Each smaller part is easier to solve and can be worked on separately", "It makes the processor run the program faster", "It hides every detail of the problem from the programmer"], "answer": 1, "explain": "Smaller sub-problems are easier to understand, solve and test, and can be shared among a team."}]}, {"id": "alg-02", "title": "Pattern recognition and algorithms", "pdfPage": 61, "keyPoints": ["Pattern recognition means spotting similarities between problems, or within a problem, so a solution that has already been developed can be reused.", "An algorithm is a sequence of steps that can be followed to complete a task.", "An algorithm is not a computer program: a program is an implementation of an algorithm in a programming language.", "Algorithms do not need a computer: a recipe, a set of directions and brushing your teeth are all algorithms.", "The three basic programming constructs are sequence, selection and iteration. Assignment gives a variable a value, e.g. `PI ← 3.142`.", "Selection chooses which instructions run, depending on whether a condition is True or False.", "Iteration repeats instructions, either a set number of times (definite) or until a condition is met (indefinite)."], "flashcards": [{"q": "What is an algorithm?", "a": "A sequence of steps that can be followed to complete a task or solve a problem."}, {"q": "What is the difference between an algorithm and a program?", "a": "A program is an implementation of an algorithm in a programming language. The algorithm is the steps themselves and does not need a computer."}, {"q": "What is pattern recognition?", "a": "Spotting similarities between problems, or parts of a problem, so that a solution already developed can be reused."}, {"q": "What is assignment?", "a": "Giving a variable a value, for example `score ← 0`."}, {"q": "What is selection?", "a": "A decision: which instructions run depends on whether a condition is True or False, for example `IF ... THEN ... ELSE ... ENDIF`."}, {"q": "What is iteration?", "a": "Repeating a set of instructions, either a fixed number of times or until a condition is met."}, {"q": "What is sequence?", "a": "Instructions carried out one after another, in the order they are written."}, {"q": "Name the three basic programming constructs.", "a": "Sequence, selection and iteration."}, {"q": "Give one advantage and one disadvantage of writing an algorithm before coding.", "a": "Advantage: the problem is set out as clear steps that are easy to turn into code. Disadvantage: it takes time, and complex logic can be hard to follow."}, {"q": "Give two everyday examples of algorithms.", "a": "For example: a recipe, directions to a friend's house, the steps for brushing your teeth or building flat-pack furniture."}], "mcq": [{"q": "Which statement about algorithms and programs is correct?", "options": ["An algorithm can only be carried out by a computer", "A program is an implementation of an algorithm", "Every algorithm is a computer program", "An algorithm must be written in a programming language"], "answer": 1, "explain": "An algorithm is a sequence of steps; a program is one way of implementing those steps on a computer."}, {"q": "The line `PI ← 3.142` is an example of which construct?", "options": ["Selection", "Iteration", "Pattern recognition", "Assignment"], "answer": 3, "explain": "The value 3.142 is being stored in the variable PI, which is assignment."}, {"q": "Which line of pseudocode is an example of selection?", "options": ["`FOR i ← 1 TO 3`", "`total ← total + 1`", "`IF age ≥ 18 THEN`", "`WHILE x < 10`"], "answer": 2, "explain": "IF chooses whether code runs depending on a condition. FOR and WHILE are iteration; `total ← total + 1` is assignment."}, {"q": "Software compares thousands of medical scans to find features shared by early-stage cancers. Which technique does this mainly use?", "options": ["Decomposition", "Pattern recognition", "Abstraction", "Assignment"], "answer": 1, "explain": "It looks for similarities (patterns) across many examples."}, {"q": "Which describes iteration?", "options": ["Repeating instructions a set number of times or until a condition is met", "Choosing between two paths based on a condition", "Storing a value in a variable", "Breaking a problem into smaller parts"], "answer": 0, "explain": "Iteration means repetition. Choosing a path is selection; storing a value is assignment."}], "corrections": [{"said": "Selection is a container of things that can be inputted or outputted.", "fix": "Selection is a decision: which instructions run depends on whether a condition is True or False, e.g. `IF ... THEN ... ELSE ... ENDIF`."}, {"said": "Assignment is a value for the computer.", "fix": "Assignment means giving a variable a value, e.g. `score ← 0`."}, {"said": "Computational thinking is how a computer thinks.", "fix": "Computational thinking is a problem-solving approach people use: understanding a problem and developing a step-by-step solution a computer could carry out."}]}, {"id": "alg-03", "title": "Algorithms as flowcharts", "pdfPage": 70, "keyPoints": ["A flowchart represents an algorithm as a diagram of standard symbols joined by arrows that show the order of the steps.", "Terminal (rounded rectangle): Start and Stop.", "Parallelogram: input or output.", "Rectangle: a process, such as a calculation or assignment.", "Diamond: a decision, with two exits labelled Yes/No (or True/False).", "Subroutine: a rectangle with an extra vertical line down each side, with the subroutine's name inside.", "Arrows (flow lines) show the direction of flow. An arrow from a decision back to an earlier step creates a loop (iteration)."], "flashcards": [{"q": "Which flowchart symbol is used for Start and Stop?", "a": "A terminal: a rectangle with rounded ends (oval shape)."}, {"q": "Which flowchart symbol shows an input or an output?", "a": "A parallelogram."}, {"q": "Which flowchart symbol shows a process such as `total ← total + 1`?", "a": "A rectangle."}, {"q": "Which flowchart symbol shows a decision?", "a": "A diamond, with two exits labelled Yes/No or True/False."}, {"q": "How is a subroutine shown in a flowchart?", "a": "A rectangle with an extra vertical line down each side, with the subroutine's name written inside."}, {"q": "How many exits does a decision symbol have?", "a": "Two: one for Yes (True) and one for No (False)."}, {"q": "How does a flowchart show iteration?", "a": "An arrow from a decision loops back to an earlier step, so those steps are repeated."}, {"q": "What do the arrows in a flowchart show?", "a": "The direction of flow: the order in which the steps are carried out."}], "mcq": [{"q": "Which symbol should be used for \"OUTPUT total\" in a flowchart?", "options": ["Rectangle", "Diamond", "Parallelogram", "Rounded rectangle"], "answer": 2, "explain": "Inputs and outputs use a parallelogram."}, {"q": "In a flowchart for making tea, which symbol is used for \"Milk?\"", "options": ["Parallelogram", "Rectangle", "Diamond", "Rounded rectangle"], "answer": 2, "explain": "\"Milk?\" is a Yes/No question, so it is a decision, shown by a diamond."}, {"q": "Which symbol is used for the step \"Boil kettle\"?", "options": ["Diamond", "Rectangle", "Parallelogram", "Rounded rectangle"], "answer": 1, "explain": "Boiling the kettle is an action (a process), shown by a rectangle."}, {"q": "A rectangle with an extra vertical line down each side represents:", "options": ["A subroutine", "A decision", "An input", "The end of the algorithm"], "answer": 0, "explain": "This is the subroutine (procedure or function) symbol; its name goes inside."}, {"q": "An arrow leaves a decision box and goes back to an earlier box. What does this show?", "options": ["Assignment", "Abstraction", "Decomposition", "Iteration"], "answer": 3, "explain": "Going back to an earlier step makes those steps repeat, which is iteration."}], "corrections": [{"said": "Assignment is an assigned variable with a variable.", "fix": "Assignment means giving a variable a value, e.g. `total ← 0`."}, {"said": "Selection is a container of inputs and outputs.", "fix": "Selection chooses which code runs depending on whether a condition is True or False."}]}, {"id": "alg-04", "title": "Drawing complex flowcharts", "pdfPage": 74, "keyPoints": ["Complex flowcharts combine sequence, selection (decisions) and iteration (loops).", "A value input by the user is stored in a variable so it can be used later in the algorithm.", "A variable's value can change while the program runs; a constant's value cannot.", "Cuboid volume: input length, width and height (parallelograms), `volume ← length * width * height` (rectangle), output volume (parallelogram).", "Password check: input password, decision \"Correct?\"; No loops back to the input, Yes continues to \"Allow access\". This is indefinite iteration.", "Guessing game: generate a random number, input a guess, decide whether it is correct, too high or too low, and loop until it is correct.", "Every decision must have both of its exits labelled (Yes/No or True/False)."], "flashcards": [{"q": "What is the difference between a variable and a constant?", "a": "A variable's value can change while the program runs. A constant's value is set once and cannot change while the program runs."}, {"q": "Which symbols are needed in a flowchart that calculates the volume of a cuboid?", "a": "Start (terminal), three inputs (parallelograms), `volume ← length * width * height` (rectangle), output volume (parallelogram), Stop (terminal)."}, {"q": "How would a flowchart keep asking for a password until it is correct?", "a": "After the input, a decision \"Password correct?\": the No arrow loops back to the input; the Yes arrow continues to \"Allow access\"."}, {"q": "Is a rectangle used for input in a flowchart?", "a": "No. A rectangle is a process. Input and output use a parallelogram."}, {"q": "Why is the password loop an example of indefinite iteration?", "a": "We do not know in advance how many attempts the user will need; it repeats until a condition (correct password) is met."}, {"q": "Which decisions does a number-guessing game flowchart need?", "a": "Is the guess correct? If not, is it too high (otherwise too low)? Output the hint, then loop back to input another guess."}, {"q": "Why does a flowchart store an input in a variable?", "a": "So the value can be held and used later in the algorithm, e.g. in a calculation or a decision."}, {"q": "What formula converts Celsius to Fahrenheit?", "a": "F = C × 1.8 + 32, e.g. `fahrenheit ← celsius * 1.8 + 32`."}], "mcq": [{"q": "A flowchart asks for a password. If it is wrong, an arrow goes back to the input. Which construct is this?", "options": ["Definite iteration", "Assignment", "Abstraction", "Indefinite iteration"], "answer": 3, "explain": "The loop repeats until the password is correct; the number of repeats is not known in advance."}, {"q": "Which statement about flowchart symbols is true?", "options": ["A rectangle is used for an input", "A diamond is used for a decision", "A parallelogram is used for Start", "A decision has only one exit"], "answer": 1, "explain": "Decisions are diamonds with two exits. Inputs use parallelograms and Start uses a terminal."}, {"q": "A flowchart inputs a Celsius temperature of 20 and then runs the process below. What is output?", "code": "fahrenheit ← celsius * 1.8 + 32\nOUTPUT fahrenheit", "options": ["68", "36", "52", "77.6"], "answer": 0, "explain": "20 × 1.8 = 36, then 36 + 32 = 68."}, {"q": "A cuboid flowchart inputs length 3, width 4 and height 5. What volume is output?", "code": "volume ← length * width * height\nOUTPUT volume", "options": ["12", "94", "20", "60"], "answer": 3, "explain": "Volume = length × width × height = 3 × 4 × 5 = 60."}, {"q": "A program uses a VAT rate of 0.2 that never changes while it runs. How should it be stored?", "options": ["As a variable that is input each time", "As a decision", "As a constant", "As a subroutine"], "answer": 2, "explain": "A value that cannot change while the program runs should be a constant."}]}, {"id": "alg-05", "title": "Relational, arithmetic and Boolean operators", "pdfPage": 79, "keyPoints": ["Arithmetic operators: `+`, `-`, `*` (multiply) and `/` (real division, keeps the decimal part).", "`DIV` is integer division and gives only the whole-number part: `25 DIV 4` = 6. Python uses `//`.", "`MOD` gives the remainder: `25 MOD 4` = 1. Python uses `%`.", "Relational operators compare two values and give True or False: `=`, `≠`, `<`, `>`, `≤`, `≥` (Python: `==`, `!=`, `<`, `>`, `<=`, `>=`).", "Boolean operators combine conditions: AND (both must be True), OR (at least one True), NOT (reverses the value).", "In AQA pseudocode `←` assigns and `=` compares. In Python `=` assigns and `==` compares."], "flashcards": [{"q": "What does `DIV` do?", "a": "Integer division: divides and gives only the whole-number part. `17 DIV 5` = 3. Python uses `//`."}, {"q": "What does `MOD` do?", "a": "Gives the remainder after division. `17 MOD 5` = 2. Python uses `%`."}, {"q": "What is `25 MOD 4`?", "a": "1. Four goes into 25 six times (24), leaving a remainder of 1."}, {"q": "What is `7 / 2`?", "a": "3.5. Real division keeps the decimal part (`7 DIV 2` would give 3)."}, {"q": "What do relational operators do?", "a": "Compare two values. The result is always True or False."}, {"q": "How is \"not equal to\" written in AQA pseudocode and in Python?", "a": "`≠` in AQA pseudocode; `!=` in Python."}, {"q": "When is `A AND B` True?", "a": "Only when both A and B are True."}, {"q": "When is `A OR B` True?", "a": "When at least one of A or B is True."}, {"q": "What does NOT do?", "a": "Reverses a Boolean value: NOT True is False and NOT False is True."}, {"q": "Write AQA pseudocode to add 100 to `a`, multiply the result by 12 and store it in `num`.", "a": "`num ← (a + 100) * 12`"}], "mcq": [{"q": "What does this algorithm output?", "code": "x ← 17\ny ← 5\nOUTPUT x DIV y\nOUTPUT x MOD y", "options": ["3 then 2", "3.4 then 2", "2 then 3", "3 then 0.4"], "answer": 0, "explain": "17 DIV 5 is the whole-number part, 3. 17 MOD 5 is the remainder, 2."}, {"q": "What does this algorithm output?", "code": "x ← 10\ny ← 3\nOUTPUT (x MOD y) + (x DIV y)", "options": ["4", "3", "13", "1"], "answer": 0, "explain": "10 MOD 3 = 1 and 10 DIV 3 = 3, so the output is 1 + 3 = 4."}, {"q": "What does this algorithm output?", "code": "x ← 7\nOUTPUT (x > 5) AND (x < 10)", "options": ["False", "7", "An error", "True"], "answer": 3, "explain": "7 > 5 is True and 7 < 10 is True, so True AND True is True."}, {"q": "What does this algorithm output?", "code": "x ← 7\nOUTPUT NOT (x = 7) OR (x > 10)", "options": ["True", "7", "False", "10"], "answer": 2, "explain": "x = 7 is True, so NOT (x = 7) is False. x > 10 is False. False OR False is False."}, {"q": "Which operator
